<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under 200KB PDF Splitter</title>
    <!-- Load required libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        .upload-area { border: 2px dashed #4f46e5; border-radius: 8px; padding: 2rem; cursor: pointer; transition: background 0.3s; }
        .upload-area:hover { background: #eef2ff; }
        #status { margin-top: 1rem; font-weight: 500; color: #4f46e5; }
        #progress-bar { width: 100%; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 1rem; display: none; }
        #progress-fill { height: 8px; background: #4f46e5; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

<div class="container">
    <h2>Strict <200KB PDF Splitter</h2>
    <p>Upload a PDF. We will split it and compress any page over 200KB.</p>
    
    <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
        Click to Upload PDF
        <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
    </div>
    
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status"></div>
</div>

<script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const MAX_SIZE_BYTES = 200 * 1024; // 200 KB
    const inputElement = document.getElementById('pdfInput');
    const statusElement = document.getElementById('status');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');

    inputElement.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusElement.innerText = "Processing started...";
        progressBar.style.display = "block";
        progressFill.style.width = "0%";

        const arrayBuffer = await file.arrayBuffer();
        await processPDF(arrayBuffer, file.name.replace('.pdf', ''));
    });

    async function processPDF(originalPdfBytes, baseFilename) {
        const zip = new JSZip();
        
        // Load with PDF.js to get pages for rendering
        const loadingTask = pdfjsLib.getDocument({ data: originalPdfBytes });
        const pdfJsDoc = await loadingTask.promise;
        const totalPages = pdfJsDoc.numPages;

        for (let i = 1; i <= totalPages; i++) {
            statusElement.innerText = `Processing page ${i} of ${totalPages}...`;
            progressFill.style.width = `${(i / totalPages) * 100}%`;

            let finalPageBytes = await tryNativeSplit(originalPdfBytes, i - 1);

            // If the native split exceeds 200KB, aggressively compress it
            if (finalPageBytes.byteLength > MAX_SIZE_BYTES) {
                statusElement.innerText = `Page ${i} is too large. Compressing...`;
                const pageProxy = await pdfJsDoc.getPage(i);
                finalPageBytes = await compressPageToTarget(pageProxy);
            }

            zip.file(`${baseFilename}_page_${i}.pdf`, finalPageBytes);
        }

        statusElement.innerText = "Zipping files...";
        const zipContent = await zip.generateAsync({ type: "blob" });
        
        // Download Zip
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipContent);
        link.download = `${baseFilename}_split_compressed.zip`;
        link.click();

        statusElement.innerText = "Done! Download started.";
        setTimeout(() => { progressBar.style.display = "none"; statusElement.innerText = ""; }, 3000);
    }

    // Attempt 1: Fast, native split (preserves original vector quality)
    async function tryNativeSplit(pdfBytes, pageIndex) {
        const pdfDoc = await PDFLib.PDFDocument.create();
        const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
        const [copiedPage] = await pdfDoc.copyPages(srcDoc, [pageIndex]);
        pdfDoc.addPage(copiedPage);
        return await pdfDoc.save();
    }

    // Attempt 2: Rasterize to Image & Compress until it fits < 200KB
    async function compressPageToTarget(pageProxy) {
        let scale = 2.0; // Start with high resolution
        let quality = 0.8; // JPEG compression quality

        while (true) {
            const viewport = pageProxy.getViewport({ scale });
            
            // Create off-screen canvas
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await pageProxy.render({ canvasContext: context, viewport }).promise;
            const imgDataUrl = canvas.toDataURL('image/jpeg', quality);

            // Create new PDF with the flattened image
            const newPdf = await PDFLib.PDFDocument.create();
            const img = await newPdf.embedJpg(imgDataUrl);
            const page = newPdf.addPage([viewport.width, viewport.height]);
            page.drawImage(img, { x: 0, y: 0, width: viewport.width, height: viewport.height });

            const newPdfBytes = await newPdf.save();

            // Check constraint
            if (newPdfBytes.byteLength <= MAX_SIZE_BYTES) {
                return newPdfBytes; 
            }

            // Adjust compression matrix
            if (quality > 0.4) {
                quality -= 0.15; // Lower image quality first
            } else if (scale > 0.8) {
                scale -= 0.3; // If quality is low, lower resolution
                quality = 0.6; // Reset quality slightly for the lower resolution
            } else {
                // Failsafe break to avoid infinite loops on mathematically impossible pages
                return newPdfBytes; 
            }
        }
    }
</script>
</body>
</html>
