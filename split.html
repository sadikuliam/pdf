<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Clear PDF Splitter (&lt;200KB)</title>
    <!-- Essential CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --dropzone-bg: rgba(15, 23, 42, 0.6);
            --progress-track: rgba(255, 255, 255, 0.1);
        }

        :root[data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --dropzone-bg: rgba(241, 245, 249, 0.8);
            --progress-track: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s, border-color 0.3s, color 0.3s; }
        
        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 50%);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 12px;
        }

        /* Home Button Style */
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--dropzone-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .home-btn:hover { border-color: var(--accent); color: var(--accent); }

        .title-group h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
        .title-group p { font-size: 0.8rem; color: var(--text-sub); margin-top: 0.2rem; }

        .theme-toggle {
            background: var(--dropzone-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            background: var(--dropzone-bg);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
        }
        .drop-zone:hover { border-color: var(--accent); }
        .drop-zone svg { width: 48px; height: 48px; fill: none; stroke: var(--accent); stroke-width: 2; margin-bottom: 1rem; }
        
        .progress-wrapper { margin-top: 1.5rem; display: none; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 0.5rem; }
        .progress-bar { height: 8px; background: var(--progress-track); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

        .status-badge {
            margin-top: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            min-height: 1.25rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Top Left Home Button -->
        <a href="https://pdf.shmwb.in/" class="home-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>

        <div class="title-group">
            <h1>Ultra Sharp PDF Splitter</h1>
            <p>Strictly &lt;200KB per page • High DPI</p>
        </div>

        <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <p style="font-weight: 600; margin-bottom: 0.25rem;">PDF ফাইল এখানে ড্রপ করুন অথবা ক্লিক করুন</p>
        <p style="font-size: 0.8rem; color: var(--text-sub);">HD Crisp rendering engine active</p>
        <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
    </div>

    <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-header">
            <span id="progressTask">প্রসেসিং চলছে...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="status-badge" id="statusText"></div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    const MAX_BYTES = 200 * 1024; // Strict 200 KB Threshold

    // Dark/Light Theme Switching
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        themeBtn.innerHTML = nextTheme === 'dark' 
            ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`
            : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    });

    // File Input Logic
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        showProgress(true);
        updateStatus("PDF পড়া হচ্ছে...", 5);

        try {
            const arrayBuffer = await file.arrayBuffer();
            const zip = new JSZip();
            
            const pdfJsDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const totalPages = pdfJsDoc.numPages;

            for (let i = 1; i <= totalPages; i++) {
                const percent = Math.round((i / totalPages) * 100);
                updateStatus(`Page ${i} of ${totalPages} নিখুঁত করা হচ্ছে...`, percent);

                // Phase 1: Lossless Native Extraction Check
                let pageBytes = await extractNativeVectorPage(arrayBuffer, i - 1);

                // Phase 2: Ultra High-DPI Re-rendering Engine (if page size > 200 KB)
                if (!pageBytes || pageBytes.byteLength > MAX_BYTES) {
                    const pageProxy = await pdfJsDoc.getPage(i);
                    pageBytes = await renderCrispHDPage(pageProxy);
                }

                zip.file(`${file.name.replace('.pdf','')}_Page_${i}.pdf`, pageBytes);
            }

            updateStatus("ZIP ফাইল তৈরি হচ্ছে...", 99);
            const zipBlob = await zip.generateAsync({ type: "blob" });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = `${file.name.replace('.pdf','')}_UltraClear_Under200KB.zip`;
            link.click();

            updateStatus("সম্পন্ন হয়েছে! ডাউনলোড শুরু হচ্ছে...", 100);
            setTimeout(() => showProgress(false), 3000);
        } catch (err) {
            console.error(err);
            updateStatus("PDF প্রসেস করতে সমস্যা হয়েছে। অন্য একটি চেষ্টা করুন।", 0);
        }
    });

    // Phase 1: Pure Vector Direct Splitter
    async function extractNativeVectorPage(srcBuffer, pageIdx) {
        try {
            const srcDoc = await PDFLib.PDFDocument.load(srcBuffer, { ignoreEncryption: true });
            const destDoc = await PDFLib.PDFDocument.create();
            const [copiedPage] = await destDoc.copyPages(srcDoc, [pageIdx]);
            destDoc.addPage(copiedPage);
            const bytes = await destDoc.save();
            return bytes.byteLength <= MAX_BYTES ? bytes : null;
        } catch (e) {
            return null;
        }
    }

    // Phase 2: Ultra-Sharp Multi-Scale Render Engine
    async function renderCrispHDPage(pageProxy) {
        let currentScale = 3.0; 
        let currentQuality = 0.85;
        let bestFallbackBytes = null;

        while (currentScale >= 0.8) {
            const viewport = pageProxy.getViewport({ scale: currentScale });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            await pageProxy.render({ canvasContext: ctx, viewport }).promise;

            const imgDataUrl = canvas.toDataURL('image/jpeg', currentQuality);
            const pdfDoc = await PDFLib.PDFDocument.create();
            const img = await pdfDoc.embedJpg(imgDataUrl);
            
            const origViewport = pageProxy.getViewport({ scale: 1.0 });
            const page = pdfDoc.addPage([origViewport.width, origViewport.height]);
            page.drawImage(img, { x: 0, y: 0, width: origViewport.width, height: origViewport.height });

            const pdfBytes = await pdfDoc.save();
            bestFallbackBytes = pdfBytes;

            if (pdfBytes.byteLength <= MAX_BYTES) {
                return pdfBytes;
            }

            if (currentQuality > 0.50) {
                currentQuality -= 0.12;
            } else {
                currentScale -= 0.4;
                currentQuality = 0.80;
            }
        }

        return bestFallbackBytes;
    }

    function updateStatus(text, percent) {
        document.getElementById('statusText').innerText = text;
        document.getElementById('progressTask').innerText = text;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('progressFill').style.width = `${percent}%`;
    }

    function showProgress(show) {
        document.getElementById('progressWrapper').style.display = show ? 'block' : 'none';
    }
</script>
</body>
</html>
