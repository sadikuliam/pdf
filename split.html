<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>SHM Scanner Pro</title>

    

    <!-- PWA Manifest Link -->

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2563eb">

    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />

    <style>

        :root { --primary: #2563eb; --whatsapp: #25d366; --bg: #f8fafc; --text: #1e293b; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        

        header { background: #fff; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }

        

        .step { display: none; flex: 1; overflow-y: auto; padding: 1rem; }

        .step.active { display: flex; flex-direction: column; }

        

        .pdf-btn { display:block; padding:12px 20px; background:linear-gradient(135deg,#007BFF,#00C6FF); color:#fff; text-decoration:none; font-family:Arial,sans-serif; font-size:16px; font-weight:bold; text-align:center; border-radius:12px; box-shadow:0 4px 10px rgba(0,123,255,.2); transition:all .3s ease; margin: 10px; }

        

        .btn { background: var(--primary); color: white; border: none; padding: 1rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }

        .btn:active { transform: scale(0.98); }

        .btn-whatsapp { background: var(--whatsapp); }

        .btn-outline { background: #fff; border: 2px solid #e2e8f0; color: var(--text); }

        

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }

        .editor-container { flex: 1; background: #000; border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }

        .page-card { background: #fff; padding: 0.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }

        

        #loader-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }

    </style>

</head>

<body>



<header>

    <div style="display:flex; align-items:center; gap:10px;">

        <img src="LOGO.png" alt="Logo" style="height:35px; width:auto; border-radius:6px;">

        <span style="font-weight: 800;">SHM Scanner</span>

    </div>

    

    <div style="display:flex; gap:5px;">

        <!-- এই বাটনটি সব সময় থাকবে -->

        <button id="install-btn" class="btn" style="background: #e11d48; padding: 0.4rem 0.8rem; font-size: 0.7rem;">Install App</button>

        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;" onclick="location.reload()">Reset</button>

    </div>

</header>



<a href="compress.html" class="pdf-btn">

    📄 Split & Compress PDF

</a>



<div id="loader-overlay"><div class="spinner" style="width:40px; height:40px; border:4px solid #ddd; border-top:4px solid var(--primary); border-radius:50%; animation: spin 1s linear infinite; margin-bottom:1rem;"></div><div id="loader-text">Processing...</div></div>



<!-- Step 1: Capture -->

<div id="step-1" class="step active">

    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 1.5rem;">

        <label class="btn" style="width: 100%; padding: 2rem;">📸 Capture Page<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleFile(event)"></label>

        <label class="btn btn-outline" style="width: 100%;">🖼️ Import from Gallery<input type="file" accept="image/*" style="display:none;" onchange="handleFile(event)"></label>

    </div>

</div>



<!-- Step 2: Edit -->

<div id="step-2" class="step">

    <div class="editor-container"><img id="editor-image" /></div>

    <div class="btn-group">

        <button class="btn btn-outline" onclick="goToStep(1)">Cancel</button>

        <button class="btn" onclick="savePage()">Save Page</button>

    </div>

</div>



<!-- Step 3: Preview -->

<div id="step-3" class="step">

    <div class="grid" id="pages-grid"></div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">

        <button class="btn btn-outline" onclick="goToStep(1)">+ Add More</button>

        <button class="btn btn-outline" style="border-color: #cbd5e1;" onclick="resetScanner()">🏠 Go to Home</button>

        <div class="btn-group" style="margin-top:0;">

            <button class="btn" style="background: #059669;" onclick="exportPDF()">Download</button>

            <button class="btn btn-whatsapp" onclick="sharePDF()">WhatsApp ✈️</button>

        </div>

    </div>

</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

    // --- PWA Logic ---

    let deferredPrompt;

    const installBtn = document.getElementById('install-btn');



    window.addEventListener('beforeinstallprompt', (e) => {

        e.preventDefault();

        deferredPrompt = e;

    });



    installBtn.addEventListener('click', () => {

        if (deferredPrompt) {

            deferredPrompt.prompt();

            deferredPrompt.userChoice.then((choiceResult) => {

                deferredPrompt = null;

            });

        } else {

            alert("অ্যাপটি ইতিমধ্যে ইন্সটল করা আছে অথবা ব্রাউজার সাপোর্ট করছে না।");

        }

    });



    if ('serviceWorker' in navigator) {

        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));

    }



    // --- App Logic ---

    let pages = []; let cropper = null;

    const editorImg = document.getElementById('editor-image');

    

    function goToStep(s) {

        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));

        document.getElementById('step-'+s).classList.add('active');

        if(s === 3) renderGrid();

    }



    function resetScanner() {

        pages = [];

        renderGrid();

        goToStep(1);

    }



    async function handleFile(e) {

        const file = e.target.files[0];

        if(!file) return;

        const reader = new FileReader();

        reader.onload = (ev) => {

            editorImg.src = ev.target.result;

            goToStep(2);

            if(cropper) cropper.destroy();

            cropper = new Cropper(editorImg, { aspectRatio: 1/1.414, viewMode: 1 });

        };

        reader.readAsDataURL(file);

    }



    async function savePage() {

        document.getElementById('loader-overlay').style.display = 'flex';

        const canvas = cropper.getCroppedCanvas({ width: 1200 });

        const quality = Math.max(0.2, 0.6 - (pages.length * 0.1));

        pages.push(canvas.toDataURL('image/jpeg', quality));

        document.getElementById('loader-overlay').style.display = 'none';

        goToStep(3);

    }



    function renderGrid() {

        const grid = document.getElementById('pages-grid');

        grid.innerHTML = '';

        pages.forEach((p, i) => {

            grid.innerHTML += `<div class="page-card"><img src="${p}" style="width:100%"><button onclick="pages.splice(${i},1); renderGrid()" style="width:100%; margin-top:5px;">Remove</button></div>`;

        });

    }



    function generatePdfBlob() {

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF('p', 'mm', 'a4');

        pages.forEach((p, i) => {

            if(i > 0) pdf.addPage();

            pdf.addImage(p, 'JPEG', 10, 10, 190, 277);

        });

        return pdf.output('blob');

    }



    async function exportPDF() {

        const blob = generatePdfBlob();

        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');

        a.href = url; a.download = "document.pdf"; a.click();

    }



    async function sharePDF() {

        const blob = generatePdfBlob();

        const file = new File([blob], "document.pdf", { type: "application/pdf" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {

            await navigator.share({ files: [file], title: 'SHM Scan', text: 'Document scan' });

        } else {

            alert("শেয়ারিং সাপোর্ট করছে না।");

            exportPDF();

        }

    }

</script>

</body>

</html>
