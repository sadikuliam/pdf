    <style>

            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #111827;
            --bg-panel: #1f2937;

            --danger: #ef4444;
        }

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .tool-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;

            gap: 15px;
            border-bottom: 2px solid var(--primary);
        }

        .toolbar-title {

            display: flex;

        }

        select {
            padding: 8px 12px;

        }

        }

        .person-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 10px 15px;

        .btn-remove {

<body>

    <div class="tool-container">

        <div class="toolbar">

            <div class="toolbar-title">
                <i class="fa-solid fa-users-viewfinder"></i>
                Mixed Print Pro
            </div>

            <select id="paper-size" onchange="drawLayout()">

                <option value="A4">
                    Paper: A4 Sheet
                </option>

                <option value="Letter">
                    Paper: US Letter
                </option>

                <option value="4x6">
                    Paper: 4x6 Inch
                </option>

            </select>

        </div>


        <div class="person-panel" id="person-panel">

            <div id="persons-container"></div>

            <button
                class="add-person-btn"
                onclick="addPersonRow()">

                <i class="fa-solid fa-user-plus"></i>
                Add Person

            </button>

        </div>


        <div class="workspace">

            <div
                class="paper-preview-wrapper"
                id="preview-wrapper">

                <canvas id="main-canvas"></canvas>

            </div>

        </div>


        <div class="actions-bar">

            <button
                class="action-btn btn-pdf"
                onclick="downloadPDF()">

                <i class="fa-solid fa-file-pdf"></i>
                Download PDF

            </button>


            <button
                class="action-btn btn-print"
                onclick="printPage()">

                <i class="fa-solid fa-print"></i>
                Direct Print

            </button>

        </div>

    </div>


    <script>

        const canvas =
            document.getElementById('main-canvas');

        const ctx =
            canvas.getContext('2d');

        const paperSelect =
            document.getElementById('paper-size');

        const previewWrapper =
            document.getElementById('preview-wrapper');


        let persons = [];


        const MM_TO_PX = 11.811;


        const paperDimensions = {

            'A4': {
                w: 2480,
                h: 3508,
                jsPdfFormat: 'a4'
            },

            'Letter': {
                w: 2550,
                h: 3300,
                jsPdfFormat: 'letter'
            },

            '4x6': {
                w: 1200,
                h: 1800,
                jsPdfFormat: [101.6, 152.4]
            }

        };


        const photoDimensions = {

            'passport_in': {
                w: 35,
                h: 45
            },

            'stamp_in': {
                w: 20,
                h: 25
            },

            'joint_in': {
                w: 48.3,
                h: 40.6
            },

            'id_card_in': {
                w: 85,
                h: 54
            },

            'visa_us': {
                w: 51,
                h: 51
            }

        };


        addPersonRow();

        setCanvasSize();


        function addPersonRow() {

            if (persons.length >= 15) {

                alert(
                    "Maximum 15 persons allowed at once."
                );

                return;
            }


            persons.push({

                size: 'passport_in',

                qty: 8,

                img1: new Image(),

                loaded1: false,

                img2: new Image(),

                loaded2: false

            });


            renderRows();

        }


        function removePerson(index) {

            persons.splice(index, 1);


            if (persons.length === 0) {

                addPersonRow();

            } else {

                renderRows();

            }


            drawLayout();

        }


        function changePersonSize(index, newSize) {

            persons[index].size = newSize;

            renderRows();

            drawLayout();

        }


        function updatePersonQty(index, change) {

            let current =
                parseInt(persons[index].qty);

            let newVal =
                current + change;


            if (newVal >= 1 && newVal <= 50) {

                persons[index].qty = newVal;

                renderRows();

                drawLayout();

            }

        }


        function handleUpload(
            event,
            index,
            imgNum
        ) {

            const file =
                event.target.files[0];


            if (file) {

                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        const dataUrl =
                            e.target.result;


                        if (imgNum === 1) {

                            persons[index].img1.src =
                                dataUrl;


                            persons[index].img1.onload =
                                () => {

                                    persons[index].loaded1 =
                                        true;

                                    renderRows();

                                    drawLayout();

                                };

                        } else {

                            persons[index].img2.src =
                                dataUrl;


                            persons[index].img2.onload =
                                () => {

                                    persons[index].loaded2 =
                                        true;

                                    renderRows();

                                    drawLayout();

                                };

                        }

                    };


                reader.readAsDataURL(file);

            }

        }


        function renderRows() {

            const container =
                document.getElementById(
                    'persons-container'
                );


            container.innerHTML = '';


            persons.forEach(
                (p, index) => {

                    const row =
                        document.createElement(
                            'div'
                        );


                    row.className =
                        'person-row';


                    const sizeOptions = `

                        <select
                            class="person-size-select"
                            onchange="changePersonSize(
                                ${index},
                                this.value
                            )">

                            <option
                                value="passport_in"
                                ${p.size === 'passport_in'
                                    ? 'selected'
                                    : ''}>

                                Passport
                                (3.5x4.5 cm)

                            </option>


                            <option
                                value="stamp_in"
                                ${p.size === 'stamp_in'
                                    ? 'selected'
                                    : ''}>

                                Stamp
                                (2x2.5 cm)

                            </option>


                            <option
                                value="joint_in"
                                ${p.size === 'joint_in'
                                    ? 'selected'
                                    : ''}>

                                Joint Photo
                                (4.8x4.0 cm)

                            </option>


                            <option
                                value="id_card_in"
                                ${p.size === 'id_card_in'
                                    ? 'selected'
                                    : ''}>

                                ID Card (F+B)
                                (8.5x5.4 cm)

                            </option>


                            <option
                                value="visa_us"
                                ${p.size === 'visa_us'
                                    ? 'selected'
                                    : ''}>

                                Visa
                                (2x2 Inch)

                            </option>

                        </select>

                    `;


                    let uploadControls = '';


                    if (
                        p.size ===
                        'id_card_in'
                    ) {

                        uploadControls = `

                            <label class="upload-btn">

                                <i class="fa-solid fa-id-card"></i>

                                ${
                                    p.loaded1
                                        ? 'Front ✓'
                                        : 'Front'
                                }

                                <input
                                    type="file"
                                    accept="image/*"
                                    onchange="
                                        handleUpload(
                                            event,
                                            ${index},
                                            1
                                        )
                                    ">

                            </label>


                            <label
                                class="
                                    upload-btn
                                    upload-btn-secondary
                                ">

                                <i
                                    class="
                                        fa-solid
                                        fa-address-card
                                    ">
                                </i>

                                ${
                                    p.loaded2
                                        ? 'Back ✓'
                                        : 'Back'
                                }

                                <input
                                    type="file"
                                    accept="image/*"
                                    onchange="
                                        handleUpload(
                                            event,
                                            ${index},
                                            2
                                        )
                                    ">

                            </label>


                            <div class="qty-control">

                                <button
                                    class="qty-btn"
                                    onclick="
                                        updatePersonQty(
                                            ${index},
                                            -1
                                        )
                                    ">

                                    -

                                </button>


                                <input
                                    type="text"
                                    class="qty-input"
                                    value="${p.qty}"
                                    readonly>


                                <button
                                    class="qty-btn"
                                    onclick="
                                        updatePersonQty(
                                            ${index},
                                            1
                                        )
                                    ">

                                    +

                                </button>

                            </div>

                        `;

                    } else {

                        uploadControls = `

                            <label class="upload-btn">

                                <i
                                    class="
                                        fa-solid
                                        fa-image
                                    ">
                                </i>

                                ${
                                    p.loaded1
                                        ? 'Photo ✓'
                                        : 'Upload'
                                }

                                <input
                                    type="file"
                                    accept="image/*"
                                    onchange="
                                        handleUpload(
                                            event,
                                            ${index},
                                            1
                                        )
                                    ">

                            </label>


                            <div class="qty-control">

                                <button
                                    class="qty-btn"
                                    onclick="
                                        updatePersonQty(
                                            ${index},
                                            -1
                                        )
                                    ">

                                    -

                                </button>


                                <input
                                    type="text"
                                    class="qty-input"
                                    value="${p.qty}"
                                    readonly>


                                <button
                                    class="qty-btn"
                                    onclick="
                                        updatePersonQty(
                                            ${index},
                                            1
                                        )
                                    ">

                                    +

                                </button>

                            </div>

                        `;

                    }


                    row.innerHTML = `

                        <div class="person-label">
                            P-${index + 1}
                        </div>

                        ${sizeOptions}

                        ${uploadControls}

                        <button
                            class="btn-remove"
                            onclick="
                                removePerson(${index})
                            "
                            title="Remove">

                            <i
                                class="
                                    fa-solid
                                    fa-trash
                                ">
                            </i>

                        </button>

                    `;


                    container.appendChild(row);

                }
            );

        }


        function setCanvasSize() {

            const paper =
                paperDimensions[
                    paperSelect.value
                ];


            canvas.width =
                paper.w;

            canvas.height =
                paper.h;


            previewWrapper.style.aspectRatio =
                `${paper.w} / ${paper.h}`;


            ctx.fillStyle =
                "#ffffff";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }


        function drawLayout() {

            setCanvasSize();


            const minMargin =
                5 * MM_TO_PX;

            const gapX =
                3 * MM_TO_PX;

            const gapY =
                3 * MM_TO_PX;


            let startX =
                minMargin;

            let currentX =
                startX;

            let currentY =
                minMargin +
                (3 * MM_TO_PX);


            let rowHeight =
                0;

            let lastSize =
                null;


            persons.forEach(
                p => {

                    if (
                        !p.loaded1 &&
                        p.size !== 'id_card_in'
                    ) {
                        return;
                    }


                    if (
                        p.size === 'id_card_in' &&
                        !p.loaded1 &&
                        !p.loaded2
                    ) {
                        return;
                    }


                    const pW =
                        photoDimensions[
                            p.size
                        ].w *
                        MM_TO_PX;


                    const pH =
                        photoDimensions[
                            p.size
                        ].h *
                        MM_TO_PX;


                    for (
                        let i = 0;
                        i < p.qty;
                        i++
                    ) {


                        if (
                            lastSize !== null &&
                            lastSize !== p.size
                        ) {

                            currentX =
                                startX;

                            currentY +=
                                rowHeight +
                                gapY;

                            rowHeight =
                                pH;

                        }


                        if (
                            p.size ===
                            'id_card_in'
                        ) {

                            const neededWidth =
                                (pW * 2) +
                                gapX;


                            if (
                                currentX +
                                neededWidth >
                                canvas.width -
                                minMargin
                            ) {

                                currentX =
                                    startX;

                                currentY +=
                                    rowHeight +
                                    gapY;

                            }


                            if (
                                currentY +
                                pH >
                                canvas.height -
                                minMargin
                            ) {
                                return;
                            }


                            if (p.loaded1) {

                                ctx.drawImage(
                                    p.img1,
                                    currentX,
                                    currentY,
                                    pW,
                                    pH
                                );


                                ctx.strokeStyle =
                                    "#000000";

                                ctx.lineWidth =
                                    2;


                                ctx.strokeRect(
                                    currentX,
                                    currentY,
                                    pW,
                                    pH
                                );

                            }


                            if (p.loaded2) {

                                ctx.drawImage(
                                    p.img2,
                                    currentX +
                                    pW +
                                    gapX,
                                    currentY,
                                    pW,
                                    pH
                                );


                                ctx.strokeStyle =
                                    "#000000";

                                ctx.lineWidth =
                                    2;


                                ctx.strokeRect(
                                    currentX +
                                    pW +
                                    gapX,
                                    currentY,
                                    pW,
                                    pH
                                );

                            }


                            currentX +=
                                neededWidth +
                                gapX;


                            rowHeight =
                                pH;

                            lastSize =
                                p.size;


                        } else {


                            if (
                                currentX +
                                pW >
                                canvas.width -
                                minMargin
                            ) {

                                currentX =
                                    startX;

                                currentY +=
                                    rowHeight +
                                    gapY;

                            }


                            if (
                                currentY +
                                pH >
                                canvas.height -
                                minMargin
                            ) {
                                return;
                            }


                            if (p.loaded1) {

                                ctx.drawImage(
                                    p.img1,
                                    currentX,
                                    currentY,
                                    pW,
                                    pH
                                );


                                ctx.strokeStyle =
                                    "#000000";

                                ctx.lineWidth =
                                    2;


                                ctx.strokeRect(
                                    currentX,
                                    currentY,
                                    pW,
                                    pH
                                );

                            }


                            currentX +=
                                pW +
                                gapX;


                            rowHeight =
                                pH;

                            lastSize =
                                p.size;

                        }

                    }

                }
            );

        }


        function downloadPDF() {

            const paperData =
                paperDimensions[
                    paperSelect.value
                ];


            const imgData =
                canvas.toDataURL(
                    'image/jpeg',
                    0.95
                );


            const {
                jsPDF
            } =
                window.jspdf;


            const pdf =
                new jsPDF({

                    orientation:
                        'portrait',

                    unit:
                        'mm',

                    format:
                        paperData.jsPdfFormat

                });


            pdf.addImage(

                imgData,

                'JPEG',

                0,

                0,

                pdf.internal.pageSize.getWidth(),

                pdf.internal.pageSize.getHeight()

            );


            pdf.save(
                "Photos_Print_Ready.pdf"
            );

        }


        function printPage() {

            const dataUrl =
                canvas.toDataURL(
                    'image/jpeg',
                    1.0
                );


            const printWindow =
                window.open(
                    '',
                    '_blank'
                );


            printWindow.document.write(`

                <html>

                <head>

                    <title>
                        Print Photo Sheet
                    </title>
