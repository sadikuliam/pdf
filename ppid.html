<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Photo Print Maker | Passport, Stamp, Joint & ID Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #111827; 
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --border: #374151;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .tool-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Controls Toolbar */
        .toolbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            color: #1f2937;
        }

        /* Dynamic Panel for Multi-Person */
        .person-panel {
            background-color: #f3f4f6;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .person-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            flex-wrap: wrap;
        }

        .person-label {
            font-weight: 600;
            color: #111827;
            min-width: 80px;
        }

        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .upload-btn:hover { background-color: var(--primary-hover); }
        .upload-btn-secondary { background-color: var(--success); }
        .upload-btn-secondary:hover { background-color: #059669; }
        input[type="file"] { display: none; }

        /* Quantity Counter */
        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .qty-wrapper span {
            font-size: 0.85rem;
            color: #4b5563;
            font-weight: 600;
        }
        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
        }
        .qty-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 12px;
            color: #374151;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-btn:hover { background: #e5e7eb; }
        .qty-input {
            width: 40px;
            text-align: center;
            border: none;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            padding: 6px 0;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-remove:hover { background-color: #dc2626; }

        .add-person-btn {
            background-color: #374151;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-person-btn:hover { background-color: #1f2937; }

        /* Preview Workspace */
        .workspace {
            padding: 30px;
            display: flex;
            justify-content: center;
            background-color: #374151; 
            overflow: auto;
            min-height: 500px;
        }

        .paper-preview-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px; 
            aspect-ratio: 1 / 1.414; 
            position: relative;
            transition: aspect-ratio 0.3s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Action Buttons */
        .actions-bar {
            background-color: #1f2937;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-pdf { background-color: #ef4444; }
        .btn-pdf:hover { background-color: #dc2626; }
        .btn-print { background-color: #10b981; }
        .btn-print:hover { background-color: #059669; }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            select { width: 100%; }
            .person-row { flex-direction: column; align-items: stretch; }
            .qty-wrapper { margin-left: 0; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <div class="toolbar">
            <select id="paper-size" onchange="drawLayout()">
                <option value="A4">Paper: A4 Sheet</option>
                <option value="Letter">Paper: US Letter</option>
                <option value="4x6">Paper: 4x6 Inch</option>
            </select>

            <select id="photo-size" onchange="handleFormatChange()">
                <option value="passport_in">Format: Passport (3.5x4.5 cm)</option>
                <option value="stamp_in">Format: Stamp (2x2.5 cm)</option>
                <option value="joint_in">Format: Joint Photo (4.83x4.06 cm)</option>
                <option value="visa_us">Format: Passport/Visa (2x2 Inch)</option>
                <option value="id_card_in">Format: ID Card F+B (8.5x5.4 cm)</option>
            </select>
        </div>

        <div class="person-panel" id="person-panel">
            <div id="persons-container">
                </div>
            <button class="add-person-btn" onclick="addPersonRow()">
                <i class="fa-solid fa-plus"></i> Add Person
            </button>
        </div>

        <div class="workspace">
            <div class="paper-preview-wrapper" id="preview-wrapper">
                <canvas id="main-canvas"></canvas>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-pdf" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
            <button class="action-btn btn-print" onclick="printPage()"><i class="fa-solid fa-print"></i> Direct Print</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const sizeSelect = document.getElementById('photo-size');
        const paperSelect = document.getElementById('paper-size');
        const previewWrapper = document.getElementById('preview-wrapper');
        
        // Universal Persons Array
        let persons = [];

        const MM_TO_PX = 11.811; 

        // Paper Definitions
        const paperDimensions = {
            'A4': { w: 2480, h: 3508, jsPdfFormat: 'a4' },
            'Letter': { w: 2550, h: 3300, jsPdfFormat: 'letter' },
            '4x6': { w: 1200, h: 1800, jsPdfFormat: [101.6, 152.4] }
        };

        // Photo Definitions (Width & Height in mm)
        const photoDimensions = {
            'passport_in': { w: 35, h: 45 },
            'stamp_in': { w: 20, h: 25 },
            'joint_in': { w: 48.3, h: 40.6 },
            'id_card_in': { w: 85, h: 54 },   
            'visa_us': { w: 51, h: 51 }
        };

        // Init
        initPanel();
        setCanvasSize();

        function initPanel() {
            persons = [];
            addPersonRow();
        }

        function addPersonRow() {
            const format = sizeSelect.value;
            
            // Limit to 5 persons for ID Card, 15 for others
            if (format === 'id_card_in' && persons.length >= 5) {
                alert("Maximum 5 persons allowed for ID Cards on A4.");
                return;
            }
            if (persons.length >= 15) {
                alert("Maximum person limit reached.");
                return;
            }
            
            persons.push({
                photo: new Image(), photoLoaded: false, qty: 8, // Standard Photos
                frontImg: new Image(), frontLoaded: false,      // ID Card Front
                backImg: new Image(), backLoaded: false         // ID Card Back
            });

            renderRows();
        }

        function removePerson(index) {
            persons.splice(index, 1);
            if(persons.length === 0) addPersonRow(); // Keep at least 1
            else renderRows();
            drawLayout();
        }

        function updatePersonQty(index, change) {
            let current = parseInt(persons[index].qty);
            let newVal = current + change;
            if (newVal >= 1 && newVal <= 50) {
                persons[index].qty = newVal;
                renderRows(); // update UI number
                drawLayout(); // update canvas
            }
        }

        function renderRows() {
            const container = document.getElementById('persons-container');
            const format = sizeSelect.value;
            container.innerHTML = '';

            persons.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'person-row';
                
                if (format === 'id_card_in') {
                    // --- ID CARD UI ---
                    const fText = p.frontLoaded ? 'Front ✓' : 'Upload Front';
                    const bText = p.backLoaded ? 'Back ✓' : 'Upload Back';

                    row.innerHTML = `
                        <div class="person-label">Person ${index + 1}:</div>
                        <label class="upload-btn">
                            <i class="fa-solid fa-id-card"></i> ${fText}
                            <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 'front')">
                        </label>
                        <label class="upload-btn upload-btn-secondary">
                            <i class="fa-solid fa-address-card"></i> ${bText}
                            <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 'back')">
                        </label>
                        ${persons.length > 1 ? `<button class="btn-remove" onclick="removePerson(${index})" style="margin-left:auto;"><i class="fa-solid fa-trash"></i></button>` : ''}
                    `;
                } else {
                    // --- STANDARD PHOTO UI (Passport, Stamp, etc.) ---
                    const pText = p.photoLoaded ? 'Photo ✓' : 'Upload Photo';

                    row.innerHTML = `
                        <div class="person-label">Person ${index + 1}:</div>
                        <label class="upload-btn">
                            <i class="fa-solid fa-user"></i> ${pText}
                            <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 'photo')">
                        </label>
                        <div class="qty-wrapper">
                            <span>Copies:</span>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updatePersonQty(${index}, -1)">-</button>
                                <input type="text" class="qty-input" value="${p.qty}" readonly>
                                <button class="qty-btn" onclick="updatePersonQty(${index}, 1)">+</button>
                            </div>
                        </div>
                        ${persons.length > 1 ? `<button class="btn-remove" onclick="removePerson(${index})"><i class="fa-solid fa-trash"></i></button>` : '<div style="width:32px"></div>'}
                    `;
                }
                container.appendChild(row);
            });
        }

        function handleUpload(event, index, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    if (type === 'photo') {
                        persons[index].photo.src = dataUrl;
                        persons[index].photo.onload = () => {
                            persons[index].photoLoaded = true;
                            renderRows(); drawLayout();
                        }
                    } else if (type === 'front') {
                        persons[index].frontImg.src = dataUrl;
                        persons[index].frontImg.onload = () => {
                            persons[index].frontLoaded = true;
                            renderRows(); drawLayout();
                        }
                    } else if (type === 'back') {
                        persons[index].backImg.src = dataUrl;
                        persons[index].backImg.onload = () => {
                            persons[index].backLoaded = true;
                            renderRows(); drawLayout();
                        }
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function handleFormatChange() {
            // When format changes, reset the panel to clear incompatible images
            initPanel();
            drawLayout();
        }

        function setCanvasSize() {
            const paper = paperDimensions[paperSelect.value];
            canvas.width = paper.w;
            canvas.height = paper.h;
            previewWrapper.style.aspectRatio = `${paper.w} / ${paper.h}`;
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // ------------------ Core Layout Engine ------------------ //
        function drawLayout() {
            setCanvasSize();

            const format = sizeSelect.value;
            const photoW_mm = photoDimensions[format].w;
            const photoH_mm = photoDimensions[format].h;
            const pW = photoW_mm * MM_TO_PX;
            const pH = photoH_mm * MM_TO_PX;

            if (format === 'id_card_in') {
                // --- ID CARD LOGIC ---
                const gapX = 3 * MM_TO_PX;   
                const gapY = 3 * MM_TO_PX; 
                const startY = 8 * MM_TO_PX; 

                const rowWidth = (pW * 2) + gapX;
                const startX = (canvas.width - rowWidth) / 2;

                let row = 0;
                persons.forEach(p => {
                    let y = startY + (row * (pH + gapY));
                    if (y + pH <= canvas.height) {
                        if (p.frontLoaded) {
                            ctx.drawImage(p.frontImg, startX, y, pW, pH);
                            ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; 
                            ctx.strokeRect(startX, y, pW, pH);
                        }
                        if (p.backLoaded) {
                            ctx.drawImage(p.backImg, startX + pW + gapX, y, pW, pH);
                            ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; 
                            ctx.strokeRect(startX + pW + gapX, y, pW, pH);
                        }
                    }
                    row++;
                });

            } else {
                // --- MULTI-PERSON STANDARD PHOTO LOGIC ---
                const minMargin = 4 * MM_TO_PX; 
                const gapX = 2.5 * MM_TO_PX;   
                const gapY = 2.5 * MM_TO_PX;   

                const usableWidth = canvas.width - (minMargin * 2);
                const cols = Math.floor((usableWidth + gapX) / (pW + gapX));

                const totalContentWidth = (cols * pW) + ((cols - 1) * gapX);
                const startX = Math.max(minMargin, (canvas.width - totalContentWidth) / 2);
                const startY = minMargin + (2 * MM_TO_PX); 

                let col = 0;
                let row = 0;

                persons.forEach(p => {
                    if (p.photoLoaded) {
                        for (let i = 0; i < p.qty; i++) {
                            let x = startX + (col * (pW + gapX));
                            let y = startY + (row * (pH + gapY));

                            // Stop if page is full
                            if (y + pH > canvas.height - minMargin) return;

                            ctx.drawImage(p.photo, x, y, pW, pH);
                            ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; 
                            ctx.strokeRect(x, y, pW, pH);

                            col++;
                            if (col >= cols) {
                                col = 0;
                                row++;
                            }
                        }
                    }
                });
            }
        }

        // Output Functions
        function downloadPDF() {
            const paperData = paperDimensions[paperSelect.value];
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: paperData.jsPdfFormat });
            pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
            pdf.save("Photos_Print_Ready.pdf");
        }

        function printPage() {
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>Print Photo Sheet</title>
                <style>@page { size: auto; margin: 0; } body { margin: 0; display: flex; justify-content: center; background: #fff; } img { width: 100%; height: auto; display: block; }</style>
                </head><body><img src="${dataUrl}" onload="window.print();window.close();" /></body></html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
