<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Photo Print Maker | Passport, Stamp, Joint & ID Card</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #111827; 
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --border: #374151;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .tool-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Controls Toolbar */
        .toolbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .upload-btn:hover { background-color: var(--primary-hover); }
        .upload-btn-secondary { background-color: var(--success); }
        .upload-btn-secondary:hover { background-color: #059669; }
        
        input[type="file"] { display: none; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1f2937;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        /* Quantity Counter */
        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
        }
        .qty-btn {
            background: #f3f4f6;
            border: none;
            padding: 8px 12px;
            color: #374151;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .qty-btn:hover { background: #e5e7eb; }
        .qty-input {
            width: 50px;
            text-align: center;
            border: none;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        /* ID Card Specific Panel */
        .id-panel {
            background-color: #f3f4f6;
            padding: 15px 20px;
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--primary);
        }
        .id-person-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            flex-wrap: wrap;
        }
        .person-label {
            font-weight: 600;
            color: #111827;
            min-width: 80px;
        }
        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }
        .btn-remove:hover { background-color: #dc2626; }
        .add-person-btn {
            background-color: #374151;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-person-btn:hover { background-color: #1f2937; }

        /* Preview Workspace */
        .workspace {
            padding: 30px;
            display: flex;
            justify-content: center;
            background-color: #374151; 
            overflow: auto;
            min-height: 500px;
        }

        .paper-preview-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px; 
            aspect-ratio: 1 / 1.414; 
            position: relative;
            transition: aspect-ratio 0.3s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Action Buttons */
        .actions-bar {
            background-color: #1f2937;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-pdf { background-color: #ef4444; }
        .btn-pdf:hover { background-color: #dc2626; }
        .btn-print { background-color: #10b981; }
        .btn-print:hover { background-color: #059669; }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .control-group { justify-content: space-between; width: 100%; }
            select { width: 100%; }
            .id-person-row { flex-direction: column; align-items: stretch; }
            .btn-remove { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="tool-container">
        <div class="toolbar">
            
            <label class="upload-btn" id="normal-upload-btn">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Photo
                <input type="file" id="image-upload-normal" accept="image/*">
            </label>

            <div class="control-group">
                <select id="paper-size" onchange="drawLayout()">
                    <option value="A4">A4 Sheet</option>
                    <option value="Letter">US Letter</option>
                    <option value="4x6">4x6 Inch (Studio Size)</option>
                </select>
            </div>

            <div class="control-group">
                <select id="photo-size" onchange="handleFormatChange()">
                    <option value="passport_in">Passport (India) 3.5x4.5 cm</option>
                    <option value="stamp_in">Stamp (India) 2x2.5 cm</option>
                    <option value="joint_in">Joint Photo 4.83x4.06 cm</option>
                    <option value="id_card_in">ID Card (Multiple Persons) 8.5x5.4 cm</option>
                    <option value="visa_us">Passport/Visa (USA) 2x2 In</option>
                </select>
            </div>

            <div class="control-group" id="normal-qty-control">
                <div class="qty-control">
                    <button class="qty-btn" onclick="updateQty(-1)">-</button>
                    <input type="number" id="photo-qty" class="qty-input" value="10" min="1" max="100" onchange="drawLayout()">
                    <button class="qty-btn" onclick="updateQty(1)">+</button>
                </div>
            </div>
        </div>

        <div class="id-panel" id="id-panel">
            <div id="id-persons-container">
                </div>
            <button class="add-person-btn" id="add-person-btn" onclick="addPersonRow()">
                <i class="fa-solid fa-plus"></i> Add Person (Max 5)
            </button>
        </div>

        <div class="workspace">
            <div class="paper-preview-wrapper" id="preview-wrapper">
                <canvas id="main-canvas"></canvas>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-pdf" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
            <button class="action-btn btn-print" onclick="printPage()"><i class="fa-solid fa-print"></i> Direct Print</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const qtyInput = document.getElementById('photo-qty');
        const sizeSelect = document.getElementById('photo-size');
        const paperSelect = document.getElementById('paper-size');
        const previewWrapper = document.getElementById('preview-wrapper');
        
        // Normal Upload Data
        let normalImage = new Image();
        let normalImageLoaded = false;

        // ID Card Array Data (Up to 5 persons)
        let idCards = [];

        // 300 DPI conversion (1 mm = 11.811 pixels)
        const MM_TO_PX = 11.811; 

        // Paper Definitions
        const paperDimensions = {
            'A4': { w: 2480, h: 3508, jsPdfFormat: 'a4' },
            'Letter': { w: 2550, h: 3300, jsPdfFormat: 'letter' },
            '4x6': { w: 1200, h: 1800, jsPdfFormat: [101.6, 152.4] }
        };

        // Photo Definitions (Width & Height in mm)
        const photoDimensions = {
            'passport_in': { w: 35, h: 45 },
            'stamp_in': { w: 20, h: 25 },
            'joint_in': { w: 48.3, h: 40.6 },
            'id_card_in': { w: 85, h: 54 },   
            'visa_us': { w: 51, h: 51 }
        };

        // Initialize Application
        initIdPanel();
        setCanvasSize();

        // ------------------ Normal Upload Logic ------------------ //
        document.getElementById('image-upload-normal').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    normalImage.src = event.target.result;
                    normalImage.onload = () => {
                        normalImageLoaded = true;
                        drawLayout();
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        function updateQty(change) {
            let current = parseInt(qtyInput.value);
            let newVal = current + change;
            if (newVal >= 1 && newVal <= 100) {
                qtyInput.value = newVal;
                drawLayout();
            }
        }

        // ------------------ ID Card Multi-Person Logic ------------------ //
        function initIdPanel() {
            idCards = [];
            addPersonRow();
        }

        function addPersonRow() {
            if (idCards.length >= 5) {
                alert("Maximum 5 persons can be added per A4 page.");
                return;
            }
            
            idCards.push({
                frontImg: new Image(), frontLoaded: false,
                backImg: new Image(), backLoaded: false
            });

            renderIdRows();
        }

        function removePerson(index) {
            idCards.splice(index, 1);
            renderIdRows();
            drawLayout();
        }

        function renderIdRows() {
            const container = document.getElementById('id-persons-container');
            const addBtn = document.getElementById('add-person-btn');
            container.innerHTML = '';

            idCards.forEach((person, index) => {
                const row = document.createElement('div');
                row.className = 'id-person-row';
                
                const frontText = person.frontLoaded ? 'Front Uploaded ✓' : 'Upload Front';
                const backText = person.backLoaded ? 'Back Uploaded ✓' : 'Upload Back';

                row.innerHTML = `
                    <div class="person-label">Person ${index + 1}:</div>
                    <label class="upload-btn">
                        <i class="fa-solid fa-id-card"></i> ${frontText}
                        <input type="file" accept="image/*" onchange="handleIdUpload(event, ${index}, 'front')">
                    </label>
                    <label class="upload-btn upload-btn-secondary">
                        <i class="fa-solid fa-address-card"></i> ${backText}
                        <input type="file" accept="image/*" onchange="handleIdUpload(event, ${index}, 'back')">
                    </label>
                    ${idCards.length > 1 ? `<button class="btn-remove" onclick="removePerson(${index})" title="Remove"><i class="fa-solid fa-trash"></i></button>` : ''}
                `;
                container.appendChild(row);
            });

            if (idCards.length >= 5) {
                addBtn.style.display = 'none';
            } else {
                addBtn.style.display = 'flex';
            }
        }

        function handleIdUpload(event, index, side) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    if (side === 'front') {
                        idCards[index].frontImg.src = dataUrl;
                        idCards[index].frontImg.onload = () => {
                            idCards[index].frontLoaded = true;
                            renderIdRows();
                            drawLayout();
                        }
                    } else {
                        idCards[index].backImg.src = dataUrl;
                        idCards[index].backImg.onload = () => {
                            idCards[index].backLoaded = true;
                            renderIdRows();
                            drawLayout();
                        }
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        // ------------------ General UI Logic ------------------ //
        function handleFormatChange() {
            const format = sizeSelect.value;
            const normalUploadBtn = document.getElementById('normal-upload-btn');
            const normalQtyControl = document.getElementById('normal-qty-control');
            const idPanel = document.getElementById('id-panel');

            if (format === 'id_card_in') {
                normalUploadBtn.style.display = 'none';
                normalQtyControl.style.display = 'none';
                idPanel.style.display = 'flex';
            } else {
                normalUploadBtn.style.display = 'flex';
                normalQtyControl.style.display = 'flex';
                idPanel.style.display = 'none';
            }
            drawLayout();
        }

        function setCanvasSize() {
            const paper = paperDimensions[paperSelect.value];
            canvas.width = paper.w;
            canvas.height = paper.h;
            previewWrapper.style.aspectRatio = `${paper.w} / ${paper.h}`;
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // ------------------ Core Layout Drawing ------------------ //
        function drawLayout() {
            setCanvasSize();

            const format = sizeSelect.value;

            // Common Setup
            const photoW_mm = photoDimensions[format].w;
            const photoH_mm = photoDimensions[format].h;
            const pW = photoW_mm * MM_TO_PX;
            const pH = photoH_mm * MM_TO_PX;

            // Draw ID Card Format
            if (format === 'id_card_in') {
                const gapX = 3 * MM_TO_PX;   
                const gapY = 3 * MM_TO_PX; 
                const startY = 8 * MM_TO_PX; // 8mm top margin for ID Cards

                const rowWidth = (pW * 2) + gapX;
                const startX = (canvas.width - rowWidth) / 2;

                idCards.forEach((person, index) => {
                    let y = startY + (index * (pH + gapY));

                    if (y + pH <= canvas.height) {
                        if (person.frontLoaded) {
                            ctx.drawImage(person.frontImg, startX, y, pW, pH);
                            ctx.strokeStyle = "#000000";
                            ctx.lineWidth = 2; 
                            ctx.strokeRect(startX, y, pW, pH);
                        }
                        if (person.backLoaded) {
                            ctx.drawImage(person.backImg, startX + pW + gapX, y, pW, pH);
                            ctx.strokeStyle = "#000000";
                            ctx.lineWidth = 2; 
                            ctx.strokeRect(startX + pW + gapX, y, pW, pH);
                        }
                    }
                });

            } 
            // Draw Normal Formats (Passport, Stamp, Joint)
            else {
                if (!normalImageLoaded) return;
                const qty = parseInt(qtyInput.value);

                // Margin & Gap adjustments for perfectly fitting the bottom row
                const minMargin = 4 * MM_TO_PX; // Margin reduced to 4mm
                const gapX = 2.5 * MM_TO_PX;   // X gap 2.5mm
                const gapY = 2.5 * MM_TO_PX;   // Y gap 2.5mm

                const usableWidth = canvas.width - (minMargin * 2);
                const cols = Math.floor((usableWidth + gapX) / (pW + gapX));

                const totalContentWidth = (cols * pW) + ((cols - 1) * gapX);
                const startX = Math.max(minMargin, (canvas.width - totalContentWidth) / 2);
                
                // Reduced top start margin so bottom row gets enough space
                const startY = minMargin + (2 * MM_TO_PX); 

                for (let i = 0; i < qty; i++) {
                    let row = Math.floor(i / cols);
                    let col = i % cols;

                    let x = startX + (col * (pW + gapX));
                    let y = startY + (row * (pH + gapY));

                    // Stop drawing if it overflows the paper boundary
                    if (y + pH > canvas.height - minMargin) break;

                    ctx.drawImage(normalImage, x, y, pW, pH);
                    ctx.strokeStyle = "#000000";
                    ctx.lineWidth = 2; 
                    ctx.strokeRect(x, y, pW, pH);
                }
            }
        }

        // Generate and Download PDF
        function downloadPDF() {
            const paperData = paperDimensions[paperSelect.value];
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const { jsPDF } = window.jspdf;
            
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: paperData.jsPdfFormat
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save("Photos_Print_Ready.pdf");
        }

        // Direct Print Function
        function printPage() {
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            const printWindow = window.open('', '_blank');
            
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Print Photo Sheet</title>
                        <style>
                            @page { size: auto; margin: 0; }
                            body { margin: 0; display: flex; justify-content: center; align-items: flex-start; background: #fff; }
                            img { width: 100%; height: auto; display: block; }
                        </style>
                    </head>
                    <body>
                        <img src="${dataUrl}" onload="window.print();window.close();" />
                    </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
