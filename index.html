<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Prevent Browser Cache on Dashboard Load -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>SHM PDF Tools | Ultra Modern Edition</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SHM PDF">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4F46E5; 
            --primary-light: #818CF8;
            --secondary: #EC4899;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-card: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #0F172A;
            --text-muted: #475569;
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            /* Premium Fluid Aurora Background */
            background: linear-gradient(45deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            background-size: 300% 300%;
            animation: auroraBG 15s ease-in-out infinite alternate;
            color: var(--text-main);
            overflow-x: hidden;
        }

        @keyframes auroraBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== Main Container (Glassmorphism) ===== */
        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.8);
            border-left: 1px solid rgba(255,255,255,0.8);
            border-radius: 32px;
            padding: 3rem;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255,255,255,0.3);
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header { 
            text-align: center; 
            margin-bottom: 3.5rem; 
        }

        .logo { 
            height: 200px; 
            max-width: 100%; 
            object-fit: contain;
            margin-bottom: 1rem; 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2)); 
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }

     /* ===== Header Logo Animation ===== */
        .logo { 
            height: 200px; 
            max-width: 100%; 
            object-fit: contain;
            margin-bottom: 1.5rem; 
            /* Continuous slow fade and float animation */
            animation: floatAndFade 5s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .logo:hover { 
            /* হোভার করলে অ্যানিমেশন পজ হবে এবং লোগো একটু বড় হবে */
            animation-play-state: paused;
            transform: scale(1.08) rotate(-2deg) translateY(-5px); 
            filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.3)) drop-shadow(0 0 50px rgba(255, 255, 255, 0.7));
        }

        /* Floating & Fade In/Out Keyframes */
        @keyframes floatAndFade {
            0%, 100% {
                opacity: 0.75;
                transform: translateY(0px);
                /* নরম শ্যাডো এবং গ্লো ব্যাকগ্রাউন্ডের সাথে ব্লেন্ড করার জন্য */
                filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.15)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            }
            50% {
                opacity: 1;
                transform: translateY(-15px); /* একটু উপরে উঠবে (floating) */
                /* উজ্জ্বলতা এবং শ্যাডো বাড়বে */
                filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.25)) drop-shadow(0 0 45px rgba(255, 255, 255, 0.5));
            }
        }
        }
        
        /* ===== Desktop Grid: 5 Buttons Per Line ===== */
        .tools-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 1.5rem; 
        }
        
        /* ===== Tool Cards ===== */
        .tool-card { 
            background: var(--glass-card); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 2rem 1.2rem; 
            text-decoration: none; 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative; 
            overflow: hidden; 
            box-shadow: var(--shadow-soft); 
            opacity: 0; 
            animation: fadeUpCard 0.6s forwards; 
            cursor: pointer;
        }

        @keyframes fadeUpCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box { 
            width: 64px; 
            height: 64px; 
            border-radius: 20px; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 1.2rem; 
            color: white; 
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4), inset 0 -3px 0 rgba(0,0,0,0.1); 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            z-index: 2;
        }
        
        .icon-box svg { 
            width: 30px; 
            height: 30px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 2.2; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }

        .tool-card span { 
            font-size: 1.05rem; 
            font-weight: 700; 
            z-index: 2; 
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        /* Glass highlight effect on hover */
        .tool-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: 0.6s;
            z-index: 1;
        }

        .tool-card:hover { 
            transform: translateY(-10px) scale(1.02); 
            background: rgba(255, 255, 255, 0.85); 
            border-color: #ffffff; 
            box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.2), 0 0 20px rgba(255, 255, 255, 0.5); 
        }

        .tool-card:hover .icon-box { 
            transform: scale(1.15) rotate(8deg); 
        }

        .tool-card:hover::after {
            left: 200%;
        }

        /* Staggered animation delays for 14 items */
        .tool-card:nth-child(1) { animation-delay: 0.1s; } 
        .tool-card:nth-child(2) { animation-delay: 0.15s; } 
        .tool-card:nth-child(3) { animation-delay: 0.2s; } 
        .tool-card:nth-child(4) { animation-delay: 0.25s; } 
        .tool-card:nth-child(5) { animation-delay: 0.3s; } 
        .tool-card:nth-child(6) { animation-delay: 0.35s; } 
        .tool-card:nth-child(7) { animation-delay: 0.4s; }
        .tool-card:nth-child(8) { animation-delay: 0.45s; }
        .tool-card:nth-child(9) { animation-delay: 0.5s; }
        .tool-card:nth-child(10) { animation-delay: 0.55s; }
        .tool-card:nth-child(11) { animation-delay: 0.6s; }
        .tool-card:nth-child(12) { animation-delay: 0.65s; }
        .tool-card:nth-child(13) { animation-delay: 0.7s; }
        .tool-card:nth-child(14) { animation-delay: 0.75s; }

        /* ===== Footer ===== */
        .footer { 
            margin-top: 4rem; 
            padding-top: 1.5rem; 
            border-top: 1px solid var(--glass-border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            opacity: 0; 
            animation: fadeUp 0.6s forwards; 
            animation-delay: 0.9s; 
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        
        .footer-left { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: rgba(255,255,255,0.4);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .footer-logo { 
            height: 24px; 
            width: auto; 
            transition: transform 0.3s ease; 
        }

        .footer-logo:hover { 
            transform: scale(1.1) rotate(5deg); 
        }

        .footer-text { 
            color: var(--text-main); 
            font-size: 0.95rem; 
            font-weight: 600; 
        }

        .footer-link { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 800; 
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: var(--secondary);
        }

        .badge-img {
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* ===== Modal Styles ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container-wrapper {
            position: relative;
            width: 95%;
            max-width: 1250px;
            height: 94vh;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .modal-overlay.active .modal-container-wrapper {
            transform: scale(1) translateY(0);
        }

        .modal-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .close-modal-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            z-index: 10;
            background: #ff3b30; 
            color: white;
            border: 3px solid #ffffff; 
            width: 40px; 
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding-bottom: 3px;
        }

        .close-modal-btn:hover {
            background: #d32f2f;
            transform: scale(1.15) rotate(90deg);
        }

        .modal-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f8fafc;
        }

        /* ===== PWA Install Banner UI ===== */
        .install-banner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: 90%;
            max-width: 400px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
        }
        
        .install-banner.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .install-info { display: flex; align-items: center; gap: 12px; }
        .install-icon { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .install-text h4 { margin: 0; font-size: 1.1rem; color: var(--text-main); font-weight: 700;}
        .install-text p { margin: 2px 0 0 0; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;}
        .install-actions { display: flex; align-items: center; gap: 12px; }
        .install-btn { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-family: 'Outfit', sans-serif; 
            font-weight: 700; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .install-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }
        .close-install { background: rgba(0,0,0,0.05); border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: background 0.2s;}
        .close-install:hover { background: rgba(0,0,0,0.1); color: var(--text-main); }

        /* ===== Mobile Responsive ===== */
        @media (max-width: 1024px) {
            .tools-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (max-width: 768px) {
            body { padding: 1.5rem; }
            .app-container { padding: 2rem 1.5rem; border-radius: 28px; }
            .logo { height: 140px; } 
            
            .tools-grid { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 1rem; 
            }
            .tool-card { 
                padding: 1.5rem 0.5rem; 
                border-radius: 18px;
            }
            .icon-box {
                width: 50px;
                height: 50px;
                border-radius: 16px;
                margin-bottom: 1rem;
            }
            .icon-box svg {
                width: 24px;
                height: 24px;
            }
            .tool-card span {
                font-size: 0.9rem;
            }
            
            .footer { flex-direction: column; text-align: center; gap: 1rem; }
            .modal-container-wrapper { width: 98%; height: 97vh; }
            .close-modal-btn { top: -10px; right: -5px; width: 36px; height: 36px; font-size: 20px; }
            .modal-container { border-radius: 16px; }
        }

        /* ===== Extra small devices ===== */
        @media (max-width: 480px) {
            body { padding: 1rem; }
            .app-container { padding: 1.5rem 1rem; border-radius: 24px; }
            .logo { height: 110px; }
            
            /* Change to 2 columns on very small phones to keep it readable and touch-friendly */
            .tools-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 0.8rem; 
            }
            .tool-card {
                padding: 1.2rem 0.5rem;
            }
            .tool-card span { font-size: 0.85rem; }
            .icon-box { width: 44px; height: 44px; border-radius: 14px;}
            .icon-box svg { width: 22px; height: 22px; }
        }
    </style>
</head>

            <a href="gmem.html" class="tool-card membership-card" aria-label="SHM Golden Membership">
                <div class="icon-box" style="font-size: 1.8rem;">👑</div>
                <span>Golden Mem</span>
            </a>
        </div>

        <div class="footer">
            <div class="footer-left">
                <a href="https://shmwb.in" target="_blank" rel="noopener noreferrer">
                    <img src="https://res.cloudinary.com/ewu5hckc/image/upload/v1787377473/logo.png" alt="Powered by shmwb.in" class="footer-logo">
                </a>
                <span class="footer-text">Powered by <a href="https://shmwb.in" target="_blank" rel="noopener noreferrer" class="footer-link">shmwb.in</a></span>
            </div>
            <div>
                <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fwww.shmwb.in&label=SITE%20VISITORS&labelColor=%23374151&countColor=%232563eb" 
                     alt="Visitor Counter for shmwb.in" class="badge-img">
            </div>
        </div>
    </div>

    <!-- ===== Modal Layout ===== -->
    <div id="tool-modal" class="modal-overlay">
        <div class="modal-container-wrapper">
            <button id="close-modal-btn" class="close-modal-btn" aria-label="Close Modal">&times;</button>
            <div class="modal-container">
                <iframe id="modal-iframe" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- PWA Install Banner UI -->
    <div id="pwa-install-banner" class="install-banner">
        <div class="install-info">
            <img src="shmpdf.png" alt="App Icon" class="install-icon">
            <div class="install-text">
                <h4>Install SHM PDF</h4>
                <p>Install the app for quick access.</p>
            </div>
        </div>
        <div class="install-actions">
            <button id="pwa-install-btn" class="install-btn">Install</button>
            <button id="pwa-close-btn" class="close-install" aria-label="Close">&times;</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const toolCards = document.querySelectorAll('.tool-card');
        const modalOverlay = document.getElementById('tool-modal');
        const modalIframe = document.getElementById('modal-iframe');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Modal Open Logic
        toolCards.forEach(card => {
            card.addEventListener('click', function(e) {
                const linkUrl = this.getAttribute('href');
                if (linkUrl && linkUrl !== "#") {
                    e.preventDefault(); 
                    modalIframe.src = linkUrl;
                    modalOverlay.classList.add('active');
                    document.body.style.overflow = 'hidden'; 
                }
            });
        });

        // Modal Close Logic
        const closeModal = () => {
            modalOverlay.classList.remove('active');
            setTimeout(() => {
                modalIframe.src = ''; 
                document.body.style.overflow = ''; 
            }, 400); // Matches CSS transition time
        };

        closeModalBtn.addEventListener('click', closeModal);

        // Close on clicking outside the modal
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });
    });

    // ===== PWA Logic =====
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((registration) => {
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (!sessionStorage.getItem('app_updated')) {
                                    sessionStorage.setItem('app_updated', 'true');
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch((err) => console.log('SW registration error:', err));
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing && !sessionStorage.getItem('app_updated')) {
                refreshing = true;
                sessionStorage.setItem('app_updated', 'true');
                window.location.reload();
            }
        });
    }

    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('pwa-install-btn');
    const closeBtn = document.getElementById('pwa-close-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Delay showing install banner slightly for better UX
        setTimeout(() => {
            installBanner.style.display = 'flex'; 
            // Small timeout to allow display:flex to apply before adding class for transition
            setTimeout(() => installBanner.classList.add('show'), 50);
        }, 1500);
    });

    installBtn.addEventListener('click', async () => {
        installBanner.classList.remove('show');
        setTimeout(() => installBanner.style.display = 'none', 500);
        
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
        }
    });

    closeBtn.addEventListener('click', () => {
        installBanner.classList.remove('show');
        setTimeout(() => installBanner.style.display = 'none', 500);
    });

    window.addEventListener('appinstalled', () => {
        installBanner.classList.remove('show');
        setTimeout(() => installBanner.style.display = 'none', 500);
        deferredPrompt = null;
    });
    </script>
</body>
</html>
