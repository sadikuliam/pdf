<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exact PDF to HTML Converter</title>

<!-- PDF.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #525659; /* PDF reader dark background */
    padding: 20px;
  }

  /* Control Panel */
  .toolbar {
    max-width: 850px;
    margin: 0 auto 20px auto;
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn {
    background-color: #007acc;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  .btn:hover {
    background-color: #005a96;
  }

  .btn-green {
    background-color: #28a745;
  }
  .btn-green:hover {
    background-color: #1e7e34;
  }

  /* Stacked PDF Page Boxes */
  .pages-container {
    max-width: 850px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .pdf-page-box {
    background: #ffffff;
    padding: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    border-radius: 2px;
    text-align: center;
  }

  canvas {
    max-width: 100%;
    height: auto;
    display: block;
    margin: auto;
  }

  /* Code View Box */
  #codeContainer {
    max-width: 850px;
    margin: 20px auto;
    display: none;
    background: #ffffff;
    padding: 15px;
    border-radius: 6px;
  }

  #htmlCodeArea {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 12px;
    padding: 10px;
    border: 1px solid #ccc;
    background: #f9f9f9;
  }
</style>
</head>
<body>

<div class="toolbar">
  <input type="file" id="pdfUpload" accept="application/pdf">
  <div>
    <button class="btn" onclick="toggleCode()">View HTML Code</button>
    <button class="btn btn-green" onclick="downloadHtmlFile()">Download HTML</button>
  </div>
</div>

<div id="codeContainer">
  <h4>HTML Export Code:</h4>
  <textarea id="htmlCodeArea" readonly></textarea>
</div>

<div class="pages-container" id="pagesViewer">
  <!-- Exact PDF layout boxes render here -->
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  let exportedHtml = "";

  document.getElementById('pdfUpload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const viewer = document.getElementById('pagesViewer');
    viewer.innerHTML = "<p style='color:#fff; text-align:center;'>Rendering exact PDF layout...</p>";

    const fileReader = new FileReader();
    fileReader.onload = async function() {
      const typedArray = new Uint8Array(this.result);
      const pdf = await pdfjsLib.getDocument(typedArray).promise;

      viewer.innerHTML = "";
      let htmlPages = `<div style="max-width:850px; margin:auto; display:flex; flex-direction:column; gap:25px; background:#525659; padding:20px;">\n`;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const scale = 2.0; // High resolution
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        const imgData = canvas.toDataURL('image/png');

        // Append to UI
        const pageBox = document.createElement('div');
        pageBox.className = 'pdf-page-box';
        pageBox.appendChild(canvas);
        viewer.appendChild(pageBox);

        // Build standalone HTML export with exact layout image & styling
        htmlPages += `  <div style="background:#ffffff; padding:10px; box-shadow:0 4px 15px rgba(0,0,0,0.3); margin-bottom:20px; text-align:center;">\n`;
        htmlPages += `    <img src="${imgData}" style="max-width:100%; height:auto;" alt="Page ${pageNum}" />\n`;
        htmlPages += `  </div>\n`;
      }

      htmlPages += `</div>`;
      exportedHtml = htmlPages;
      document.getElementById('htmlCodeArea').value = exportedHtml;
    };

    fileReader.readAsArrayBuffer(file);
  });

  function toggleCode() {
    const box = document.getElementById('codeContainer');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  function downloadHtmlFile() {
    if (!exportedHtml) {
      alert("Please upload a PDF first.");
      return;
    }
    const blob = new Blob([exportedHtml], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pdf_exact_design.html';
    a.click();
  }
</script>

</body>
</html>
