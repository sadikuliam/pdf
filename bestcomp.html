<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Threaded Flipbook PDF Compressor</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 36px 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); width: 100%; max-width: 580px; text-align: center; }
    h2 { margin: 0 0 10px 0; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; text-align: left; }
    .setting-group { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .setting-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .setting-group select { width: 100%; background: transparent; color: #f8fafc; border: none; font-size: 14px; outline: none; cursor: pointer; }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 10px; padding: 36px 20px; background: rgba(56, 189, 248, 0.03); cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); border-color: #7dd3fc; }
    input[type="file"] { display: none; }
    .file-details { font-weight: 500; font-size: 14px; word-break: break-all; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
    .progress-box { margin-top: 24px; display: none; text-align: left; }
    .status-text { font-size: 13px; color: #cbd5e1; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #38bdf8, #10b981); height: 100%; width: 0%; transition: width 0.2s; }
    .result-box { margin-top: 24px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #10b981; display: none; }
    .stats { font-size: 14px; color: #34d399; margin-bottom: 12px; font-weight: 500; }
    .btn-download { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-download:hover { background: #059669; }
  </style>

  <!-- মূল লাইব্রেরি -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<div class="card">
  <h2>Multi-Threaded PDF Compressor</h2>
  <p>ওয়েব ওয়ার্কার ও মাল্টি-কোর প্রসেসিং (ফ্লিপবুকের জন্য অপ্টিমাইজড)</p>

  <div class="settings">
    <div class="setting-group">
      <label for="scaleSelect">ডিসপ্লে কোয়ালিটি (DPI)</label>
      <select id="scaleSelect">
        <option value="1.25">120 DPI (খুব হালকা সাইজ)</option>
        <option value="1.5" selected>150 DPI (ফ্লিপবুক ব্যালেন্সড)</option>
        <option value="1.8">180 DPI (শার্প টেক্সট)</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="qualitySelect">ইমেজ কম্প্রেশন</label>
      <select id="qualitySelect">
        <option value="0.65">কম্প্রেশন হাই (ছোট সাইজ)</option>
        <option value="0.75" selected>ব্যালেন্সড (স্ট্যান্ডার্ড)</option>
        <option value="0.85">উচ্চ ক্লিয়ারিটি</option>
      </select>
    </div>
  </div>

  <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
    <div class="file-details" id="fileLabel">ক্লিক করে PDF বেছে নিন বা এখানে ড্রপ করুন</div>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <button class="btn" id="compressBtn" disabled onclick="startMultiThreadedCompression()">কম্প্রেস শুরু করুন</button>

  <div class="progress-box" id="progressBox">
    <div class="status-text">
      <span id="statusLabel">শুরু হচ্ছে...</span>
      <span id="percentLabel">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="stats" id="statsText">সাইজ কমেছে: 0%</div>
    <button class="btn btn-download" id="downloadBtn">কম্প্রেসড PDF ডাউনলোড করুন</button>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const compressBtn = document.getElementById('compressBtn');
  const progressBox = document.getElementById('progressBox');
  const progressBar = document.getElementById('progressBar');
  const statusLabel = document.getElementById('statusLabel');
  const percentLabel = document.getElementById('percentLabel');
  const resultBox = document.getElementById('resultBox');
  const statsText = document.getElementById('statsText');
  const downloadBtn = document.getElementById('downloadBtn');

  let activeFile = null;

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      activeFile = e.target.files[0];
      const mbSize = (activeFile.size / (1024 * 1024)).toFixed(2);
      fileLabel.innerText = `📄 ${activeFile.name} (${mbSize} MB)`;
      compressBtn.disabled = false;
      resultBox.style.display = 'none';
    }
  });

  function updateProgress(percent, text) {
    progressBar.style.width = `${percent}%`;
    percentLabel.innerText = `${percent}%`;
    if (text) statusLabel.innerText = text;
  }

  // সমান্তরালভাবে পেজ রেন্ডার করার হেল্পার ফাংশন
  async function renderPageToJpeg(pdfDoc, pageNum, scale, quality) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: scale });
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

    return new Promise((resolve) => {
      canvas.toBlob((blob) => {
        blob.arrayBuffer().then(buffer => {
          resolve({
            pageNum,
            buffer: new Uint8Array(buffer),
            width: viewport.width,
            height: viewport.height
          });
        });
      }, 'image/jpeg', quality);
    });
  }

  async function startMultiThreadedCompression() {
    if (!activeFile) return;

    compressBtn.disabled = true;
    progressBox.style.display = 'block';
    resultBox.style.display = 'none';
    updateProgress(5, "মেমরিতে ফাইল লোড হচ্ছে...");

    try {
      const scale = parseFloat(document.getElementById('scaleSelect').value);
      const quality = parseFloat(document.getElementById('qualitySelect').value);

      const arrayBuffer = await activeFile.arrayBuffer();
      const originalPdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const totalPages = originalPdf.numPages;

      // ব্রাউজারের উপলব্ধ থ্রেড সংখ্যা অনুযায়ী কনকারেন্সি নির্ধারণ
      const concurrency = Math.min(window.navigator.hardwareConcurrency || 4, 6);
      
      const newPdf = await PDFLib.PDFDocument.create();
      const renderedPages = new Array(totalPages);
      let completedPages = 0;

      // প্যারালাল কিউ এক্সিকিউশন
      const queue = Array.from({ length: totalPages }, (_, i) => i + 1);

      async function worker() {
        while (queue.length > 0) {
          const pageNum = queue.shift();
          const result = await renderPageToJpeg(originalPdf, pageNum, scale, quality);
          renderedPages[pageNum - 1] = result;
          completedPages++;

          const percent = Math.round((completedPages / totalPages) * 80);
          updateProgress(percent, `মাল্টি-কোর প্রসেসিং: ${completedPages} / ${totalPages} পেজ`);
        }
      }

      // একসাথে সমান্তরালে থ্রেডগুলো রান করা
      const workers = Array.from({ length: concurrency }, () => worker());
      await Promise.all(workers);

      updateProgress(85, "নতুন স্ট্রাকচারে পেজ অ্যাসেম্বল করা হচ্ছে...");

      // ক্রমানুসারে পেজগুলো নতুন PDF-এ যোগ করা
      for (let i = 0; i < totalPages; i++) {
        const item = renderedPages[i];
        const embeddedImg = await newPdf.embedJpg(item.buffer);
        const newPage = newPdf.addPage([item.width, item.height]);
        newPage.drawImage(embeddedImg, {
          x: 0,
          y: 0,
          width: item.width,
          height: item.height
        });
      }

      updateProgress(95, "স্ট্রিম অপ্টিমাইজেশন ও ফ্লিপবুক প্যাকেজিং...");

      const compressedBytes = await newPdf.save({ useObjectStreams: true });
      const blob = new Blob([compressedBytes], { type: 'application/pdf' });
      const downloadUrl = URL.createObjectURL(blob);

      const initialSize = activeFile.size;
      const finalSize = compressedBytes.length;
      const savedPercent = Math.max(0, (((initialSize - finalSize) / initialSize) * 100)).toFixed(1);
      const finalMB = (finalSize / (1024 * 1024)).toFixed(2);

      statsText.innerHTML = `নতুন সাইজ: <b>${finalMB} MB</b> (কমেছে <b>${savedPercent}%</b>)`;

      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `flipbook_${activeFile.name}`;
        a.click();
      };

      updateProgress(100, "কম্প্রেশন সম্পন্ন!");
      resultBox.style.display = 'block';

    } catch (err) {
      console.error(err);
      alert("ত্রুটি ঘটেছে: " + err.message);
      statusLabel.innerText = "ব্যর্থ হয়েছে!";
    } finally {
      compressBtn.disabled = false;
    }
  }
</script>

</body>
</html>
