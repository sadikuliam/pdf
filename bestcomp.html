<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Fast WASM PDF Compressor (Flipbook Ready)</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 36px 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); width: 100%; max-width: 560px; text-align: center; }
    h2 { margin: 0 0 10px 0; font-size: 24px; color: #38bdf8; letter-spacing: -0.5px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; text-align: left; }
    .setting-group { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .setting-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .setting-group select { width: 100%; background: transparent; color: #f8fafc; border: none; font-size: 14px; outline: none; cursor: pointer; }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 10px; padding: 36px 20px; background: rgba(56, 189, 248, 0.03); cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); border-color: #7dd3fc; }
    input[type="file"] { display: none; }
    .file-details { font-weight: 500; font-size: 14px; word-break: break-all; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
    .progress-box { margin-top: 24px; display: none; text-align: left; }
    .status-text { font-size: 13px; color: #cbd5e1; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .result-box { margin-top: 24px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #10b981; display: none; }
    .stats { font-size: 14px; color: #34d399; margin-bottom: 12px; font-weight: 500; }
    .btn-download { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-download:hover { background: #059669; }
  </style>

  <!-- High-Performance WebAssembly Ghostscript Module -->
  <script src="https://cdn.jsdelivr.net/npm/@wasmer/ghostscript@0.1.0/lib/index.umd.js"></script>
</head>
<body>

<div class="card">
  <h2>WebAssembly PDF Optimizer</h2>
  <p>হাই-পারফরম্যান্স ফ্লিপবুক কম্প্রেসার (Fast Web View + ভেক্টর ক্লিয়ারিটি)</p>

  <div class="settings">
    <div class="setting-group">
      <label for="dpiSelect">টার্গেট রেজোলিউশন</label>
      <select id="dpiSelect">
        <option value="150" selected>150 DPI (ফ্লিপবুকের জন্য পারফেক্ট)</option>
        <option value="120">120 DPI (অতিরিক্ত ছোট সাইজ)</option>
        <option value="200">200 DPI (হাই-রেজোলিউশন রিডিং)</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="qualitySelect">ইমেজ কোয়ালিটি</label>
      <select id="qualitySelect">
        <option value="/ebook" selected>ই-বুক স্ট্যান্ডার্ড (ব্যালেন্সড)</option>
        <option value="/screen">স্ক্রিন ভিউ (সবচেয়ে ছোট)</option>
        <option value="/prepress">হাই কোয়ালিটি</option>
      </select>
    </div>
  </div>

  <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
    <div class="file-details" id="fileLabel">ক্লিক করে PDF সিলেক্ট করুন বা ফাইল ড্রপ করুন</div>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <button class="btn" id="compressBtn" disabled onclick="processWithWASM()">কম্প্রেস শুরু করুন</button>

  <div class="progress-box" id="progressBox">
    <div class="status-text">
      <span id="statusLabel">WASM কোর লোড হচ্ছে...</span>
      <span id="percentLabel">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="stats" id="statsText">সাইজ কমেছে: ০%</div>
    <button class="btn btn-download" id="downloadBtn">ডাউনলোড অপ্টিমাইজড PDF</button>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const compressBtn = document.getElementById('compressBtn');
  const progressBox = document.getElementById('progressBox');
  const progressBar = document.getElementById('progressBar');
  const statusLabel = document.getElementById('statusLabel');
  const percentLabel = document.getElementById('percentLabel');
  const resultBox = document.getElementById('resultBox');
  const statsText = document.getElementById('statsText');
  const downloadBtn = document.getElementById('downloadBtn');

  let activeFile = null;

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      activeFile = e.target.files[0];
      const mbSize = (activeFile.size / (1024 * 1024)).toFixed(2);
      fileLabel.innerText = `📄 ${activeFile.name} (${mbSize} MB)`;
      compressBtn.disabled = false;
      resultBox.style.display = 'none';
    }
  });

  // ড্র্যাগ অ্যান্ড ড্রপ সাপোর্ট
  const dropArea = document.getElementById('dropArea');
  ['dragenter', 'dragover'].forEach(name => {
    dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = '#38bdf8'; }, false);
  });
  ['dragleave', 'drop'].forEach(name => {
    dropArea.addEventListener(name, (e) => { e.preventDefault(); dropArea.style.borderColor = '#38bdf8'; }, false);
  });
  dropArea.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length > 0) {
      fileInput.files = e.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    }
  });

  function updateProgress(percent, text) {
    progressBar.style.width = `${percent}%`;
    percentLabel.innerText = `${percent}%`;
    if (text) statusLabel.innerText = text;
  }

  async function processWithWASM() {
    if (!activeFile) return;

    compressBtn.disabled = true;
    progressBox.style.display = 'block';
    resultBox.style.display = 'none';
    updateProgress(15, "ফাইল মেমরিতে প্রস্তুত হচ্ছে...");

    try {
      const fileBuffer = await activeFile.arrayBuffer();
      const inputBytes = new Uint8Array(fileBuffer);
      
      updateProgress(35, "নেটিভ WASM ইঞ্জিন শুরু হচ্ছে...");
      
      const targetDPI = document.getElementById('dpiSelect').value;
      const pdfProfile = document.getElementById('qualitySelect').value;

      // Wasmer Ghostscript ইনিশিয়ালাইজেশন
      const { Ghostscript } = window.GhostscriptWasm || window.Ghostscript || {};
      
      if (!Ghostscript) {
        throw new Error("WASM মডিউল লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।");
      }

      const instance = await Ghostscript.init();

      updateProgress(55, "অপ্টিমাইজেশন ও লিনিয়ারাইজেশন চলছে...");

      // ফাইল সিস্টেম ভার্চুয়ালাইজেশন
      instance.fs.writeFile('input.pdf', inputBytes);

      // নিখুঁত ফ্লিপবুক প্যারামিটার
      const gsArgs = [
        'gs',
        '-sDEVICE=pdfwrite',
        '-dCompatibilityLevel=1.6',
        `-dPDFSETTINGS=${pdfProfile}`,
        '-dNOPAUSE',
        '-dQUIET',
        '-dBATCH',
        '-dFastWebView=true',
        '-dColorImageDownsampleType=/Bicubic',
        `-dColorImageResolution=${targetDPI}`,
        `-dGrayImageResolution=${targetDPI}`,
        '-dMonoImageResolution=300',
        '-dEmbedAllFonts=true',
        '-dSubsetFonts=true',
        '-dAutoRotatePages=/None',
        '-sOutputFile=output.pdf',
        'input.pdf'
      ];

      await instance.run(gsArgs);

      updateProgress(85, "ফাইল আউটপুট প্রসেস হচ্ছে...");

      const outputBytes = instance.fs.readFile('output.pdf');
      
      // ভার্চুয়াল মেমরি ক্লিনআপ
      instance.fs.unlink('input.pdf');
      instance.fs.unlink('output.pdf');

      updateProgress(100, "কম্প্রেশন সম্পন্ন!");

      const blob = new Blob([outputBytes], { type: 'application/pdf' });
      const downloadUrl = URL.createObjectURL(blob);

      // সাইজ কম্প্যারিজন ক্যালকুলেশন
      const initialSize = activeFile.size;
      const finalSize = outputBytes.length;
      const savedPercent = Math.max(0, (((initialSize - finalSize) / initialSize) * 100)).toFixed(1);
      const finalMB = (finalSize / (1024 * 1024)).toFixed(2);

      statsText.innerHTML = `আউটপুট সাইজ: <b>${finalMB} MB</b> (সাইজ কমেছে <b>${savedPercent}%</b>)`;

      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `flipbook_${activeFile.name}`;
        a.click();
      };

      resultBox.style.display = 'block';
    } catch (error) {
      console.error(error);
      statusLabel.innerText = "প্রসেসিং ব্যর্থ হয়েছে। ফাইল ফরম্যাট চেক করুন।";
      alert("ত্রুটি: " + error.message);
    } finally {
      compressBtn.disabled = false;
    }
  }
</script>

</body>
</html>
