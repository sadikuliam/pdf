<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook PDF Compressor</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 36px 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); width: 100%; max-width: 560px; text-align: center; }
    h2 { margin: 0 0 10px 0; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; text-align: left; }
    .setting-group { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .setting-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .setting-group select { width: 100%; background: transparent; color: #f8fafc; border: none; font-size: 14px; outline: none; cursor: pointer; }
    .dropzone { border: 2px dashed #38bdf8; border-radius: 10px; padding: 36px 20px; background: rgba(56, 189, 248, 0.03); cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .dropzone:hover { background: rgba(56, 189, 248, 0.08); border-color: #7dd3fc; }
    input[type="file"] { display: none; }
    .file-details { font-weight: 500; font-size: 14px; word-break: break-all; }
    .btn { background: #0284c7; color: white; border: none; padding: 14px 20px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
    .progress-box { margin-top: 24px; display: none; text-align: left; }
    .status-text { font-size: 13px; color: #cbd5e1; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 8px; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; width: 0%; transition: width 0.2s; }
    .result-box { margin-top: 24px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #10b981; display: none; }
    .stats { font-size: 14px; color: #34d399; margin-bottom: 12px; font-weight: 500; }
    .btn-download { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-download:hover { background: #059669; }
  </style>

  <!-- Stable and Fast Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

<div class="card">
  <h2>Flipbook PDF Compressor</h2>
  <p>Flipbook-er jonyo fast rendering ebong light-weight size optimization</p>

  <div class="settings">
    <div class="setting-group">
      <label for="scaleSelect">Display Quality (DPI Scale)</label>
      <select id="scaleSelect">
        <option value="1.25">120 DPI (Light Size)</option>
        <option value="1.5" selected>150 DPI (Flipbook Balanced)</option>
        <option value="1.8">180 DPI (High Sharpness)</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="qualitySelect">Image Compression</label>
      <select id="qualitySelect">
        <option value="0.65">Aggressive (Chhoto Size)</option>
        <option value="0.75" selected>Balanced (Standard)</option>
        <option value="0.85">High Clarity</option>
      </select>
    </div>
  </div>

  <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
    <div class="file-details" id="fileLabel">Click kore PDF select korun ba drop korun</div>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <button class="btn" id="compressBtn" disabled onclick="compressPDF()">Compress Shuru Korun</button>

  <div class="progress-box" id="progressBox">
    <div class="status-text">
      <span id="statusLabel">Processing shuru hochhe...</span>
      <span id="percentLabel">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="stats" id="statsText">Size komeche: 0%</div>
    <button class="btn btn-download" id="downloadBtn">Compressed PDF Download Korun</button>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const compressBtn = document.getElementById('compressBtn');
  const progressBox = document.getElementById('progressBox');
  const progressBar = document.getElementById('progressBar');
  const statusLabel = document.getElementById('statusLabel');
  const percentLabel = document.getElementById('percentLabel');
  const resultBox = document.getElementById('resultBox');
  const statsText = document.getElementById('statsText');
  const downloadBtn = document.getElementById('downloadBtn');

  let activeFile = null;

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      activeFile = e.target.files[0];
      const mbSize = (activeFile.size / (1024 * 1024)).toFixed(2);
      fileLabel.innerText = `📄 ${activeFile.name} (${mbSize} MB)`;
      compressBtn.disabled = false;
      resultBox.style.display = 'none';
    }
  });

  function updateProgress(percent, text) {
    progressBar.style.width = `${percent}%`;
    percentLabel.innerText = `${percent}%`;
    if (text) statusLabel.innerText = text;
  }

  async function compressPDF() {
    if (!activeFile) return;

    compressBtn.disabled = true;
    progressBox.style.display = 'block';
    resultBox.style.display = 'none';
    updateProgress(5, "File memory-te load hochhe...");

    try {
      const scale = parseFloat(document.getElementById('scaleSelect').value);
      const quality = parseFloat(document.getElementById('qualitySelect').value);

      const arrayBuffer = await activeFile.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      const originalPdf = await loadingTask.promise;
      const totalPages = originalPdf.numPages;

      const newPdf = await PDFLib.PDFDocument.create();

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      for (let i = 1; i <= totalPages; i++) {
        const progress = Math.round((i / totalPages) * 85);
        updateProgress(progress, `Page process hochhe: ${i} / ${totalPages}`);

        const page = await originalPdf.getPage(i);
        const viewport = page.getViewport({ scale: scale });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;

        const imgDataUrl = canvas.toDataURL('image/jpeg', quality);
        const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
        const embeddedImg = await newPdf.embedJpg(imgBytes);

        const newPage = newPdf.addPage([viewport.width, viewport.height]);
        newPage.drawImage(embeddedImg, {
          x: 0,
          y: 0,
          width: viewport.width,
          height: viewport.height
        });

        // Small pause to keep UI responsive
        await new Promise(r => setTimeout(r, 10));
      }

      updateProgress(95, "Structure optimize ebong save hochhe...");

      const compressedBytes = await newPdf.save({ useObjectStreams: true });
      const blob = new Blob([compressedBytes], { type: 'application/pdf' });
      const downloadUrl = URL.createObjectURL(blob);

      const initialSize = activeFile.size;
      const finalSize = compressedBytes.length;
      const savedPercent = Math.max(0, (((initialSize - finalSize) / initialSize) * 100)).toFixed(1);
      const finalMB = (finalSize / (1024 * 1024)).toFixed(2);

      statsText.innerHTML = `Output Size: <b>${finalMB} MB</b> (Size komeche <b>${savedPercent}%</b>)`;

      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `flipbook_${activeFile.name}`;
        a.click();
      };

      updateProgress(100, "Shompurno hoyeche!");
      resultBox.style.display = 'block';

    } catch (err) {
      console.error(err);
      alert("Error: " + err.message);
      statusLabel.innerText = "Error ghoteche!";
    } finally {
      compressBtn.disabled = false;
    }
  }
</script>

</body>
</html>
