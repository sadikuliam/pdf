<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maga Flipbook</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #flipbook {
      width: 900px;   /* বড় করা হয়েছে */
      height: 600px;  /* বড় করা হয়েছে */
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border-radius: 8px;
      background: white;
    }
    .page {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    canvas {
      width: 100% !important;   /* পুরো পেজ ভিউ */
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>
  <div id="flipbook"></div>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Turn.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4/turn.min.js"></script>

  <script>
    const url = 'maga123.pdf'; // তোমার নতুন PDF ফাইল

    const flipbook = document.getElementById('flipbook');
    pdfjsLib.getDocument(url).promise.then(pdf => {
      const totalPages = pdf.numPages;
      let loadedPages = 0;

      for (let i = 1; i <= totalPages; i++) {
        pdf.getPage(i).then(page => {
          const viewport = page.getViewport({ scale: 2 }); // বড় স্কেল
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          page.render({ canvasContext: context, viewport: viewport }).promise.then(() => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.appendChild(canvas);
            flipbook.appendChild(pageDiv);

            loadedPages++;
            if (loadedPages === totalPages) {
              $('#flipbook').turn({
                width: 900,
                height: 600,
                autoCenter: true,
                gradients: true,
                elevation: 50,
                display: 'double' // ডাবল পেজ ভিউ
              });
            }
          });
        });
      }
    });
  </script>
</body>
</html>
