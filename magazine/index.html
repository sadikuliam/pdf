<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maga Flipbook</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- PDF.js (PDF রেন্ডার করার জন্য) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <!-- Page-Flip (ফ্লিপবুক ইফেক্টের জন্য) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <div class="loading" id="loading">লোড হচ্ছে... দয়া করে অপেক্ষা করুন</div>

  <div class="flipbook-container">
    <div id="book">
      <!-- PDF পাতাগুলো এখানে লোড হবে -->
    </div>
  </div>

  <div class="controls">
    <button id="prev">❮ আগের পাতা</button>
    <span id="page-info">পাতা ১</span>
    <button id="next">পরের পাতা ❯</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
