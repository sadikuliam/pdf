<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OCR PDF Converter</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #fff;
        }

        h1 { font-size: 28px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 14px; margin-bottom: 30px; color: rgba(255, 255, 255, 0.9); }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; }
        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .progress-container { display: none; margin-top: 20px; }
        
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress {
            height: 100%;
            width: 50%; /* Fake progress while server processes */
            background: #00f2fe;
            border-radius: 10px;
            animation: loading 2s infinite alternate;
        }

        @keyframes loading {
            0% { width: 30%; }
            100% { width: 80%; }
        }

        .success-message {
            display: none;
            margin-top: 20px;
            color: #d4edda;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #fileName { margin-top: 15px; font-size: 13px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>PDF/Image to Searchable PDF</h1>
        <p>যেকোনো ছবি বা PDF আপলোড করে Searchable PDF এ কনভার্ট করুন। হুবহু অরিজিনাল ডিজাইন ঠিক থাকবে!</p>

        <label for="fileInput">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <h3 id="uploadText">ফাইল নির্বাচন করতে ক্লিক করুন</h3>
                <div id="fileName"></div>
            </div>
        </label>
        <input type="file" id="fileInput" accept=".pdf, image/*">

        <button class="btn" id="convertBtn" disabled>Convert & Download PDF</button>

        <div class="progress-container" id="progressContainer">
            <p id="statusText">সার্ভারে আপলোড ও প্রসেসিং হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            ✅ Conversion Successful! File Downloaded.
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const statusText = document.getElementById('statusText');
        const successMessage = document.getElementById('successMessage');
        const uploadText = document.getElementById('uploadText');

        // আপনার Render API লিংকটি এখানে দেওয়া হলো
        const API_URL = "https://pdf-tibd.onrender.com/convert";

        // ফাইল সিলেক্ট ইভেন্ট
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameDisplay.textContent = "Selected: " + this.files[0].name;
                uploadText.style.display = 'none';
                convertBtn.disabled = false;
                successMessage.style.display = 'none';
            }
        });

        // কনভার্ট বাটনে ক্লিক ইভেন্ট
        convertBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) return;

            // UI পরিবর্তন
            convertBtn.style.display = 'none';
            progressContainer.style.display = 'block';
            statusText.textContent = "সার্ভারে আপলোড ও প্রসেসিং হচ্ছে (১-২ মিনিট লাগতে পারে)...";

            // ফাইল ডাটা তৈরি
            const formData = new FormData();
            formData.append('file', file);

            try {
                // ব্যাকএন্ড API-তে ফাইল পাঠানো
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("সার্ভার এরর বা ফাইল প্রসেস করা যায়নি।");
                }

                statusText.textContent = "ফাইল তৈরি হচ্ছে...";
                
                // সার্ভার থেকে Searchable PDF ফেরত নেওয়া
                const blob = await response.blob();
                
                // ডাউনলোড করার জন্য টেম্পোরারি লিংক তৈরি
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                
                // ফাইলের নাম সেট করা
                const originalName = file.name.split('.').slice(0, -1).join('.');
                a.download = "Searchable_" + originalName + ".pdf";
                
                // স্বয়ংক্রিয়ভাবে ডাউনলোড শুরু করা
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                // সফল মেসেজ দেখানো
                progressContainer.style.display = 'none';
                successMessage.style.display = 'block';
                convertBtn.style.display = 'inline-block';
                convertBtn.disabled = true;

            } catch (error) {
                console.error(error);
                alert("দুঃখিত, কোনো একটি সমস্যা হয়েছে! দয়া করে আবার চেষ্টা করুন।");
                progressContainer.style.display = 'none';
                convertBtn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
