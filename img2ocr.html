<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real OCR Converter with Download</title>
    
    <!-- Tesseract.js (OCR-এর জন্য) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- jsPDF (PDF তৈরি ও ডাউনলোডের জন্য) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #fff;
        }

        h1 { font-size: 28px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 14px; margin-bottom: 30px; color: rgba(255, 255, 255, 0.9); }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; }
        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .progress-container { display: none; margin-top: 20px; }
        
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #00f2fe;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .success-message {
            display: none;
            margin-top: 20px;
            color: #d4edda;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #fileName { margin-top: 15px; font-size: 13px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI OCR Converter</h1>
        <p>যেকোনো ছবি (JPG, PNG) আপলোড করে PDF এ কনভার্ট করুন</p>

        <label for="fileInput">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <h3 id="uploadText">ছবি নির্বাচন করতে ক্লিক করুন</h3>
                <div id="fileName"></div>
            </div>
        </label>
        <input type="file" id="fileInput" accept="image/*">

        <button class="btn" id="convertBtn" disabled>Convert & Download PDF</button>

        <div class="progress-container" id="progressContainer">
            <p id="statusText">Processing document...</p>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            ✅ Conversion Successful! File Downloaded.
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progress = document.getElementById('progress');
        const statusText = document.getElementById('statusText');
        const successMessage = document.getElementById('successMessage');
        const uploadText = document.getElementById('uploadText');

        // ফাইল সিলেক্ট ইভেন্ট
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameDisplay.textContent = "Selected: " + this.files[0].name;
                uploadText.style.display = 'none';
                convertBtn.disabled = false;
                successMessage.style.display = 'none';
                progress.style.width = '0%';
            }
        });

        // কনভার্ট বাটনে ক্লিক ইভেন্ট
        convertBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) return;

            // UI পরিবর্তন
            convertBtn.style.display = 'none';
            progressContainer.style.display = 'block';
            statusText.textContent = "Starting OCR Engine...";

            try {
                // Tesseract দিয়ে ছবি থেকে লেখা পড়া
                const worker = await Tesseract.createWorker("eng", 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const progressVal = Math.round(m.progress * 100);
                            progress.style.width = progressVal + '%';
                            statusText.textContent = `Extracting Text... ${progressVal}%`;
                        }
                    }
                });

                const ret = await worker.recognize(file);
                const extractedText = ret.data.text;
                await worker.terminate();

                if (!extractedText.trim()) {
                    alert("ছবিতে কোনো লেখা পাওয়া যায়নি!");
                    resetUI();
                    return;
                }

                // jsPDF দিয়ে PDF তৈরি করা
                statusText.textContent = "Creating PDF File...";
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // টেক্সট যাতে পৃষ্ঠার বাইরে না যায় তাই মার্জিন সেট করা
                const splitText = doc.splitTextToSize(extractedText, 180);
                doc.text(splitText, 15, 15);
                
                // PDF ফাইল ডাউনলোড করা
                doc.save("OCR_Result.pdf");

                // সফল মেসেজ দেখানো
                progressContainer.style.display = 'none';
                successMessage.style.display = 'block';
                convertBtn.style.display = 'inline-block';
                convertBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusText.textContent = "Error occurred during conversion!";
                setTimeout(resetUI, 3000);
            }
        });

        function resetUI() {
            progressContainer.style.display = 'none';
            convertBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
