<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Image to PDF Converter</title>

    <!-- CDN for jsPDF (handles direct image-to-PDF conversion client-side) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --violet: #7c3aed;
            --violet-hover: #6d28d9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #fff;
            position: relative;
        }

        /* Header Section & Violet Home Button Style */
        .header {
            position: relative;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .home-btn {
            position: absolute;
            left: 0;
            top: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--violet);
            border-radius: 8px;
            background: #f5f3ff;
            color: var(--violet);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            border-color: var(--violet-hover);
            color: white;
            background: var(--violet);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }

        /* Mobile Layout Adjustment */
        @media (max-width: 480px) {
            .header { padding-top: 45px; }
        }

        h1 { font-size: 26px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 14px; color: rgba(255, 255, 255, 0.9); }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-area:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        .upload-icon { font-size: 40px; margin-bottom: 15px; }
        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; opacity: 0.6; }

        .success-message {
            display: none;
            margin-top: 20px;
            color: #d4edda;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #fileName { margin-top: 15px; font-size: 13px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section with Home Button -->
        <div class="header">
            <a href="https://pdf.shmwb.in/" class="home-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Home
            </a>
            <h1>High-Quality Image to PDF</h1>
            <p>ছবি নির্বাচন করুন এবং ক্রিস্টাল ক্লিয়ার ফুল-রেজোলিউশন PDF ডাউনলোড করুন।</p>
        </div>

        <label for="fileInput">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼️</div>
                <h3 id="uploadText">ছবি নির্বাচন করতে ক্লিক করুন</h3>
                <div id="fileName"></div>
            </div>
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">

        <button class="btn" id="convertBtn" disabled>Convert & Download PDF</button>

        <div class="success-message" id="successMessage">
            ✅ PDF Successfully Generated & Downloaded!
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const successMessage = document.getElementById('successMessage');
        const uploadText = document.getElementById('uploadText');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameDisplay.textContent = "Selected: " + this.files[0].name;
                uploadText.style.display = 'none';
                convertBtn.disabled = false;
                successMessage.style.display = 'none';
            }
        });

        convertBtn.addEventListener('click', function() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function() {
                    // Create PDF matching exact pixel dimensions of the image to preserve 100% sharp quality
                    const orientation = img.width > img.height ? 'l' : 'p';
                    const pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'px',
                        format: [img.width, img.height],
                        compress: false // Disables compression for crystal-clear resolution
                    });

                    // Render original raw image into PDF container
                    pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height, undefined, 'NONE');

                    // Trigger PDF download
                    const originalName = file.name.split('.').slice(0, -1).join('.');
                    pdf.save(originalName + ".pdf");

                    // Update UI state
                    successMessage.style.display = 'block';
                };
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
