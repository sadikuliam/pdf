<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Image to PDF Converter</title>

    <!-- CDN for jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --violet: #7c3aed;
            --violet-hover: #6d28d9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #fff;
        }

        /* Fixed Header Layout using Flexbox */
        .header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 25px;
            gap: 15px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--violet);
            border-radius: 8px;
            background: #f5f3ff;
            color: var(--violet);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            border-color: var(--violet-hover);
            color: white;
            background: var(--violet);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }

        .header-text {
            width: 100%;
            text-align: center;
        }

        h1 { font-size: 26px; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 14px; color: rgba(255, 255, 255, 0.9); }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .upload-area:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; opacity: 0.6; }

        .success-message {
            display: none;
            margin-top: 20px;
            color: #d4edda;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        #fileList { 
            margin-bottom: 15px; 
            font-size: 13px; 
            color: #fff; 
            font-weight: bold; 
            max-height: 200px; 
            overflow-y: auto; 
            text-align: left;
            padding: 0 5px;
        }

        /* Custom Scrollbar */
        #fileList::-webkit-scrollbar { width: 6px; }
        #fileList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }

        .file-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .file-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
        }

        .icon-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.4);
        }

        .icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .del-btn:hover:not(:disabled) {
            background: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Clean Separate Header Block -->
        <div class="header">
            <a href="https://pdf.shmwb.in/" class="home-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Home
            </a>
            <div class="header-text">
                <h1>High-Quality Image to PDF</h1>
                <p>একাধিক ছবি নির্বাচন করুন এবং ক্রিস্টাল ক্লিয়ার ফুল-রেজোলিউশন PDF তৈরি করুন।</p>
            </div>
        </div>

        <label for="fileInput">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼️</div>
                <h3 id="uploadText">ছবি নির্বাচন করতে ক্লিক করুন</h3>
            </div>
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" multiple>

        <!-- File list moved outside label so buttons are clickable without triggering file dialog -->
        <div id="fileList"></div>

        <button class="btn" id="convertBtn" disabled>Convert & Download PDF</button>

        <div class="success-message" id="successMessage">
            ✅ PDF Successfully Generated & Downloaded!
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        const fileInput = document.getElementById('fileInput');
        const fileListDisplay = document.getElementById('fileList');
        const convertBtn = document.getElementById('convertBtn');
        const successMessage = document.getElementById('successMessage');
        const uploadText = document.getElementById('uploadText');

        let selectedFiles = [];

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                // Append newly selected files to existing list
                selectedFiles = [...selectedFiles, ...Array.from(this.files)];
                updateFileListUI();
                // Clear input value so same files can be selected again if needed
                this.value = ''; 
            }
        });

        // Function to move items Up and Down
        function moveItem(index, direction) {
            if (direction === 'up' && index > 0) {
                const temp = selectedFiles[index];
                selectedFiles[index] = selectedFiles[index - 1];
                selectedFiles[index - 1] = temp;
            } else if (direction === 'down' && index < selectedFiles.length - 1) {
                const temp = selectedFiles[index];
                selectedFiles[index] = selectedFiles[index + 1];
                selectedFiles[index + 1] = temp;
            }
            updateFileListUI();
        }

        // Function to remove an item
        function removeItem(index) {
            selectedFiles.splice(index, 1);
            updateFileListUI();
        }

        function updateFileListUI() {
            fileListDisplay.innerHTML = '';
            
            if (selectedFiles.length > 0) {
                uploadText.textContent = 'আরও ছবি যোগ করতে ক্লিক করুন';
                convertBtn.disabled = false;
                successMessage.style.display = 'none';

                selectedFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    
                    item.innerHTML = `
                        <span class="file-name" title="${file.name}">${index + 1}. ${file.name}</span>
                        <div class="action-btns">
                            <button type="button" class="icon-btn" onclick="moveItem(${index}, 'up')" ${index === 0 ? 'disabled' : ''} title="Move Up">⬆️</button>
                            <button type="button" class="icon-btn" onclick="moveItem(${index}, 'down')" ${index === selectedFiles.length - 1 ? 'disabled' : ''} title="Move Down">⬇️</button>
                            <button type="button" class="icon-btn del-btn" onclick="removeItem(${index})" title="Remove">❌</button>
                        </div>
                    `;
                    fileListDisplay.appendChild(item);
                });
            } else {
                uploadText.textContent = 'একাধিক ছবি নির্বাচন করতে ক্লিক করুন';
                convertBtn.disabled = true;
            }
        }

        convertBtn.addEventListener('click', async function() {
            if (selectedFiles.length === 0) return;

            convertBtn.disabled = true;
            convertBtn.textContent = 'Generating PDF...';

            try {
                let pdf = null;

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const dataUrl = await readFileAsDataURL(file);
                    
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.src = dataUrl;
                        img.onload = function() {
                            const orientation = img.width > img.height ? 'l' : 'p';
                            
                            if (i === 0) {
                                pdf = new jsPDF({
                                    orientation: orientation,
                                    unit: 'px',
                                    format: [img.width, img.height],
                                    compress: false
                                });
                            } else {
                                pdf.addPage([img.width, img.height], orientation);
                            }

                            pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height, undefined, 'NONE');
                            resolve();
                        };
                        img.onerror = reject;
                    });
                }

                pdf.save("converted-images.pdf");
                successMessage.style.display = 'block';
            } catch (error) {
                console.error(error);
                alert('PDF তৈরিতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = 'Convert & Download PDF';
            }
        });

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
