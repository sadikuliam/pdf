<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHM MediaPipe Background Remover</title>
<style>
:root{
  --bg:#eef2f7;
  --panel:#ffffff;
  --text:#15202b;
  --muted:#687786;
  --line:#d8e0e8;
  --accent:#1769ff;
  --danger:#e53935;
  --shadow:0 12px 35px rgba(20,40,70,.10);
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:linear-gradient(135deg,#eef3f9,#f9fbfd);
  color:var(--text);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}
main{
  max-width:1150px;
  margin:auto;
  padding:30px 16px 60px;
}
h1{ margin:0; font-size:clamp(26px,4vw,42px); letter-spacing:-1px; }
.subtitle{ margin:8px 0 25px; color:var(--muted); max-width:750px; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
.drop{
  border:2px dashed #aebdcd; border-radius:16px; padding:55px 20px; text-align:center; cursor:pointer; background:#fafcff;
}
.drop:hover{ border-color:var(--accent); background:#f2f7ff; }
.status{ display:none; margin-top:20px; font-weight:600; color:var(--accent); text-align:center; }
.status.on{ display:block; }
.workspace{ display:none; margin-top:22px; }
.workspace.on{ display:block; }
.preview-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media(max-width:750px){ .preview-grid{ grid-template-columns:1fr; } }
.preview-card{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
.preview-title{ padding:11px 14px; font-weight:700; border-bottom:1px solid var(--line); }
.preview-area{
  position:relative; min-height:300px; overflow:auto; background:#fff;
  background-image:linear-gradient(45deg,#ddd 25%,transparent 25%), linear-gradient(-45deg,#ddd 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#ddd 75%), linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0;
}
.preview-area img, .preview-area canvas{ display:block; width:100%; height:auto; }
.controls{ margin-top:22px; }
.control-section{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
button{ font:inherit; }
button.main{ border:0; border-radius:9px; padding:11px 18px; background:var(--accent); color:#fff; cursor:pointer; font-weight:700; }
button.secondary{ border:1px solid var(--line); border-radius:9px; padding:10px 16px; background:#fff; cursor:pointer; }
.color-list{ display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
.color{ width:38px; height:38px; border-radius:50%; border:2px solid #d0d8e0; cursor:pointer; }
.color.active{ outline:3px solid var(--accent); outline-offset:2px; }
.transparent{ background:linear-gradient(45deg,#ccc 25%,transparent 25%), linear-gradient(-45deg,#ccc 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#ccc 75%), linear-gradient(-45deg,transparent 75%,#ccc 75%); background-size:12px 12px; }
</style>

<!-- MediaPipe Selfie Segmentation Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

<main>
  <h1>SHM Free AI Background Remover</h1>
  <p class="subtitle">Powered by Google MediaPipe AI (100% Free, runs directly in your browser without API keys).</p>

  <div class="panel">
    <div class="drop" id="drop">
      <strong>Click to choose an image or drag & drop here</strong>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="status" id="status">Loading AI Model & Processing...</div>

    <div class="workspace" id="workspace">
      <div class="preview-grid">
        <div class="preview-card">
          <div class="preview-title">Original</div>
          <div class="preview-area"><img id="original"></div>
        </div>
        <div class="preview-card">
          <div class="preview-title">Background Removed</div>
          <div class="preview-area"><canvas id="canvas"></canvas></div>
        </div>
      </div>

      <div class="controls">
        <div class="control-section">
          <h3>🎨 Background Color</h3>
          <div class="color-list">
            <button class="color transparent active" data-color="transparent"></button>
            <button class="color" data-color="#ffffff" style="background:#ffffff"></button>
            <button class="color" data-color="#000000" style="background:#000000"></button>
            <button class="color" data-color="#f44336" style="background:#f44336"></button>
            <button class="color" data-color="#2196f3" style="background:#2196f3"></button>
          </div>
        </div>
        <div class="control-section">
          <div class="row">
            <button class="main" id="download">⬇ Download PNG</button>
            <button class="secondary" id="newImage">New Image</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), statusBox = $("status"), workspace = $("workspace");
const originalImg = $("original"), canvas = $("canvas"), ctx = canvas.getContext("2d");

let currentBg = "transparent", loadedImage = null;

drop.onclick = () => fileInput.click();
fileInput.onchange = e => handleImage(e.target.files[0]);

drop.ondragover = e => e.preventDefault();
drop.ondrop = e => { e.preventDefault(); handleImage(e.dataTransfer.files[0]); };

const selfieSegmentation = new SelfieSegmentation({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
});
selfieSegmentation.setOptions({ modelSelection: 1 });

selfieSegmentation.onResults(results => {
  statusBox.classList.remove("on");
  workspace.classList.add("on");

  canvas.width = loadedImage.width;
  canvas.height = loadedImage.height;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentBg !== "transparent") {
    ctx.fillStyle = currentBg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-in';
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
  ctx.restore();
});

async function handleImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  statusBox.classList.add("on");
  workspace.classList.remove("on");

  originalImg.src = URL.createObjectURL(file);
  loadedImage = new Image();
  loadedImage.src = originalImg.src;

  loadedImage.onload = async () => {
    await selfieSegmentation.send({ image: loadedImage });
  };
}

document.querySelectorAll(".color").forEach(btn => {
  btn.onclick = async () => {
    document.querySelectorAll(".color").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentBg = btn.dataset.color;
    if (loadedImage) {
      await selfieSegmentation.send({ image: loadedImage });
    }
  };
});

$("download").onclick = () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "MediaPipe-Background-Removed.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
};

$("newImage").onclick = () => {
  workspace.classList.remove("on");
  fileInput.value = "";
};
</script>

</body>
</html>
