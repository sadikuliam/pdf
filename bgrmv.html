<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHM Pro AI Background Remover & Editor</title>
<style>
:root{
  --bg:#eef2f7;
  --panel:#ffffff;
  --text:#15202b;
  --muted:#687786;
  --line:#d8e0e8;
  --accent:#1769ff;
  --danger:#e53935;
  --shadow:0 12px 35px rgba(20,40,70,.10);
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:linear-gradient(135deg,#eef3f9,#f9fbfd);
  color:var(--text);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}
main{
  max-width:1150px;
  margin:auto;
  padding:30px 16px 60px;
}
h1{ margin:0; font-size:clamp(26px,4vw,42px); letter-spacing:-1px; }
.subtitle{ margin:8px 0 25px; color:var(--muted); max-width:750px; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
.drop{
  border:2px dashed #aebdcd; border-radius:16px; padding:55px 20px; text-align:center; cursor:pointer; background:#fafcff;
}
.drop:hover{ border-color:var(--accent); background:#f2f7ff; }
.status{ display:none; margin-top:20px; font-weight:600; color:var(--accent); text-align:center; }
.status.on{ display:block; }
.workspace{ display:none; margin-top:22px; }
.workspace.on{ display:block; }
.preview-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media(max-width:750px){ .preview-grid{ grid-template-columns:1fr; } }
.preview-card{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; }
.preview-title{ padding:11px 14px; font-weight:700; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.preview-area{
  position:relative; min-height:380px; max-height:500px; overflow:auto; background:#fff;
  background-image:linear-gradient(45deg,#ddd 25%,transparent 25%), linear-gradient(-45deg,#ddd 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#ddd 75%), linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0;
}
.preview-area img{ display:block; width:100%; height:auto; }
.canvas-container {
  position: relative;
  display: block;
  margin: 0 auto;
  transform-origin: top left;
  cursor: none;
}
#canvas{ display:block; width:100%; height:auto; touch-action:none; }

/* Round Mouse Follower Eraser Cursor */
#cursorBox {
  position: absolute;
  width: 30px;
  height: 30px;
  border: 2px solid #000;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 50%;
  pointer-events: none;
  display: none;
  transform: translate(-50%, -50%);
  z-index: 100;
}

.controls{ margin-top:22px; }
.control-section{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
.control-section h3{ margin:0 0 12px; font-size:16px; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
button{ font:inherit; cursor:pointer; }
button.main{ border:0; border-radius:9px; padding:11px 18px; background:var(--accent); color:#fff; font-weight:700; }
button.secondary{ border:1px solid var(--line); border-radius:9px; padding:10px 16px; background:#fff; }
button.secondary.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger{ border:1px solid #ffcaca; color:#c62828; background:#fff; border-radius:9px; padding:10px 16px; }
.color-list{ display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
.color{ width:38px; height:38px; border-radius:50%; border:2px solid #d0d8e0; cursor:pointer; }
.color.active{ outline:3px solid var(--accent); outline-offset:2px; }
.transparent{ background:linear-gradient(45deg,#ccc 25%,transparent 25%), linear-gradient(-45deg,#ccc 25%,transparent 25%), linear-gradient(45deg,transparent 75%,#ccc 75%), linear-gradient(-45deg,transparent 75%,#ccc 75%); background-size:12px 12px; }
input[type=color]{ width:42px; height:38px; padding:0; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
.zoom-info{ font-weight:600; color:var(--muted); }
</style>

<!-- MediaPipe Selfie Segmentation Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

<main>
  <h1>SHM Pro AI Background Remover & Editor</h1>
  <p class="subtitle">Fixed Default Fit Zoom + Round Eraser Cursor + Move & Undo.</p>

  <div class="panel">
    <div class="drop" id="drop">
      <strong>Click to choose an image or drag & drop here</strong>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="status" id="status">Loading AI Model & Processing...</div>

    <div class="workspace" id="workspace">
      <div class="preview-grid">
        <div class="preview-card">
          <div class="preview-title">Original</div>
          <div class="preview-area"><img id="original"></div>
        </div>
        <div class="preview-card">
          <div class="preview-title">
            <span>Background Removed / Edited</span>
            <div class="row" style="gap:5px;">
              <button class="secondary active" id="modeErase" title="Round Erase Mode">⚪ Round Erase</button>
              <button class="secondary" id="modeMove" title="Pan / Move Mode">✋ Move</button>
            </div>
          </div>
          <div class="preview-area" id="resultArea">
            <div class="canvas-container" id="container">
              <canvas id="canvas"></canvas>
              <div id="cursorBox"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <!-- EDIT TOOLS -->
        <div class="control-section">
          <h3>🛠 Editing Tools & Zoom</h3>
          <div class="row">
            <button class="secondary" id="undoBtn" title="Undo last erase">↩ Undo</button>
            <label>Eraser Size: <input type="range" id="eraserSize" min="10" max="80" value="30"></label>
            <button class="secondary" id="zoomOut">🔍 −</button>
            <span class="zoom-info" id="zoomText">100%</span>
            <button class="secondary" id="zoomIn">🔍 +</button>
            <button class="secondary" id="zoomReset">Reset Zoom</button>
          </div>
        </div>

        <!-- BACKGROUND -->
        <div class="control-section">
          <h3>🎨 Background Color Options</h3>
          <div class="color-list" id="colors">
            <button class="color transparent active" data-color="transparent" title="Transparent"></button>
            <button class="color" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            <button class="color" data-color="#000000" style="background:#000000" title="Black"></button>
            <button class="color" data-color="#f44336" style="background:#f44336" title="Red"></button>
            <button class="color" data-color="#2196f3" style="background:#2196f3" title="Blue"></button>
            <button class="color" data-color="#4caf50" style="background:#4caf50" title="Green"></button>
            <button class="color" data-color="#ff9800" style="background:#ff9800" title="Orange"></button>
            <button class="color" data-color="#673ab7" style="background:#673ab7" title="Purple"></button>
            <input type="color" id="customColor" value="#1769ff" title="Custom Color Picker">
          </div>
        </div>

        <!-- DOWNLOAD -->
        <div class="control-section">
          <div class="row">
            <button class="main" id="download">⬇ Download PNG</button>
            <button class="danger" id="newImage">New Image</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), statusBox = $("status"), workspace = $("workspace");
const originalImg = $("original"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const container = $("container"), cursorBox = $("cursorBox"), resultArea = $("resultArea");

let currentBg = "transparent", lastResults = null;
let zoom = 1, isEraserMode = true, eraserSize = 30;
let historyStates = [];
let isDragging = false, dragStartX = 0, dragStartY = 0, isEraseActive = false;

drop.onclick = () => fileInput.click();
fileInput.onchange = e => handleImage(e.target.files[0]);

drop.ondragover = e => e.preventDefault();
drop.ondrop = e => { e.preventDefault(); handleImage(e.dataTransfer.files[0]); };

const selfieSegmentation = new SelfieSegmentation({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
});
selfieSegmentation.setOptions({ modelSelection: 1 });

selfieSegmentation.onResults(results => {
  lastResults = results;
  statusBox.classList.remove("on");
  workspace.classList.add("on");
  
  const w = lastResults.image.width;
  const h = lastResults.image.height;

  canvas.width = w;
  canvas.height = h;

  zoom = 1;
  updateZoomDisplay();
  renderCanvas();
  saveHistory();
});

function renderCanvas() {
  if (!lastResults) return;
  const w = lastResults.image.width;
  const h = lastResults.image.height;

  ctx.save();
  ctx.clearRect(0, 0, w, h);

  if (currentBg !== "transparent") {
    ctx.fillStyle = currentBg;
    ctx.fillRect(0, 0, w, h);
  }

  const personCanvas = document.createElement("canvas");
  personCanvas.width = w;
  personCanvas.height = h;
  const pCtx = personCanvas.getContext("2d", { willReadFrequently: true });

  pCtx.drawImage(lastResults.image, 0, 0, w, h);
  pCtx.globalCompositeOperation = 'destination-in';
  pCtx.drawImage(lastResults.segmentationMask, 0, 0, w, h);

  ctx.drawImage(personCanvas, 0, 0, w, h);
  ctx.restore();
}

function saveHistory() {
  const dataURL = canvas.toDataURL();
  historyStates.push(dataURL);
  if (historyStates.length > 15) historyStates.shift();
}

$("undoBtn").onclick = () => {
  if (historyStates.length > 1) {
    historyStates.pop();
    const prevData = historyStates[historyStates.length - 1];
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentBg !== "transparent") {
        ctx.fillStyle = currentBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(img, 0, 0);
    };
    img.src = prevData;
  }
};

async function handleImage(file) {
  if (!file || !file.type.startsWith("image/")) return;
  statusBox.classList.add("on");
  workspace.classList.remove("on");

  originalImg.src = URL.createObjectURL(file);
  const img = new Image();
  img.src = originalImg.src;

  img.onload = async () => {
    historyStates = [];
    await selfieSegmentation.send({ image: img });
  };
}

// Cursor and Erase interactions (Round Eraser)
container.onpointerenter = () => {
  if (isEraserMode) cursorBox.style.display = 'block';
};

container.onpointerleave = () => {
  cursorBox.style.display = 'none';
  isEraseActive = false;
  isDragging = false;
};

container.onpointermove = e => {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (isEraserMode) {
    cursorBox.style.left = x + 'px';
    cursorBox.style.top = y + 'px';

    if (isEraseActive) {
      eraseAt(x, y, rect);
    }
  } else if (isDragging) {
    resultArea.scrollLeft -= (e.clientX - dragStartX);
    resultArea.scrollTop -= (e.clientY - dragStartY);
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  }
};

container.onpointerdown = e => {
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (isEraserMode) {
    isEraseActive = true;
    eraseAt(x, y, rect);
    container.setPointerCapture(e.pointerId);
  } else {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    container.setPointerCapture(e.pointerId);
  }
};

container.onpointerup = e => {
  if (isEraserMode && isEraseActive) {
    isEraseActive = false;
    saveHistory();
  } else if (!isEraserMode) {
    isDragging = false;
  }
};

function eraseAt(x, y, rect) {
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const canvasX = x * scaleX;
  const canvasY = y * scaleY;
  const radius = (eraserSize / 2) * scaleX;

  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(canvasX, canvasY, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Eraser size slider
$("eraserSize").oninput = e => {
  eraserSize = e.target.value;
  cursorBox.style.width = eraserSize + 'px';
  cursorBox.style.height = eraserSize + 'px';
};

// Mode switches
$("modeErase").onclick = () => {
  isEraserMode = true;
  $("modeErase").classList.add("active");
  $("modeMove").classList.remove("active");
  container.style.cursor = "none";
  cursorBox.style.display = 'block';
};

$("modeMove").onclick = () => {
  isEraserMode = false;
  $("modeMove").classList.add("active");
  $("modeErase").classList.remove("active");
  container.style.cursor = "grab";
  cursorBox.style.display = 'none';
};

// Zoom controls (Fit to container by default)
function updateZoomDisplay() {
  container.style.width = (zoom * 100) + "%";
  $("zoomText").textContent = Math.round(zoom * 100) + "%";
}

$("zoomIn").onclick = () => { zoom = Math.min(zoom + 0.25, 4); updateZoomDisplay(); };
$("zoomOut").onclick = () => { zoom = Math.max(zoom - 0.25, 0.5); updateZoomDisplay(); };
$("zoomReset").onclick = () => { zoom = 1; updateZoomDisplay(); };

// Colors
document.querySelectorAll(".color").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".color").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentBg = btn.dataset.color;
    renderCanvas();
    saveHistory();
  };
});

$("customColor").oninput = e => {
  document.querySelectorAll(".color").forEach(b => b.classList.remove("active"));
  currentBg = e.target.value;
  renderCanvas();
  saveHistory();
};

$("download").onclick = () => {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "SHM-Pro-Edited.png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
};

$("newImage").onclick = () => {
  workspace.classList.remove("on");
  fileInput.value = "";
  lastResults = null;
  historyStates = [];
};
</script>

</body>
</html>
