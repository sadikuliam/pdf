<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>3D Touch & Pinch Flipbook</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            user-select: none;
        }

        #upload-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #222;
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }
        .upload-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 28px;
            background: #007bff;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        input[type="file"] {
            display: none;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            font-weight: bold;
        }

        #flipbook-wrapper {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #111;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        #zoom-wrapper {
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            touch-action: none;
        }

        .page-flip-container {
            display: block;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 30, 30, 0.9);
            padding: 8px 14px;
            border-radius: 30px;
            z-index: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 7px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .controls button:active {
            background: #007bff;
        }
        #page-info {
            font-size: 13px;
            color: #eee;
            margin: 0 4px;
        }

        #close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 500;
        }
    </style>
</head>
<body>

    <div id="upload-box">
        <h2 style="font-size: 20px;">Touch Flip & Pinch Zoom</h2>
        <p style="margin-top: 8px; color: #666; font-size: 13px;">Mobile/Tab touch flip ebong pinch zoom</p>
        <label for="pdf-input" class="upload-btn">PDF File Bachun</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <div id="status"></div>
    </div>

    <div id="flipbook-wrapper">
        <button id="close-btn" onclick="location.reload()">Bondho</button>
        
        <div id="zoom-wrapper">
            <div id="book" class="page-flip-container"></div>
        </div>

        <div class="controls">
            <button onclick="flipPrev()">◀ Pata</button>
            <span id="page-info">1 / 1</span>
            <button onclick="flipNext()">Pata ▶</button>
            <button onclick="zoomIn()">🔍+</button>
            <button onclick="zoomOut()">🔍-</button>
            <button onclick="resetZoom()">Reset</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

        let pageFlip = null;
        let pdfDoc = null;
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let startDist = 0;
        let startScale = 1;
        let startPanX = 0;
        let startPanY = 0;
        let isPanning = false;

        const zoomWrapper = document.getElementById('zoom-wrapper');
        const flipbookWrapper = document.getElementById('flipbook-wrapper');

        document.getElementById('pdf-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "File processing...";

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                    const totalPages = pdfDoc.numPages;

                    document.getElementById('upload-box').style.display = 'none';
                    flipbookWrapper.style.display = 'flex';

                    const isMobile = window.innerWidth <= 768;
                    const bookWidth = isMobile ? Math.min(window.innerWidth * 0.94, 450) : 480;
                    const bookHeight = isMobile ? Math.min(window.innerHeight * 0.8, 650) : 680;

                    const bookElem = document.getElementById('book');
                    bookElem.innerHTML = '';

                    for (let i = 1; i <= totalPages; i++) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page';
                        const canvas = document.createElement('canvas');
                        pageDiv.appendChild(canvas);
                        bookElem.appendChild(pageDiv);
                    }

                    pageFlip = new St.PageFlip(bookElem, {
                        width: bookWidth,
                        height: bookHeight,
                        size: "fixed",
                        minWidth: 300,
                        maxWidth: 1000,
                        minHeight: 400,
                        maxHeight: 1200,
                        maxShadowOpacity: 0.5,
                        showCover: true,
                        mobileScrollSupport: false,
                        usePortrait: isMobile
                    });

                    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                    pageFlip.on('flip', (ev) => {
                        document.getElementById('page-info').innerText = `${ev.data + 1} / ${totalPages}`;
                        renderNearbyPages(ev.data + 1, totalPages);
                    });

                    renderNearbyPages(1, totalPages);
                    document.getElementById('page-info').innerText = `1 / ${totalPages}`;

                    setupTouchGestures();

                } catch (err) {
                    alert("Error: " + err.message);
                    location.reload();
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        const rendered = new Set();
        async function renderNearbyPages(current, total) {
            const pagesToRender = [current, current + 1, current + 2, current - 1].filter(p => p >= 1 && p <= total);
            for (let p of pagesToRender) {
                if (rendered.has(p)) continue;
                rendered.add(p);

                const page = await pdfDoc.getPage(p);
                const viewport = page.getViewport({ scale: 2 });
                const pageElems = document.querySelectorAll('.page');
                const canvas = pageElems[p - 1].querySelector('canvas');
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');

                page.render({
                    canvasContext: ctx,
                    viewport: viewport
                });
            }
        }

        function flipNext() {
            if (pageFlip && scale === 1) pageFlip.flipNext();
        }

        function flipPrev() {
            if (pageFlip && scale === 1) pageFlip.flipPrev();
        }

        function updateTransform() {
            zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function zoomIn() {
            scale = Math.min(scale + 0.3, 3.5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.3, 1);
            if (scale === 1) {
                panX = 0;
                panY = 0;
            }
            updateTransform();
        }

        function resetZoom() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        // Dedicated Touch Pinch & Pan Engine
        function setupTouchGestures() {
            let startX = 0, startY = 0;

            function getDistance(t1, t2) {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            flipbookWrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    // Two fingers: Pinch detection
                    startDist = getDistance(e.touches[0], e.touches[1]);
                    startScale = scale;
                } else if (e.touches.length === 1 && scale > 1) {
                    // One finger pan when zoomed
                    isPanning = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                }
            }, { passive: false });

            flipbookWrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const newDist = getDistance(e.touches[0], e.touches[1]);
                    const factor = newDist / startDist;
                    scale = Math.min(Math.max(startScale * factor, 1), 3.5);
                    if (scale === 1) {
                        panX = 0;
                        panY = 0;
                    }
                    updateTransform();
                } else if (e.touches.length === 1 && isPanning && scale > 1) {
                    e.preventDefault();
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    updateTransform();
                }
            }, { passive: false });

            flipbookWrapper.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) startDist = 0;
                if (e.touches.length === 0) isPanning = false;
            });
        }
    </script>
</body>
</html>
