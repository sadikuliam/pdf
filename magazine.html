<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ম্যাগাজিন ভিউয়ার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- সরাসরি PDF লিংক দিয়ে লোড -->
    <iframe src="https://archive.org/download/magazine_202610/magazine.pdf" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allowfullscreen>
    </iframe>

</body>
</html>
