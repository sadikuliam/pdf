<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অফলাইন PDF ফ্লিপবুক রিডার</title>
    
    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* আপলোড বক্স ডিজাইন */
        #upload-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 10;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .file-input-label {
            display: inline-block;
            padding: 14px 28px;
            background-color: #007bff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .file-input-label:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }

        /* ফ্লিপবুক ফুলস্ক্রিন কন্টেইনার */
        #flipbook-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: #1a1a1a;
            z-index: 20;
        }
        #flipbook-container {
            width: 100%;
            height: 100%;
        }
        
        /* অন্য ফাইল দেখার বাটন */
        #close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            padding: 8px 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 999;
        }
        #close-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- ফাইল সিলেক্ট বক্স -->
    <div id="upload-container">
        <h2>আপনার ম্যাগাজিন বা বই সিলেক্ট করুন</h2>
        <label for="pdf-input" class="file-input-label">কম্পিউটার থেকে PDF বাছুন</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <p style="margin-top: 15px; color: #777; font-size: 13px;">যেকোনো সাইজের (১০০ MB+ হলেও) PDF পড়তে পারবেন</p>
    </div>

    <!-- ফুলস্ক্রিন ফ্লিপবুক এরিয়া -->
    <div id="flipbook-wrapper">
        <button id="close-btn" onclick="closeBook()">নতুন বই খুলুন</button>
        <div id="flipbook-container"></div>
    </div>

    <!-- স্ক্রিপ্ট ফাইল -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

    <script>
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/dflip/";
        var currentFlipbook = null;

        document.getElementById('pdf-input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                alert('অনুগ্রহ করে একটি সঠিক PDF ফাইল সিলেক্ট করুন।');
                return;
            }

            // লোকাল ফাইল থেকে সরাসরি ব্রাউজারে Blob URL তৈরি
            var fileUrl = URL.createObjectURL(file);

            // ভিউয়ার দৃশ্যমান করা
            document.getElementById('upload-container').style.display = 'none';
            document.getElementById('flipbook-wrapper').style.display = 'block';

            // dFlip অপশন
            var options = {
                source: fileUrl,
                pdfRenderQuality: 2,
                backgroundColor: "#2c3e50",
                hard: "cover",
                webgl: true
            };

            // ফ্লিপবুক লোড করা
            currentFlipbook = $("#flipbook-container").dFlip(options);
        });

        // অন্য ফাইল খোলার জন্য রিসেট ফাংশন
        function closeBook() {
            if (currentFlipbook && currentFlipbook.destroy) {
                currentFlipbook.destroy();
            }
            document.getElementById('flipbook-container').innerHTML = '';
            document.getElementById('pdf-input').value = '';
            document.getElementById('flipbook-wrapper').style.display = 'none';
            document.getElementById('upload-container').style.display = 'block';
        }
    </script>
</body>
</html>
