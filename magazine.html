<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">

<title>Digital Magazine | SHM</title>

<style>
:root {
    --bg: #101827;
    --panel: #192438;
    --accent: #38bdf8;
    --text: #f8fafc;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at top, #243b59 0%, #101827 65%);
}

header {
    text-align: center;
    padding: 24px 12px 12px;
}

header h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    letter-spacing: 1px;
}

header p {
    color: #b8c8dc;
    margin: 10px 0;
    font-size: 14px;
}

.toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px;
}

button, a.action {
    border: 1px solid #ffffff20;
    border-radius: 10px;
    background: #24344b;
    color: white;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    transition: .2s;
}

button:hover, a.action:hover {
    background: #087da8;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}

.primary {
    background: #0284c7;
}

#viewer {
    width: 100%;
    min-height: 440px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#book {
    margin: auto;
}

#book .page {
    background: white;
    overflow: hidden;
}

#book .page canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#status {
    text-align: center;
    padding: 20px;
    color: #cbd5e1;
    line-height: 1.7;
}

#error {
    display: none;
    max-width: 600px;
    margin: 10px auto;
    padding: 16px;
    color: #fecaca;
    background: #7f1d1d55;
    border-radius: 10px;
    text-align: center;
}

footer {
    text-align: center;
    padding: 22px 10px;
    color: #94a3b8;
    font-size: 12px;
}

@media (max-width: 600px) {
    header {
        padding-top: 18px;
    }

    .toolbar {
        gap: 7px;
    }

    button, a.action {
        padding: 10px 12px;
        font-size: 12px;
    }

    #viewer {
        min-height: 320px;
        padding: 4px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 Digital Magazine</h1>
    <p>Enjoy your magazine with a realistic page-turning experience</p>
</header>

<div class="toolbar">
    <button id="prevBtn" disabled>❮ Previous</button>
    <span id="pageInfo">Loading PDF...</span>
    <button id="nextBtn" disabled>Next ❯</button>
</div>

<div class="toolbar">
    <button id="firstBtn" disabled>⏮ First Page</button>
    <button id="lastBtn" disabled>Last Page ⏭</button>
    <button id="fullBtn">⛶ Fullscreen</button>
    <a class="action primary"
       id="downloadBtn"
       href="https://github.com/sadikuliam/pdf/releases/download/v1.0/magazine.pdf"
       target="_blank"
       rel="noopener">
       ⬇ Download PDF
    </a>
</div>

<div id="status">Please wait while your magazine loads...</div>
<div id="error"></div>

<main id="viewer">
    <div id="book"></div>
</main>

<footer>
    Digital Magazine • Powered by SHM Digital Technology
</footer>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
(() => {
    "use strict";

    const PDF_URL =
        "https://github.com/sadikuliam/pdf/releases/download/v1.0/magazine.pdf";

    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const bookElement = document.getElementById("book");
    const viewer = document.getElementById("viewer");
    const pageInfo = document.getElementById("pageInfo");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const firstBtn = document.getElementById("firstBtn");
    const lastBtn = document.getElementById("lastBtn");
    const fullBtn = document.getElementById("fullBtn");

    let pageFlip = null;
    let pdfDocument = null;
    let isLoading = false;

    // Configure PDF.js worker.
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    function showError(message) {
        status.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = message;
    }

    function updateControls(currentIndex) {
        if (!pageFlip) return;

        const total = pageFlip.getPageCount();
        const current = currentIndex + 1;

        pageInfo.textContent =
            `Page ${current} of ${total}`;

        prevBtn.disabled = currentIndex <= 0;
        firstBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= total - 1;
        lastBtn.disabled = currentIndex >= total - 1;
    }

    async function renderPDF() {
        if (isLoading) return;
        isLoading = true;

        try {
            if (!window.pdfjsLib) {
                throw new Error("PDF.js failed to load. Please refresh the page.");
            }

            if (!window.St || !window.St.PageFlip) {
                throw new Error("The page-flip library failed to load. Please refresh.");
            }

            const loadingTask = pdfjsLib.getDocument({
                url: PDF_URL,
                withCredentials: false
            });

            pdfDocument = await loadingTask.promise;

            if (!pdfDocument.numPages) {
                throw new Error("The PDF contains no pages.");
            }

            status.textContent =
                `Preparing ${pdfDocument.numPages} pages...`;

            const pageElements = [];
            let pageWidth = 500;
            let pageHeight = 700;

            // Render every PDF page into a canvas.
            for (let i = 1; i <= pdfDocument.numPages; i++) {
                status.textContent =
                    `Rendering page ${i} of ${pdfDocument.numPages}...`;

                const pdfPage = await pdfDocument.getPage(i);
                const originalViewport = pdfPage.getViewport({ scale: 1 });

                if (i === 1) {
                    pageWidth = originalViewport.width;
                    pageHeight = originalViewport.height;
                }

                const page = document.createElement("div");
                page.className = "page";

                if (i === 1 || i === pdfDocument.numPages) {
                    page.dataset.density = "hard";
                }

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d", {
                    alpha: false
                });

                // Limit render resolution to avoid excessive memory usage.
                const maxDimension = 1800;
                const renderScale = Math.min(
                    1.5,
                    maxDimension / Math.max(
                        originalViewport.width,
                        originalViewport.height
                    )
                );

                const viewport = pdfPage.getViewport({
                    scale: renderScale
                });

                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);

                await pdfPage.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                page.appendChild(canvas);
                pageElements.push(page);
            }

            // Initialize the 3D flipbook.
            pageFlip = new St.PageFlip(bookElement, {
                width: pageWidth,
                height: pageHeight,
                size: "stretch",
                minWidth: 280,
                maxWidth: 1000,
                minHeight: 350,
                maxHeight: 1400,
                autoSize: true,
                showCover: true,
                usePortrait: true,
                drawShadow: true,
                maxShadowOpacity: 0.45,
                flippingTime: 800,
                mobileScrollSupport: true,
                useMouseEvents: true,
                startPage: 0
            });

            pageFlip.loadFromHTML(pageElements);

            pageFlip.on("flip", event => {
                updateControls(Number(event.data));
            });

            pageFlip.on("init", event => {
                updateControls(Number(event.data) || 0);
            });

            status.style.display = "none";
            updateControls(0);

            prevBtn.disabled = true;
            firstBtn.disabled = true;
            nextBtn.disabled = pdfDocument.numPages <= 1;
            lastBtn.disabled = pdfDocument.numPages <= 1;

        } catch (error) {
            console.error("Flipbook error:", error);

            showError(
                "Unable to load the magazine. Please check your internet connection " +
                "and confirm that the PDF link is publicly accessible. " +
                "If the error persists, open the PDF directly using the Download PDF button."
            );
        } finally {
            isLoading = false;
        }
    }

    prevBtn.addEventListener("click", () => {
        if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener("click", () => {
        if (pageFlip) pageFlip.flipNext();
    });

    firstBtn.addEventListener("click", () => {
        if (pageFlip) pageFlip.flip(0);
    });

    lastBtn.addEventListener("click", () => {
        if (pageFlip) {
            pageFlip.flip(pageFlip.getPageCount() - 1);
        }
    });

    fullBtn.addEventListener("click", async () => {
        try {
            if (!document.fullscreenElement) {
                await viewer.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.error("Fullscreen error:", error);
        }
    });

    document.addEventListener("fullscreenchange", () => {
        fullBtn.textContent = document.fullscreenElement
            ? "✕ Exit Fullscreen"
            : "⛶ Fullscreen";
    });

    // Keyboard navigation.
    document.addEventListener("keydown", event => {
        if (!pageFlip || event.target.matches("input, textarea")) return;

        if (event.key === "ArrowRight") pageFlip.flipNext();
        if (event.key === "ArrowLeft") pageFlip.flipPrev();
    });

    renderPDF();
})();
</script>

</body>
</html>
