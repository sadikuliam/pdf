<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>টাচ ও জুম সুবিধাসহ অফলাইন ফ্লিপবুক</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            user-select: none;
        }

        /* আপলোড সেকশন */
        #upload-section {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 90%;
            width: 400px;
        }
        .upload-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #007bff;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-btn:hover {
            background: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            font-weight: bold;
        }

        /* রিডার স্ক্রিন */
        #reader-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        /* জুম কন্টেইনার */
        #panzoom-viewport {
            width: 100%;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #flipbook {
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            touch-action: pan-y;
        }
        .page {
            background-color: #ffffff;
            overflow: hidden;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* নিচের কন্ট্রোল বার */
        .controls {
            position: absolute;
            bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 1000;
        }
        .controls button {
            background: #2e2e2e;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .controls button:hover, .controls button:active {
            background: #007bff;
            border-color: #007bff;
        }
        #page-info {
            font-size: 13px;
            color: #ddd;
            margin: 0 6px;
        }

        /* ক্লোজ বাটন */
        #close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="upload-section">
        <h2>অফলাইন টাচ ফ্লিপবুক</h2>
        <p style="margin-top: 6px; color: #666; font-size: 13px;">যেকোনো বড় সাইজের PDF (টাচ ও পিঞ্চ জুম সমর্থিত)</p>
        <label for="pdf-file" class="upload-btn">PDF ফাইল বাছুন</label>
        <input type="file" id="pdf-file" accept="application/pdf">
        <div id="status"></div>
    </div>

    <div id="reader-wrapper">
        <button id="close-btn" onclick="location.reload()">বন্ধ করুন</button>
        
        <div id="panzoom-viewport">
            <div id="flipbook"></div>
        </div>

        <div class="controls">
            <button onclick="prevPage()">◀ আগের পাতা</button>
            <span id="page-info">পৃষ্ঠা: ১</span>
            <button onclick="nextPage()">পরের পাতা ▶</button>
            <button onclick="zoomIn()">🔍+</button>
            <button onclick="zoomOut()">🔍-</button>
            <button onclick="resetZoom()">রিসেট</button>
        </div>
    </div>

    <!-- স্ক্রিপ্ট লাইব্রেরিসমূহ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

        let panzoomInstance = null;
        let totalPages = 0;
        let isZoomed = false;

        document.getElementById('pdf-file').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.innerText = "ফাইল লোড হচ্ছে, কিছুক্ষণ অপেক্ষা করুন...";

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    totalPages = pdf.numPages;
                    status.innerText = `মোট ${totalPages} পৃষ্ঠা প্রস্তুত হচ্ছে...`;

                    document.getElementById('upload-section').style.display = 'none';
                    document.getElementById('reader-wrapper').style.display = 'flex';

                    // ডিভাইস ও সাইজ অনুযায়ী ডাইমেনশন নির্ধারণ
                    const isMobile = window.innerWidth <= 768;
                    const firstPage = await pdf.getPage(1);
                    const viewport = firstPage.getViewport({ scale: 1 });
                    const ratio = viewport.width / viewport.height;

                    const bookHeight = Math.min(window.innerHeight * 0.78, 650);
                    const bookWidth = isMobile ? (bookHeight * ratio) : (bookHeight * ratio * 2);

                    const flipbook = $('#flipbook');
                    flipbook.empty();

                    // পেজ ও ক্যানভাস তৈরি
                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        const pageDiv = $('<div />', { class: 'page' });
                        const canvas = document.createElement('canvas');
                        pageDiv.append(canvas);
                        flipbook.append(pageDiv);

                        pdf.getPage(pageNum).then(function(page) {
                            const scale = 2; // হাই-রেজোলিউশন রেন্ডারিং
                            const pageViewport = page.getViewport({ scale: scale });
                            const context = canvas.getContext('2d');
                            canvas.height = pageViewport.height;
                            canvas.width = pageViewport.width;

                            page.render({
                                canvasContext: context,
                                viewport: pageViewport
                            });
                        });
                    }

                    // Turn.js সেটআপ
                    flipbook.turn({
                        width: bookWidth,
                        height: bookHeight,
                        autoCenter: true,
                        display: isMobile ? 'single' : 'double',
                        acceleration: true,
                        elevation: 50,
                        gradients: true,
                        when: {
                            turned: function(e, page) {
                                document.getElementById('page-info').innerText = `পৃষ্ঠা: ${page} / ${totalPages}`;
                            }
                        }
                    });

                    // পিঞ্চ-টু-জুম ও টাচ প্যান সেটআপ
                    const viewportElem = document.getElementById('panzoom-viewport');
                    panzoomInstance = Panzoom(document.getElementById('flipbook'), {
                        maxScale: 4,
                        minScale: 1,
                        contain: 'outside',
                        disablePan: true // ডিফল্ট অবস্থায় পেজ সোয়াইপের জন্য প্যান বন্ধ থাকবে
                    });

                    // মাউস হুইল দিয়ে জুম
                    viewportElem.addEventListener('wheel', panzoomInstance.zoomWithWheel);

                    // জুম অবস্থায় সোয়াইপ এবং সাধারণ অবস্থায় পাতা উল্টানোর লজিক
                    panzoomInstance.on('zoom', (e) => {
                        const currentScale = e.detail.scale;
                        if (currentScale > 1.05) {
                            isZoomed = true;
                            panzoomInstance.setOptions({ disablePan: false });
                            flipbook.turn('disable', true); // জুম থাকা অবস্থায় পেজ ফ্লিপ লক
                        } else {
                            isZoomed = false;
                            panzoomInstance.setOptions({ disablePan: true });
                            flipbook.turn('disable', false); // সাধারণ অবস্থায় পেজ ফ্লিপ অন
                        }
                    });

                } catch (err) {
                    alert('PDF রেন্ডার করতে সমস্যা হয়েছে: ' + err.message);
                    location.reload();
                }
            };

            fileReader.readAsArrayBuffer(file);
        });

        // নেভিগেশন কন্ট্রোল
        function nextPage() {
            if (!isZoomed) $('#flipbook').turn('next');
        }

        function prevPage() {
            if (!isZoomed) $('#flipbook').turn('previous');
        }

        // জুম ফাংশনসমূহ
        function zoomIn() {
            if (panzoomInstance) panzoomInstance.zoomIn();
        }

        function zoomOut() {
            if (panzoomInstance) panzoomInstance.zoomOut();
        }

        function resetZoom() {
            if (panzoomInstance) {
                panzoomInstance.reset();
                isZoomed = false;
                panzoomInstance.setOptions({ disablePan: true });
                $('#flipbook').turn('disable', false);
            }
        }
    </script>
</body>
</html>
