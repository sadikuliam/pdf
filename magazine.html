<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM কিশোর দিগন্ত - Flipbook</title>
    
    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        /* বাটনের ডিজাইন */
        .read-btn {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Lightbox Theme */
        .df-lightbox-wrapper, .df-container { background-color: #f4f4f4 !important; }
    </style>
</head>
<body>

    <!-- লক্ষ্য করুন: এখানে _df_button ক্লাসটি পুরোপুরি মুছে দেওয়া হয়েছে। শুধু একটি ID রাখা হয়েছে। -->
    <div class="read-btn" id="shm_magazine_btn">ম্যাগাজিন পড়ুন</div>

    <!-- jQuery এবং dFlip JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
    
    <script>
        jQuery(document).ready(function () {
            
            // ১. আপনার ম্যাগাজিনের ছবিগুলো
            var magImages = [
                "magazine/1.png", 
                "magazine/2.png", 
                "magazine/3.png"
            ];

            // ২. সেটিংস (WebGL এবং 3D জোর করে বন্ধ করা হয়েছে)
            var options = {
                lightBox: true,       // পপ-আপ আকারে খুলবে
                webgl: false,         // WebGL বন্ধ
                is3D: false,          // 3D ইঞ্জিন পুরোপুরি বন্ধ (যাতে Loading WEBGL 3D না দেখায়)
                backgroundColor: "#f4f4f4",
                pageMode: 1
            };

            // ৩. বাটনের সাথে ফ্লিপবুক কানেক্ট করা
            $("#shm_magazine_btn").flipBook(magImages, options);
            
        });
    </script>
    
</body>
</html>
