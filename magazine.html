<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>3D Touch Flipbook</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* আপলোড উইন্ডো */
        #upload-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #222;
            padding: 35px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }
        .upload-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 28px;
            background: #007bff;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        input[type="file"] {
            display: none;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #007bff;
            font-weight: bold;
        }

        /* ফ্লিপবুক মূল ভিউয়ার */
        #flipbook-wrapper {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #111;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #zoom-wrapper {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-flip-container {
            display: block;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
        }
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* কন্ট্রোল বার */
        .controls {
            position: fixed;
            bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 30, 30, 0.9);
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .controls button:active {
            background: #007bff;
        }
        #page-info {
            font-size: 13px;
            color: #eee;
            margin: 0 5px;
        }

        #close-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 500;
        }
    </style>
</head>
<body>

    <div id="upload-box">
        <h2 style="font-size: 20px;">অফলাইন টাচ ফ্লিপবুক</h2>
        <p style="margin-top: 8px; color: #666; font-size: 13px;">মোবাইল ও ট্যাবলেটে সরাসরি টাচ ফ্লিপ</p>
        <label for="pdf-input" class="upload-btn">PDF ফাইল বাছুন</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <div id="status"></div>
    </div>

    <div id="flipbook-wrapper">
        <button id="close-btn" onclick="location.reload()">বন্ধ করুন</button>
        
        <div id="zoom-wrapper">
            <div id="book" class="page-flip-container"></div>
        </div>

        <div class="controls">
            <button onclick="flipPrev()">◀ পাতা</button>
            <span id="page-info">১ / ১</span>
            <button onclick="flipNext()">পাতা ▶</button>
            <button onclick="zoomIn()">🔍+</button>
            <button onclick="zoomOut()">🔍-</button>
            <button onclick="resetZoom()">রিসেট</button>
        </div>
    </div>

    <!-- PDF.js এবং StPageFlip (আধুনিক 3D টাচ ইঞ্জিন) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

        let pageFlip = null;
        let pdfDoc = null;
        let currentZoom = 1;

        document.getElementById('pdf-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.innerText = "ফাইলটি প্রস্তুত করা হচ্ছে...";

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                    const totalPages = pdfDoc.numPages;

                    document.getElementById('upload-box').style.display = 'none';
                    document.getElementById('flipbook-wrapper').style.display = 'flex';

                    // স্ক্রিনের সাইজ অনুযায়ী পাতার মাপ নির্ধারণ
                    const isMobile = window.innerWidth <= 768;
                    const bookWidth = isMobile ? Math.min(window.innerWidth * 0.92, 450) : 480;
                    const bookHeight = isMobile ? Math.min(window.innerHeight * 0.8, 650) : 680;

                    const bookElem = document.getElementById('book');
                    bookElem.innerHTML = '';

                    // প্রতিটি পাতার জন্য কনটেইনার তৈরি
                    for (let i = 1; i <= totalPages; i++) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page';
                        const canvas = document.createElement('canvas');
                        pageDiv.appendChild(canvas);
                        bookElem.appendChild(pageDiv);
                    }

                    // 3D টাচ ফ্লিপবুক ইঞ্জিন সক্রিয় করা
                    pageFlip = new St.PageFlip(bookElem, {
                        width: bookWidth,
                        height: bookHeight,
                        size: "fixed",
                        minWidth: 300,
                        maxWidth: 1000,
                        minHeight: 400,
                        maxHeight: 1200,
                        maxShadowOpacity: 0.5,
                        showCover: true,
                        mobileScrollSupport: false,
                        usePortrait: isMobile // মোবাইলে অটো সিঙ্গেল পেজ ফ্লিপ
                    });

                    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                    // পেজ পরিবর্তনের সাথে পেজ কাউন্টার আপডেট
                    pageFlip.on('flip', (e) => {
                        document.getElementById('page-info').innerText = `${e.data + 1} / ${totalPages}`;
                        renderNearbyPages(e.data + 1, totalPages);
                    });

                    // প্রথম পেজগুলো রেন্ডার করা
                    renderNearbyPages(1, totalPages);
                    document.getElementById('page-info').innerText = `১ / ${totalPages}`;

                } catch (err) {
                    alert("সমস্যা হয়েছে: " + err.message);
                    location.reload();
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        // ডায়নামিক মেমোরি-ফ্রেন্ডলি রেন্ডারিং
        const rendered = new Set();
        async function renderNearbyPages(current, total) {
            const pagesToRender = [current, current + 1, current + 2, current - 1].filter(p => p >= 1 && p <= total);
            for (let p of pagesToRender) {
                if (rendered.has(p)) continue;
                rendered.add(p);

                const page = await pdfDoc.getPage(p);
                const viewport = page.getViewport({ scale: 1.8 });
                const pageElems = document.querySelectorAll('.page');
                const canvas = pageElems[p - 1].querySelector('canvas');
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');

                page.render({
                    canvasContext: ctx,
                    viewport: viewport
                });
            }
        }

        // নেভিগেশন ফাংশন
        function flipNext() {
            if (pageFlip) pageFlip.flipNext();
        }

        function flipPrev() {
            if (pageFlip) pageFlip.flipPrev();
        }

        // জুম কন্ট্রোল
        function zoomIn() {
            if (currentZoom < 2.5) {
                currentZoom += 0.25;
                applyZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 0.8) {
                currentZoom -= 0.25;
                applyZoom();
            }
        }

        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById('zoom-wrapper').style.transform = `scale(${currentZoom})`;
        }
    </script>
</body>
</html>
