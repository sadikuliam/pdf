<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline PDF Flipbook Reader</title>
    
    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #upload-container {
            background: #ffffff;
            padding: 35px 45px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            text-align: center;
            z-index: 10;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .file-input-label {
            display: inline-block;
            padding: 14px 28px;
            background-color: #007bff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .file-input-label:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }

        #flipbook-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-color: #222222;
            z-index: 20;
        }
        #flipbook-container {
            width: 100%;
            height: 100%;
        }
        
        #close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            padding: 9px 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 99999;
        }
        #close-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="upload-container">
        <h2>Apnar PDF Magazine Select Korun</h2>
        <label for="pdf-input" class="file-input-label">Computer theke PDF Bachun</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <p style="margin-top: 15px; color: #666; font-size: 13px;">(25 MB ba tar besi boro file-o shorashori cholbe)</p>
    </div>

    <div id="flipbook-wrapper">
        <button id="close-btn" onclick="closeBook()">Notun Boi Khulun</button>
        <div id="flipbook-container"></div>
    </div>

    <!-- Required Dependancy Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

    <script>
        // PDF worker path setting
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
        
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/dflip/";
        var currentBookInstance = null;

        document.getElementById('pdf-input').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            // Browser internal blob URL create
            var blobUrl = URL.createObjectURL(file);

            document.getElementById('upload-container').style.display = 'none';
            document.getElementById('flipbook-wrapper').style.display = 'block';

            var bookOptions = {
                source: blobUrl,
                pdfRenderQuality: 2,
                backgroundColor: "#222222",
                hard: "cover",
                webgl: false, // Compatibility ensure korar jonno
                pageMode: 1
            };

            // Init dFlip
            currentBookInstance = $("#flipbook-container").dFlip(bookOptions);
        });

        function closeBook() {
            if (currentBookInstance && currentBookInstance.destroy) {
                currentBookInstance.destroy();
            }
            document.getElementById('flipbook-container').innerHTML = '';
            document.getElementById('pdf-input').value = '';
            document.getElementById('flipbook-wrapper').style.display = 'none';
            document.getElementById('upload-container').style.display = 'block';
        }
    </script>
</body>
</html>
