<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Digital Magazine | SHM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at top,#243b59,#101827 75%);
 color:#f8fafc;font-family:Arial,sans-serif;min-height:100vh
}
header{text-align:center;padding:22px 10px 8px}

}

 #viewer{min-height:330px;padding:4px}

</head>
<body>

<header>
 <h1>📖 Digital Magazine</h1>
 <p>Enjoy a realistic page-turning experience</p>
</header>

<div class="toolbar">
 <button id="prev" disabled>❮ Previous</button>
 <span id="counter">Loading...</span>
 <button id="next" disabled>Next ❯</button>
</div>

<div class="toolbar">
 <button id="first" disabled>⏮ First</button>
 <button id="last" disabled>Last ⏭</button>
 <button id="fullscreen">⛶ Fullscreen</button>
 <a class="action primary" id="download" download="magazine.pdf">
  ⬇ Download PDF
 </a>
</div>

<div id="status">Loading magazine...</div>
<div id="error"></div>

<main id="viewer">
 <div id="book"></div>
</main>

<footer>SHM Digital Technology • Digital Magazine</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
"use strict";

/*
 IMPORTANT:
 Replace this path only if your PDF is stored elsewhere
 on the SAME GitHub Pages website.
*/
const PDF_URL = "./pdf/magazine.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const status = $("status");
const errorBox = $("error");
const bookElement = $("book");
const viewer = $("viewer");

let pdf = null;
let flip = null;
let rendering = new Map();
let rendered = new Set();
let pageElements = [];
let pageWidth = 420;
let pageHeight = 594;
let totalPages = 0;

function showError(message){
 status.style.display = "none";
 errorBox.style.display = "block";
 errorBox.textContent = message;
}

function updateControls(index){
 if(!flip) return;

 const total = flip.getPageCount();
 index = Math.max(0, Math.min(index, total - 1));

 $("counter").textContent =
  `Page ${index + 1} of ${total}`;

 $("prev").disabled = index === 0;
 $("first").disabled = index === 0;
 $("next").disabled = index >= total - 1;
 $("last").disabled = index >= total - 1;
}

/*
 Render only the requested page.
 The canvas is released when the page is far away
 from the currently visible pages.
*/
async function renderPage(index){
 if(index < 0 || index >= totalPages) return;
 if(rendered.has(index)) return;
 if(rendering.has(index)) return rendering.get(index);

 const task = (async()=>{
  const page = await pdf.getPage(index + 1);

  // Limit canvas dimensions to control memory usage.
  const original = page.getViewport({scale:1});
  const maxPixelsSide = 1500;
  const scale = Math.min(
   1.5,
   maxPixelsSide / Math.max(original.width, original.height)
  );
  const viewport = page.getViewport({scale});

  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);

  const context = canvas.getContext("2d", {alpha:false});

  await page.render({
   canvasContext:context,
   viewport
  }).promise;

  const holder = pageElements[index];

  holder.replaceChildren(canvas);
  rendered.add(index);

  page.cleanup();
 })();

 rendering.set(index, task);

 try{
  await task;
 }finally{
  rendering.delete(index);
 }
}

/*
 Keep nearby pages ready for animation.
 Pages outside this window release their canvases.
*/
async function prepareNearby(index){
 const start = Math.max(0, index - 2);
 const end = Math.min(totalPages - 1, index + 3);

 const jobs = [];

 for(let i = start; i <= end; i++){
  jobs.push(renderPage(i));
 }

 await Promise.allSettled(jobs);

 for(let i = 0; i < totalPages; i++){
  if(i >= start && i <= end) continue;
  if(rendering.has(i)) continue;
  if(!rendered.has(i)) continue;

  const holder = pageElements[i];
  const canvas = holder.querySelector("canvas");

  if(canvas){
   canvas.width = 0;
   canvas.height = 0;
   canvas.remove();
  }

  holder.replaceChildren();

  const placeholder = document.createElement("span");
  placeholder.className = "placeholder";
  placeholder.textContent = `Page ${i + 1}`;
  holder.appendChild(placeholder);

  rendered.delete(i);
 }
}

async function init(){
 try{
  if(!window.pdfjsLib) throw new Error("PDF.js library did not load.");
  if(!window.St || !window.St.PageFlip)
   throw new Error("PageFlip library did not load.");

  const response = await fetch(PDF_URL);

  if(!response.ok){
   throw new Error(
    `PDF request failed: HTTP ${response.status}. Check the PDF URL.`
   );
  }

  // PDF is hosted on the same website, so CORS should not be needed.
  const data = await response.arrayBuffer();

  pdf = await pdfjsLib.getDocument({
   data: new Uint8Array(data)
  }).promise;

  totalPages = pdf.numPages;

  if(!totalPages) throw new Error("The PDF has no pages.");

  const firstPage = await pdf.getPage(1);
  const vp = firstPage.getViewport({scale:1});

  pageWidth = vp.width;
  pageHeight = vp.height;

  firstPage.cleanup();

  status.textContent = `Preparing ${totalPages} pages...`;

  // Create lightweight placeholders for every page.
  for(let i = 0; i < totalPages; i++){
   const element = document.createElement("div");
   element.className = "page";

   const placeholder = document.createElement("span");
   placeholder.className = "placeholder";
   placeholder.textContent = `Page ${i + 1}`;

   element.appendChild(placeholder);
   pageElements.push(element);
  }

  flip = new St.PageFlip(bookElement,{
   width:pageWidth,
   height:pageHeight,
   size:"stretch",
   minWidth:280,
   maxWidth:900,
   minHeight:350,
   maxHeight:1200,
   autoSize:true,
   showCover:true,
   usePortrait:true,
   drawShadow:true,
   maxShadowOpacity:0.4,
   flippingTime:700,
   mobileScrollSupport:true
  });

  flip.loadFromHTML(pageElements);

  $("download").href = PDF_URL;

  flip.on("flip", event=>{
   const index = Number(event.data);
   updateControls(index);
   prepareNearby(index);
  });

  flip.on("init", event=>{
   const index = Number(event.data) || 0;
   updateControls(index);
   prepareNearby(index);
  });

  status.style.display = "none";
  updateControls(0);
  await prepareNearby(0);

 }catch(err){
  console.error("Flipbook error:",err);
  showError(
   "Unable to load the PDF. " + err.message +
   " Check that the PDF exists at " + PDF_URL +
   " and is published on the same GitHub Pages website."
  );
 }
}

$("prev").onclick = ()=>flip && flip.flipPrev();
$("next").onclick = ()=>flip && flip.flipNext();
$("first").onclick = ()=>flip && flip.flip(0);
$("last").onclick = ()=>flip && flip.flip(totalPages - 1);

$("fullscreen").onclick = async()=>{
 try{
  if(!document.fullscreenElement){
   await viewer.requestFullscreen();
  }else{
   await document.exitFullscreen();
  }
 }catch(err){
  console.error("Fullscreen error:",err);
 }
};

document.addEventListener("fullscreenchange",()=>{
 $("fullscreen").textContent = document.fullscreenElement
  ? "✕ Exit Fullscreen"
  : "⛶ Fullscreen";
});

document.addEventListener("keydown",event=>{
 if(!flip || /INPUT|TEXTAREA/.test(event.target.tagName)) return;
 if(event.key === "ArrowRight") flip.flipNext();
 if(event.key === "ArrowLeft") flip.flipPrev();
});

init();
</script>
</body>
</html>
