<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SHM কিশোর দিগন্ত - Interactive Digital Flipbook">

    <title>SHM কিশোর দিগন্ত - Flipbook</title>


    <!-- =========================================
         dFlip / DearFlip CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css"
    >


    <!-- =========================================
         CUSTOM STYLE
    ========================================== -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: #f4f4f4;
            overflow: hidden;
        }


        /* =========================================
           Full Screen Flipbook
        ========================================== */

        #shm_flipbook {

            width: 100%;
            height: 100vh;

            min-width: 100%;
            min-height: 100vh;

            background: #f4f4f4;
        }


        /* =========================================
           Mobile Adjustment
        ========================================== */

        @media (max-width: 768px) {

            #shm_flipbook {
                width: 100%;
                height: 100vh;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         SHM FLIPBOOK CONTAINER
    ========================================== -->

    <div id="shm_flipbook"></div>


    <!-- =========================================
         jQuery
    ========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js">
    </script>


    <!-- =========================================
         dFlip / DearFlip JavaScript
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js">
    </script>


    <!-- =========================================
         FLIPBOOK SCRIPT
    ========================================== -->

    <script>

        jQuery(document).ready(function ($) {


            /* =====================================
               MAGAZINE PAGE LIST
            ===================================== */

            var magImages = [

                "magazine/page1.png",

                "magazine/page2.png",

                "magazine/page3.png"

            ];


            /* =====================================
               FLIPBOOK OPTIONS
            ===================================== */

            var options = {

                /* Disable WebGL
                   for better compatibility */
                webgl: false,


                /* Background */
                backgroundColor: "#f4f4f4",


                /* Page flip speed */
                duration: 800,


                /* Responsive height */
                autoHeight: true

            };


            /* =====================================
               CREATE FLIPBOOK
            ===================================== */

            $("#shm_flipbook").flipBook(

                magImages,

                options

            );


        });

    </script>


</body>

</html>
