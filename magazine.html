<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Flipbook</title>
    
    <!-- Swiper CSS (Ultra stable touch 3D slider) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        #upload-box {
            background: #fff;
            color: #333;
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .btn-upload {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #007bff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="file"] {
            display: none;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #007bff;
        }

        /* Swiper Container */
        #reader-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #181818;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .swiper {
            width: 90vw;
            height: 85vh;
            max-width: 650px;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .swiper-slide canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Bottom bar */
        .toolbar {
            position: absolute;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border-radius: 30px;
            z-index: 10;
        }

        .nav-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: #0056b3;
        }

        #close-top {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="upload-box">
        <h2>Offline Magazine Reader</h2>
        <p style="margin-top: 8px; color: #666;">Boro size PDF touch flipbook</p>
        <label for="pdf-input" class="btn-upload">PDF File Bachun</label>
        <input type="file" id="pdf-input" accept="application/pdf">
        <div id="status"></div>
    </div>

    <div id="reader-container">
        <button id="close-top" onclick="location.reload()">Bondho Korun</button>

        <div class="swiper">
            <div class="swiper-wrapper" id="swiper-slides"></div>
        </div>

        <div class="toolbar">
            <button class="nav-btn" id="prev-btn">◀ Pata</button>
            <span id="page-count">1 / 1</span>
            <button class="nav-btn" id="next-btn">Pata ▶</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

        let swiper = null;
        let pdfDoc = null;
        let renderedPages = new Set();

        document.getElementById('pdf-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.innerText = "File pora hocche...";

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                    const totalPages = pdfDoc.numPages;

                    document.getElementById('upload-box').style.display = 'none';
                    document.getElementById('reader-container').style.display = 'flex';

                    const wrapper = document.getElementById('swiper-slides');
                    wrapper.innerHTML = '';

                    // Shob patar jonno slide toiri
                    for (let i = 1; i <= totalPages; i++) {
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.setAttribute('data-page', i);
                        wrapper.appendChild(slide);
                    }

                    // 3D Flip effect Swiper
                    swiper = new Swiper('.swiper', {
                        effect: 'flip',
                        grabCursor: true,
                        speed: 500,
                        flipEffect: {
                            slideShadows: true,
                            limitRotation: true
                        },
                        navigation: {
                            nextEl: '#next-btn',
                            prevEl: '#prev-btn',
                        },
                        on: {
                            slideChange: function() {
                                const current = swiper.activeIndex + 1;
                                document.getElementById('page-count').innerText = `${current} / ${totalPages}`;
                                renderPage(current);
                                if (current + 1 <= totalPages) renderPage(current + 1);
                                if (current - 1 >= 1) renderPage(current - 1);
                            }
                        }
                    });

                    // Prothom 2 to pata aage render kora
                    renderPage(1);
                    if (totalPages >= 2) renderPage(2);

                    document.getElementById('page-count').innerText = `1 / ${totalPages}`;

                } catch (err) {
                    alert("Error: " + err.message);
                    location.reload();
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        // Dynamic single-page render logic (Memory crash thekate)
        async function renderPage(pageNum) {
            if (renderedPages.has(pageNum)) return;
            renderedPages.add(pageNum);

            const slide = document.querySelector(`.swiper-slide[data-page="${pageNum}"]`);
            if (!slide) return;

            const page = await pdfDoc.getPage(pageNum);
            const scale = 1.8;
            const viewport = page.getViewport({ scale: scale });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');

            slide.appendChild(canvas);

            page.render({
                canvasContext: ctx,
                viewport: viewport
            });
        }
    </script>
</body>
</html>
