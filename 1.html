<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook PDF Compressor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0b1120;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrapper {
      width: 100%;
      max-width: 820px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      padding: 16px;
    }
    .header {
      text-align: center;
      padding: 12px 10px 20px;
    }
    .header h2 {
      margin: 0;
      color: #38bdf8;
      font-size: 24px;
    }
    .header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }
    gradio-app {
      display: block;
      width: 100%;
      min-height: 520px;
      border: none;
    }
  </style>

  <!-- Gradio অফিসিয়াল ওয়েব কম্পোনেন্ট স্ক্রিপ্ট -->
  <script type="module" src="https://gradio.s3-us-west-2.amazonaws.com/4.44.0/gradio.js"></script>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <h2>⚡ Flipbook PDF Compressor</h2>
    <p>বড় বই ও স্ক্যান করা PDF-এর জন্য অপ্টিমাইজড ইঞ্জিন (PyMuPDF)</p>
  </div>

  <!-- সরাসরি Hugging Face Space এম্বেড -->
  <gradio-app src="https://shmwbin-flipbook-pdf-compressor.hf.space" theme_mode="dark"></gradio-app>
</div>

</body>
</html>
