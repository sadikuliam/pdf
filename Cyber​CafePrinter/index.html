<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHM Pro Photo Print Maker | Cyber Cafe Printer</title>

    <meta name="description" content="SHM Pro Photo Print Maker — Passport, Stamp, Job Form and ID Card photos তৈরি করুন।">
    <meta name="robots" content="index, follow">

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CROPPER CSS & JS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- PDF LIB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #111827;
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --border: #374151;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .tool-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 1100px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 2px solid var(--primary);
        }

        .toolbar-title {
            color: #1f2937;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            color: #1f2937;
        }

        .person-panel {
            background-color: #f3f4f6;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .person-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            flex-wrap: wrap;
        }

        .person-label {
            font-weight: 700;
            color: #111827;
            background: #e5e7eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .person-size-select {
            flex-grow: 1;
            min-width: 170px;
        }

        .text-input {
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 100px;
            color: #1f2937;
        }

        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            transition: 0.2s;
            white-space: nowrap;
        }

        .upload-btn:hover {
            background-color: var(--primary-hover);
        }

        .upload-btn-secondary {
            background-color: var(--success);
        }

        .upload-btn-secondary:hover {
            background-color: #059669;
        }

        input[type="file"] {
            display: none;
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        .qty-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 12px;
            color: #374151;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #e5e7eb;
        }

        .qty-input {
            width: 35px;
            text-align: center;
            border: none;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            padding: 6px 0;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }

        .btn-remove:hover {
            background-color: #dc2626;
        }

        .add-person-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            transition: 0.2s;
        }

        .add-person-btn:hover {
            background-color: #059669;
        }

        .workspace {
            padding: 30px;
            display: flex;
            justify-content: center;
            background-color: #374151;
            overflow: auto;
            min-height: 500px;
        }

        .paper-preview-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1 / 1.414;
            position: relative;
            transition: aspect-ratio 0.3s ease;
        }

        canvas#main-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .actions-bar {
            background-color: #1f2937;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-pdf { background-color: #ef4444; }
        .btn-pdf:hover { background-color: #dc2626; }
        .btn-print { background-color: #10b981; }
        .btn-print:hover { background-color: #059669; }

        /* CROP MODAL STYLES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 450px;
            display: flex; flex-direction: column; gap: 15px; color: #1f2937;
        }
        .crop-container {
            width: 100%; height: 300px; background: #e5e7eb; overflow: hidden;
            display: flex; justify-content: center; align-items: center; border-radius: 4px;
        }
        .crop-container img { max-width: 100%; max-height: 100%; }

        @media (max-width: 768px) {
            .person-row { flex-direction: column; align-items: stretch; }
            .btn-remove { margin-left: 0; width: 100%; }
        }
    </style>
</head>

<body>
    <div class="tool-container">
        <div class="toolbar">
            <div class="toolbar-title">
                <i class="fa-solid fa-users-viewfinder"></i> Cyber Cafe Printer 🖨️
            </div>
            <select id="paper-size" onchange="drawLayout()">
                <option value="A4">Paper: A4 Sheet</option>
                <option value="Letter">Paper: US Letter</option>
                <option value="4x6">Paper: 4x6 Inch</option>
            </select>
        </div>

        <div class="person-panel" id="person-panel">
            <div id="persons-container"></div>
            <button class="add-person-btn" onclick="addPersonRow()">
                <i class="fa-solid fa-user-plus"></i> Add Person
            </button>
        </div>

        <div class="workspace">
            <div class="paper-preview-wrapper" id="preview-wrapper">
                <canvas id="main-canvas"></canvas>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-pdf" onclick="downloadPDF()">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </button>
            <button class="action-btn btn-print" onclick="printPage()">
                <i class="fa-solid fa-print"></i> Direct Print
            </button>
        </div>
    </div>

    <!-- CROP MODAL -->
    <div class="modal-overlay" id="crop-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem;">
                <span><i class="fa-solid fa-crop"></i> Adjust & Crop Photo</span>
            </div>
            <div class="crop-container">
                <img id="image-to-crop" src="">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="upload-btn" style="background:#6b7280;" onclick="closeCropModal()">Cancel</button>
                <button class="upload-btn" onclick="applyCrop()"><i class="fa-solid fa-check"></i> Apply & Save</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const paperSelect = document.getElementById('paper-size');
        const previewWrapper = document.getElementById('preview-wrapper');

        let persons = [];
        let cropper = null;
        let activeCropIndex = null;
        let activeCropImgNum = null;

        const MM_TO_PX = 11.811;

        const paperDimensions = {
            'A4': { w: 2480, h: 3508, jsPdfFormat: 'a4' },
            'Letter': { w: 2550, h: 3300, jsPdfFormat: 'letter' },
            '4x6': { w: 1200, h: 1800, jsPdfFormat: [101.6, 152.4] }
        };

        const photoDimensions = {
            'job_form': { w: 32, h: 40, hasDetails: true }, 
            'passport_in': { w: 35, h: 45 },
            'stamp_in': { w: 20, h: 25 },
            'joint_in': { w: 48.3, h: 40.6 },
            'id_card_in': { w: 86, h: 54 } 
        };

        addPersonRow();
        setCanvasSize();

        function addPersonRow() {
            if (persons.length >= 15) {
                alert("Maximum 15 persons allowed at once.");
                return;
            }
            persons.push({
                size: 'job_form',
                qty: 6,
                name: '',
                date: '',
                border: 1, // 1 = Thin by default
                img1: new Image(),
                loaded1: false,
                img2: new Image(),
                loaded2: false
            });
            renderRows();
            drawLayout();
        }

        function removePerson(index) {
            persons.splice(index, 1);
            if (persons.length === 0) addPersonRow();
            else renderRows();
            drawLayout();
        }

        function changePersonSize(index, newSize) {
            persons[index].size = newSize;
            renderRows();
            drawLayout();
        }

        function updatePersonQty(index, change) {
            let current = parseInt(persons[index].qty);
            let newVal = current + change;
            if (newVal >= 1 && newVal <= 50) {
                persons[index].qty = newVal;
                renderRows();
                drawLayout();
            }
        }

        function updatePersonText(index, field, value) {
            persons[index][field] = value;
            drawLayout();
        }

        function handleUpload(event, index, imgNum) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    if (imgNum === 1) {
                        persons[index].img1.src = dataUrl;
                        persons[index].img1.onload = () => {
                            persons[index].loaded1 = true;
                            renderRows();
                            openCropModal(index, 1); 
                        };
                    } else {
                        persons[index].img2.src = dataUrl;
                        persons[index].img2.onload = () => {
                            persons[index].loaded2 = true;
                            renderRows();
                            openCropModal(index, 2); 
                        };
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // CROPPER FUNCTIONS
        function openCropModal(index, imgNum) {
            activeCropIndex = index;
            activeCropImgNum = imgNum;
            const imgToCrop = (imgNum === 1) ? persons[index].img1 : persons[index].img2;

            if (!imgToCrop || !imgToCrop.src) return;

            document.getElementById('crop-modal').style.display = 'flex';
            const cropImg = document.getElementById('image-to-crop');
            cropImg.src = imgToCrop.src;

            if (cropper) cropper.destroy();

            const dim = photoDimensions[persons[index].size];
            
            cropper = new Cropper(cropImg, {
                aspectRatio: dim.w / dim.h,
                viewMode: 1,
                autoCropArea: 0.9,
                dragMode: 'move'
            });
        }

        function closeCropModal() {
            document.getElementById('crop-modal').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function applyCrop() {
            if (!cropper || activeCropIndex === null) return;
            const dim = photoDimensions[persons[activeCropIndex].size];

            const canvasCropped = cropper.getCroppedCanvas({
                width: dim.w * 15, 
                height: dim.h * 15
            });

            const dataUrl = canvasCropped.toDataURL('image/jpeg', 1.0);

            if (activeCropImgNum === 1) {
                persons[activeCropIndex].img1.src = dataUrl;
                persons[activeCropIndex].img1.onload = () => { drawLayout(); renderRows(); };
            } else {
                persons[activeCropIndex].img2.src = dataUrl;
                persons[activeCropIndex].img2.onload = () => { drawLayout(); renderRows(); };
            }
            closeCropModal();
        }

        function renderRows() {
            const container = document.getElementById('persons-container');
            container.innerHTML = '';
            
            persons.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'person-row';

                const sizeOptions = `
                    <select class="person-size-select" onchange="changePersonSize(${index}, this.value)">
                        <option value="job_form" ${p.size === 'job_form' ? 'selected' : ''}>Job Form Special (1 Line 6 Photos)</option>
                        <option value="passport_in" ${p.size === 'passport_in' ? 'selected' : ''}>Passport (3.5x4.5 cm)</option>
                        <option value="stamp_in" ${p.size === 'stamp_in' ? 'selected' : ''}>Stamp (2x2.5 cm)</option>
                        <option value="joint_in" ${p.size === 'joint_in' ? 'selected' : ''}>Joint Photo (4.8x4.0 cm)</option>
                        <option value="id_card_in" ${p.size === 'id_card_in' ? 'selected' : ''}>ID Card (F+B) (8.6x5.4 cm)</option>
                    </select>
                `;

                let cropBtn1 = p.loaded1 ? `<button class="upload-btn" style="background-color: var(--warning); padding: 8px 10px;" onclick="openCropModal(${index}, 1)" title="Crop"><i class="fa-solid fa-crop"></i></button>` : '';
                let cropBtn2 = p.loaded2 ? `<button class="upload-btn" style="background-color: var(--warning); padding: 8px 10px;" onclick="openCropModal(${index}, 2)" title="Crop"><i class="fa-solid fa-crop"></i></button>` : '';

                let uploadControls = '';
                
                if (p.size === 'id_card_in') {
                    uploadControls = `
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn">
                                <i class="fa-solid fa-id-card"></i> ${p.loaded1 ? 'Front ✓' : 'Front'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 1)">
                            </label>
                            ${cropBtn1}
                        </div>
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn upload-btn-secondary">
                                <i class="fa-solid fa-address-card"></i> ${p.loaded2 ? 'Back ✓' : 'Back'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 2)">
                            </label>
                            ${cropBtn2}
                        </div>
                    `;
                } else {
                    uploadControls = `
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn">
                                <i class="fa-solid fa-image"></i> ${p.loaded1 ? 'Photo ✓' : 'Upload'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 1)">
                            </label>
                            ${cropBtn1}
                        </div>
                    `;
                }

                let extraFields = '';
                if (photoDimensions[p.size].hasDetails) {
                    extraFields = `
                        <input type="text" class="text-input" placeholder="Name" value="${p.name}" oninput="updatePersonText(${index}, 'name', this.value)">
                        <input type="text" class="text-input" placeholder="DD/MM/YYYY" value="${p.date}" oninput="updatePersonText(${index}, 'date', this.value)">
                    `;
                }

                const borderSelect = `
                    <select class="text-input" style="width: auto; padding: 7px;" onchange="updatePersonText(${index}, 'border', this.value)">
                        <option value="0" ${p.border == '0' ? 'selected' : ''}>No Border</option>
                        <option value="1" ${p.border == '1' ? 'selected' : ''}>Thin Border</option>
                        <option value="3" ${p.border == '3' ? 'selected' : ''}>Medium Border</option>
                    </select>
                `;

                const qtyControl = `
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updatePersonQty(${index}, -1)">-</button>
                        <input type="text" class="qty-input" value="${p.qty}" readonly>
                        <button class="qty-btn" onclick="updatePersonQty(${index}, 1)">+</button>
                    </div>
                `;

                row.innerHTML = `
                    <div class="person-label">P-${index + 1}</div>
                    ${sizeOptions}
                    ${uploadControls}
                    ${extraFields}
                    ${borderSelect}
                    ${qtyControl}
                    <button class="btn-remove" onclick="removePerson(${index})" title="Remove">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function setCanvasSize() {
            const paper = paperDimensions[paperSelect.value];
            canvas.width = paper.w;
            canvas.height = paper.h;
            previewWrapper.style.aspectRatio = `${paper.w} / ${paper.h}`;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawLayout() {
            setCanvasSize();

            // ★ ক্যানভাসের মার্জিন এবং গ্যাপ কমানো হয়েছে যাতে নিচে আরও একটি লাইন ধরে যায় ★
            const minMargin = 3 * MM_TO_PX; 
            const gapX = 15; 
            const gapY = 12; 
            const idInnerGap = 120; 

            let currentY = minMargin;
            let rowHeight = 0;
            let lastSize = null;
            let currentX = 0;
            let currentGridStartX = 0;

            persons.forEach(p => {
                if (!p.loaded1 && p.size !== 'id_card_in') return;
                if (p.size === 'id_card_in' && !p.loaded1 && !p.loaded2) return;

                const dim = photoDimensions[p.size];
                const pW = dim.w * MM_TO_PX;
                const pH = dim.h * MM_TO_PX;
                
                const borderVal = parseInt(p.border); 

                const isId = (p.size === 'id_card_in');
                const unitW = isId ? (pW * 2 + idInnerGap) : pW;

                let fitCount = Math.floor((canvas.width - (2 * minMargin) + gapX) / (unitW + gapX));
                if (p.size === 'job_form') fitCount = 6; 
                if (isId) fitCount = Math.max(1, fitCount); 

                const gridW = fitCount * unitW + (fitCount - 1) * gapX;
                const gridStartX = Math.max(minMargin, (canvas.width - gridW) / 2);

                for (let i = 0; i < p.qty; i++) {
                    
                    if (lastSize !== null && lastSize !== p.size) {
                        currentX = gridStartX;
                        currentY += rowHeight + gapY;
                        rowHeight = pH;
                        currentGridStartX = gridStartX;
                    } else if (lastSize === null) {
                        currentX = gridStartX;
                        rowHeight = pH;
                        currentGridStartX = gridStartX;
                    }

                    if (i > 0 && i % fitCount === 0) {
                        currentX = currentGridStartX;
                        currentY += rowHeight + gapY;
                    } else if (p.size !== 'job_form' && !isId && currentX + unitW > canvas.width - currentGridStartX + 1) { 
                        currentX = currentGridStartX;
                        currentY += rowHeight + gapY;
                    }

                    // নিচের শর্তটি আরেকটু কমানো হয়েছে যাতে অনায়াসেই শেষ লাইনটি প্রিন্ট হয়ে যায়
                    if (currentY + pH > canvas.height - 5) {
                        return; 
                    }

                    if (isId) {
                        if (p.loaded1) {
                            ctx.drawImage(p.img1, currentX, currentY, pW, pH);
                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(currentX, currentY, pW, pH);
                            }
                        }
                        if (p.loaded2) {
                            ctx.drawImage(p.img2, currentX + pW + idInnerGap, currentY, pW, pH);
                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(currentX + pW + idInnerGap, currentY, pW, pH);
                            }
                        }
                    } else {
                        if (p.loaded1) {
                            ctx.drawImage(p.img1, currentX, currentY, pW, pH);
                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(currentX, currentY, pW, pH);
                            }
                            
                            if (dim.hasDetails && (p.name || p.date)) {
                                const barHeight = Math.min(45, pH * 0.25);
                                const barY = currentY + pH - barHeight;
                                
                                ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
                                ctx.fillRect(currentX, barY, pW, barHeight);
                                
                                ctx.beginPath();
                                ctx.moveTo(currentX, barY);
                                ctx.lineTo(currentX + pW, barY);
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = 1;
                                ctx.stroke();

                                ctx.textAlign = "center";
                                ctx.fillStyle = "#000000";
                                
                                if (p.name && !p.date) {
                                    ctx.font = "bold 24px Arial";
                                    ctx.fillText(p.name.toUpperCase(), currentX + (pW / 2), barY + (barHeight/1.5));
                                } else if (!p.name && p.date) {
                                    ctx.font = "bold 20px Arial";
                                    ctx.fillText(p.date, currentX + (pW / 2), barY + (barHeight/1.5));
                                } else {
                                    ctx.font = "bold 22px Arial";
                                    ctx.fillText(p.name.toUpperCase(), currentX + (pW / 2), barY + (barHeight/2) + 2);
                                    ctx.font = "bold 18px Arial";
                                    ctx.fillText(p.date, currentX + (pW / 2), barY + barHeight - 4);
                                }
                            }
                        }
                    }

                    currentX += unitW + gapX;
                    rowHeight = pH;
                    lastSize = p.size;
                }
            });
        }

        function downloadPDF() {
            const paperData = paperDimensions[paperSelect.value];
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: paperData.jsPdfFormat
            });
            pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
            pdf.save("Photos_Print_Ready.pdf");
        }

        function printPage() {
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Print Photo Sheet</title>
                    <style>
                        @page { size: auto; margin: 0; }
                        body { margin: 0; display: flex; justify-content: center; background: #fff; }
                        img { width: 100%; height: auto; display: block; }
                    </style>
                </head>
                <body>
                    <img src="${dataUrl}" onload="window.print(); window.close();">
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
