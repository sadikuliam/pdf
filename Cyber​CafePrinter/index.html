<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHM Pro Photo Print Maker | Cyber Cafe Printer</title>

    <meta name="description" content="SHM Pro Photo Print Maker — Passport, Stamp, Job Form and ID Card photos তৈরি করুন। কাঁচি দিয়ে সহজে কাটার উপযুক্ত মার্জিন ও গাইড লাইন সহ।">
    <meta name="robots" content="index, follow">

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CROPPER CSS & JS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- PDF LIB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-body: #111827;
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --border: #374151;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .tool-container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 1100px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 2px solid var(--primary);
            position: relative;
        }

        .toolbar-title {
            color: #1f2937;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .more-tools-btn {
            background: linear-gradient(145deg, #ff1493, #ff007f);
            color: white !important;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 18px;
            border-radius: 25px;
            border: none;
            box-shadow: 0 4px 0 #c70066, 0 6px 12px rgba(255, 20, 147, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .more-tools-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c70066, 0 8px 16px rgba(255, 20, 147, 0.6);
        }

        .toolbar-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

        .control-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #374151;
            white-space: nowrap;
        }

        select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
            color: #1f2937;
            background-color: #ffffff;
        }

        select:focus {
            border-color: var(--primary);
        }

        .person-panel {
            background-color: #f3f4f6;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .person-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            flex-wrap: wrap;
        }

        .person-label {
            font-weight: 700;
            color: #111827;
            background: #e5e7eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .person-size-select {
            flex-grow: 1;
            min-width: 170px;
        }

        .text-input {
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            width: 110px;
            color: #1f2937;
        }

        .upload-btn {
            background-color: var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            transition: 0.2s;
            white-space: nowrap;
        }

        .upload-btn:hover {
            background-color: var(--primary-hover);
        }

        .upload-btn-secondary {
            background-color: var(--success);
        }

        .upload-btn-secondary:hover {
            background-color: #059669;
        }

        input[type="file"] {
            display: none;
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        .qty-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 12px;
            color: #374151;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #e5e7eb;
        }

        .qty-input {
            width: 35px;
            text-align: center;
            border: none;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            padding: 6px 0;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }

        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
        }

        .btn-remove:hover {
            background-color: #dc2626;
        }

        .add-person-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            transition: 0.2s;
        }

        .add-person-btn:hover {
            background-color: #059669;
        }

        .cutting-hint-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #bae6fd;
            margin-bottom: 5px;
        }

        .workspace {
            padding: 30px;
            display: flex;
            justify-content: center;
            background-color: #374151;
            overflow: auto;
            min-height: 500px;
        }

        .paper-preview-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1 / 1.414;
            position: relative;
            transition: aspect-ratio 0.3s ease;
        }

        canvas#main-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .actions-bar {
            background-color: #1f2937;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-pdf { background-color: #ef4444; }
        .btn-pdf:hover { background-color: #dc2626; }
        .btn-print { background-color: #10b981; }
        .btn-print:hover { background-color: #059669; }

        .footer {
            background-color: var(--bg-panel);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .footer-logo {
            height: 28px;
            width: auto;
            border-radius: 4px;
        }
        
        .footer-text {
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .footer-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .footer-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .badge-img {
            height: 24px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 450px;
            display: flex; flex-direction: column; gap: 15px; color: #1f2937;
        }
        .crop-container {
            width: 100%; height: 300px; background: #e5e7eb; overflow: hidden;
            display: flex; justify-content: center; align-items: center; border-radius: 4px;
        }
        .crop-container img { max-width: 100%; max-height: 100%; }

        @media (max-width: 768px) {
            .person-row { flex-direction: column; align-items: stretch; }
            .btn-remove { margin-left: 0; width: 100%; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar-controls { justify-content: space-between; width: 100%; }
            .footer { justify-content: center; text-align: center; }
            .footer-left { flex-direction: column; gap: 8px; }
        }
    </style>
</head>

<body>
    <div class="tool-container">
        <div class="toolbar">
            <div class="toolbar-title">
                <i class="fa-solid fa-users-viewfinder"></i> Cyber Cafe Printer 🖨️
            </div>
            
            <a href="https://pdf.shmwb.in/" target="_blank" class="more-tools-btn">
                <i class="fa-solid fa-toolbox"></i> More Tools
            </a>

            <div class="toolbar-controls">
                <div class="control-group">
                    <span class="control-label"><i class="fa-solid fa-file"></i> Paper:</span>
                    <select id="paper-size" onchange="drawLayout()">
                        <option value="A4" selected>A4 Sheet</option>
                        <option value="Letter">US Letter</option>
                        <option value="4x6">4x6 Inch</option>
                    </select>
                </div>

                <div class="control-group">
                    <span class="control-label"><i class="fa-solid fa-arrows-split-up-and-left"></i> Cut Gap:</span>
                    <select id="cut-gap" onchange="drawLayout()" title="কাঁচি চালানোর গ্যাপ">
                        <option value="4.5" selected>Standard (4.5 mm)</option>
                        <option value="6.0">Wide (6.0 mm)</option>
                        <option value="3.0">Compact (3.0 mm)</option>
                        <option value="8.0">Extra Wide (8.0 mm)</option>
                    </select>
                </div>

                <div class="control-group">
                    <span class="control-label"><i class="fa-solid fa-scissors"></i> Cut Line:</span>
                    <select id="cut-guide" onchange="drawLayout()" title="কাটার গাইড লাইন">
                        <option value="dashed" selected>Dashed Line ✂️</option>
                        <option value="crop">Corner Ticks ⸤⸣</option>
                        <option value="solid">Light Solid</option>
                        <option value="none">None</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="person-panel" id="person-panel">
            <div class="cutting-hint-badge">
                <i class="fa-solid fa-circle-check"></i>
                <span><strong>কাঁচি দিয়ে কাটার সুবিধা:</strong> প্রতিটি ফটোর ডানে-বামে ও উপরে-নিচে পর্যাপ্ত ফাঁকা স্থান (৪.৫ মিমি) ও কাটিং গাইড লাইন যুক্ত করা হয়েছে।</span>
            </div>
            <div id="persons-container"></div>
            <button class="add-person-btn" onclick="addPersonRow()">
                <i class="fa-solid fa-user-plus"></i> Add Person
            </button>
        </div>

        <div class="workspace">
            <div class="paper-preview-wrapper" id="preview-wrapper">
                <canvas id="main-canvas"></canvas>
            </div>
        </div>

        <div class="actions-bar">
            <button class="action-btn btn-pdf" onclick="downloadPDF()">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </button>
            <button class="action-btn btn-print" onclick="printPage()">
                <i class="fa-solid fa-print"></i> Direct Print
            </button>
        </div>

        <div class="footer">
            <div class="footer-left">
                <a href="https://shmwb.in" target="_blank" rel="noopener noreferrer">
                    <img src="https://res.cloudinary.com/ewu5hckc/image/upload/v1787377473/logo.png" alt="Powered by shmwb.in" class="footer-logo">
                </a>
                <span class="footer-text">Powered by <a href="https://shmwb.in" target="_blank" rel="noopener noreferrer" class="footer-link">shmwb.in</a></span>
            </div>
            <div>
                <img src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Fwww.shmwb.in&label=SITE%20VISITORS&labelColor=%23374151&countColor=%232563eb" 
                     alt="Visitor Counter for shmwb.in" class="badge-img">
            </div>
        </div>
    </div>

    <!-- CROP MODAL -->
    <div class="modal-overlay" id="crop-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem;">
                <span><i class="fa-solid fa-crop"></i> Adjust & Crop Photo</span>
            </div>
            <div class="crop-container">
                <img id="image-to-crop" src="" alt="Crop preview">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="upload-btn" style="background:#6b7280;" onclick="closeCropModal()">Cancel</button>
                <button class="upload-btn" onclick="applyCrop()"><i class="fa-solid fa-check"></i> Apply & Save</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const paperSelect = document.getElementById('paper-size');
        const cutGapSelect = document.getElementById('cut-gap');
        const cutGuideSelect = document.getElementById('cut-guide');
        const previewWrapper = document.getElementById('preview-wrapper');

        let persons = [];
        let cropper = null;
        let activeCropIndex = null;
        let activeCropImgNum = null;

        // 300 DPI: 11.811 pixels per mm
        const MM_TO_PX = 11.811;

        const paperDimensions = {
            'A4': { w: 2480, h: 3508, jsPdfFormat: 'a4' },
            'Letter': { w: 2550, h: 3300, jsPdfFormat: 'letter' },
            '4x6': { w: 1200, h: 1800, jsPdfFormat: [101.6, 152.4] }
        };

        const photoDimensions = {
            'job_form': { w: 32, h: 40, hasDetails: true }, 
            'job_form_5': { w: 32, h: 40, hasDetails: true },
            'passport_in': { w: 35, h: 45 },
            'stamp_in': { w: 20, h: 25 },
            'joint_in': { w: 48.3, h: 40.6 },
            'id_card_in': { w: 86, h: 54 } 
        };

        addPersonRow();
        setCanvasSize();

        function addPersonRow() {
            if (persons.length >= 15) {
                alert("Maximum 15 persons allowed at once.");
                return;
            }
            persons.push({
                size: 'job_form',
                qty: 1, 
                name: '',
                date: '',
                border: 1, 
                img1: new Image(),
                loaded1: false,
                img2: new Image(),
                loaded2: false
            });
            renderRows();
            drawLayout();
        }

        function removePerson(index) {
            persons.splice(index, 1);
            if (persons.length === 0) addPersonRow();
            else renderRows();
            drawLayout();
        }

        function changePersonSize(index, newSize) {
            persons[index].size = newSize;
            renderRows();
            drawLayout();
        }

        function updatePersonQty(index, change) {
            let current = parseInt(persons[index].qty);
            let newVal = current + change;
            if (newVal >= 1 && newVal <= 50) {
                persons[index].qty = newVal;
                renderRows();
                drawLayout();
            }
        }

        function updatePersonText(index, field, value) {
            persons[index][field] = value;
            drawLayout();
        }

        function handleUpload(event, index, imgNum) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    if (imgNum === 1) {
                        persons[index].img1.src = dataUrl;
                        persons[index].img1.onload = () => {
                            persons[index].loaded1 = true;
                            renderRows();
                            openCropModal(index, 1); 
                        };
                    } else {
                        persons[index].img2.src = dataUrl;
                        persons[index].img2.onload = () => {
                            persons[index].loaded2 = true;
                            renderRows();
                            openCropModal(index, 2); 
                        };
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function openCropModal(index, imgNum) {
            activeCropIndex = index;
            activeCropImgNum = imgNum;
            const imgToCrop = (imgNum === 1) ? persons[index].img1 : persons[index].img2;

            if (!imgToCrop || !imgToCrop.src) return;

            document.getElementById('crop-modal').style.display = 'flex';
            const cropImg = document.getElementById('image-to-crop');
            cropImg.src = imgToCrop.src;

            if (cropper) cropper.destroy();

            const dim = photoDimensions[persons[index].size];
            
            cropper = new Cropper(cropImg, {
                aspectRatio: dim.w / dim.h,
                viewMode: 1,
                autoCropArea: 0.9,
                dragMode: 'move'
            });
        }

        function closeCropModal() {
            document.getElementById('crop-modal').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function applyCrop() {
            if (!cropper || activeCropIndex === null) return;
            
            const dim = photoDimensions[persons[activeCropIndex].size];

            const canvasCropped = cropper.getCroppedCanvas({
                width: dim.w * 15, 
                height: dim.h * 15
            });

            const dataUrl = canvasCropped.toDataURL('image/jpeg', 1.0);

            if (activeCropImgNum === 1) {
                persons[activeCropIndex].img1.src = dataUrl;
                persons[activeCropIndex].img1.onload = () => { drawLayout(); renderRows(); };
            } else {
                persons[activeCropIndex].img2.src = dataUrl;
                persons[activeCropIndex].img2.onload = () => { drawLayout(); renderRows(); };
            }
            closeCropModal();
        }

        function renderRows() {
            const container = document.getElementById('persons-container');
            container.innerHTML = '';
            
            persons.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'person-row';

                const sizeOptions = `
                    <select class="person-size-select" onchange="changePersonSize(${index}, this.value)">
                        <option value="job_form" ${p.size === 'job_form' ? 'selected' : ''}>Job Form Special (1 Line 6 Photos - 3.2x4.0 cm)</option>
                        <option value="job_form_5" ${p.size === 'job_form_5' ? 'selected' : ''}>Job Form Special (1 Line 5 Photos - Extra Space)</option>
                        <option value="passport_in" ${p.size === 'passport_in' ? 'selected' : ''}>Passport (3.5x4.5 cm)</option>
                        <option value="stamp_in" ${p.size === 'stamp_in' ? 'selected' : ''}>Stamp (2.0x2.5 cm)</option>
                        <option value="joint_in" ${p.size === 'joint_in' ? 'selected' : ''}>Joint Photo (4.8x4.0 cm)</option>
                        <option value="id_card_in" ${p.size === 'id_card_in' ? 'selected' : ''}>ID Card (F+B) (8.6x5.4 cm)</option>
                    </select>
                `;

                let cropBtn1 = p.loaded1 ? `<button class="upload-btn" style="background-color: var(--warning); padding: 8px 10px;" onclick="openCropModal(${index}, 1)" title="Crop"><i class="fa-solid fa-crop"></i></button>` : '';
                let cropBtn2 = p.loaded2 ? `<button class="upload-btn" style="background-color: var(--warning); padding: 8px 10px;" onclick="openCropModal(${index}, 2)" title="Crop"><i class="fa-solid fa-crop"></i></button>` : '';

                let uploadControls = '';
                
                if (p.size === 'id_card_in') {
                    uploadControls = `
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn">
                                <i class="fa-solid fa-id-card"></i> ${p.loaded1 ? 'Front ✓' : 'Front'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 1)">
                            </label>
                            ${cropBtn1}
                        </div>
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn upload-btn-secondary">
                                <i class="fa-solid fa-address-card"></i> ${p.loaded2 ? 'Back ✓' : 'Back'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 2)">
                            </label>
                            ${cropBtn2}
                        </div>
                        <div style="display:flex; gap:4px; margin-left: 5px;">
                            <a href="https://pdf.shmwb.in/" target="_blank" class="upload-btn" style="background-color: #8b5cf6; text-decoration: none;" title="Convert any long card to standard PVC size">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Make PVC Size
                            </a>
                        </div>
                    `;
                } else {
                    uploadControls = `
                        <div style="display:flex; gap:4px;">
                            <label class="upload-btn">
                                <i class="fa-solid fa-image"></i> ${p.loaded1 ? 'Photo ✓' : 'Upload'}
                                <input type="file" accept="image/*" onchange="handleUpload(event, ${index}, 1)">
                            </label>
                            ${cropBtn1}
                        </div>
                    `;
                }

                let extraFields = '';
                if (photoDimensions[p.size].hasDetails) {
                    extraFields = `
                        <input type="text" class="text-input" placeholder="Name" value="${p.name}" oninput="updatePersonText(${index}, 'name', this.value)">
                        <input type="text" class="text-input" placeholder="DD/MM/YYYY" value="${p.date}" oninput="updatePersonText(${index}, 'date', this.value)">
                    `;
                }

                const borderSelect = `
                    <select class="text-input" style="width: auto; padding: 7px;" onchange="updatePersonText(${index}, 'border', this.value)">
                        <option value="0" ${p.border == '0' ? 'selected' : ''}>No Border</option>
                        <option value="1" ${p.border == '1' ? 'selected' : ''}>Thin Border</option>
                        <option value="3" ${p.border == '3' ? 'selected' : ''}>Medium Border</option>
                    </select>
                `;

                const qtyControl = `
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updatePersonQty(${index}, -1)">-</button>
                        <input type="text" class="qty-input" value="${p.qty}" readonly>
                        <button class="qty-btn" onclick="updatePersonQty(${index}, 1)">+</button>
                    </div>
                `;

                row.innerHTML = `
                    <div class="person-label">P-${index + 1}</div>
                    ${sizeOptions}
                    ${uploadControls}
                    ${extraFields}
                    ${borderSelect}
                    ${qtyControl}
                    <button class="btn-remove" onclick="removePerson(${index})" title="Remove">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function setCanvasSize() {
            const paper = paperDimensions[paperSelect.value];
            canvas.width = paper.w;
            canvas.height = paper.h;
            previewWrapper.style.aspectRatio = `${paper.w} / ${paper.h}`;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawLayout() {
            setCanvasSize();

            const paperKey = paperSelect.value;
            const paper = paperDimensions[paperKey];

            // User-configured cutting gap in mm (Default: 4.5 mm)
            const gapMm = cutGapSelect ? parseFloat(cutGapSelect.value) : 4.5;
            const guideType = cutGuideSelect ? cutGuideSelect.value : 'dashed';

            // Top margin: 10 mm for printer feed clearance
            const topMargin = 10 * MM_TO_PX; 
            const minSideMargin = 5 * MM_TO_PX;

            let currentY = topMargin;
            let rowHeight = 0;
            let lastSize = null;
            let currentX = 0;
            let currentGridStartX = 0;
            let currentCol = 0;

            let fitCount = 0;
            let gapX = 0;
            let gapY = 0;

            const placedPhotos = [];

            persons.forEach(p => {
                if (!p.loaded1 && p.size !== 'id_card_in') return;
                if (p.size === 'id_card_in' && !p.loaded1 && !p.loaded2) return;

                const dim = photoDimensions[p.size];
                const pW = dim.w * MM_TO_PX;
                const pH = dim.h * MM_TO_PX;
                const borderVal = parseInt(p.border);

                const isId = (p.size === 'id_card_in');
                const idInnerGap = isId ? (10 * MM_TO_PX) : 0;
                const unitW = isId ? (pW * 2 + idInnerGap) : pW;

                const baseGap = gapMm * MM_TO_PX;
                let thisGapY = isId ? Math.max(baseGap, 8 * MM_TO_PX) : baseGap;
                let thisGapX = baseGap;

                let availW = paper.w - (2 * minSideMargin);
                let calcCols = Math.floor((availW + baseGap) / (unitW + baseGap));
                if (calcCols < 1) calcCols = 1;

                if (p.size === 'job_form' && (paperKey === 'A4' || paperKey === 'Letter')) {
                    if (paper.w - (6 * unitW) > 8 * MM_TO_PX) {
                        calcCols = 6;
                    }
                } else if (p.size === 'job_form_5') {
                    calcCols = Math.min(5, calcCols);
                } else if (p.size === 'joint_in' && (paperKey === 'A4' || paperKey === 'Letter')) {
                    if (4 * unitW + 3 * (3.2 * MM_TO_PX) <= paper.w) {
                        calcCols = 4;
                    }
                }

                let thisFitCount = calcCols;
                let thisGridStartX = minSideMargin;

                if (thisFitCount === 1) {
                    thisGapX = baseGap;
                    const gridW = unitW;
                    thisGridStartX = (paper.w - gridW) / 2;
                } else {
                    if (p.size === 'job_form' && thisFitCount === 6) {
                        const sideM = 3 * MM_TO_PX;
                        thisGapX = (paper.w - (2 * sideM) - (thisFitCount * unitW)) / (thisFitCount - 1);
                        thisGridStartX = sideM;
                    } else if (p.size === 'joint_in' && thisFitCount === 4) {
                        const sideM = 3.5 * MM_TO_PX;
                        thisGapX = (paper.w - (2 * sideM) - (thisFitCount * unitW)) / (thisFitCount - 1);
                        thisGridStartX = sideM;
                    } else {
                        thisGapX = baseGap;
                        let gridW = thisFitCount * unitW + (thisFitCount - 1) * thisGapX;
                        if (gridW > paper.w - (2 * minSideMargin)) {
                            thisGapX = (paper.w - (2 * minSideMargin) - (thisFitCount * unitW)) / (thisFitCount - 1);
                            gridW = thisFitCount * unitW + (thisFitCount - 1) * thisGapX;
                        }
                        thisGridStartX = (paper.w - gridW) / 2;
                    }
                }

                for (let i = 0; i < p.qty; i++) {
                    if (lastSize !== null && lastSize !== p.size) {
                        currentX = thisGridStartX;
                        currentY += rowHeight + thisGapY;
                        rowHeight = pH;
                        currentGridStartX = thisGridStartX;
                        currentCol = 0;
                        fitCount = thisFitCount;
                        gapX = thisGapX;
                        gapY = thisGapY;
                    } else if (lastSize === null) {
                        currentX = thisGridStartX;
                        rowHeight = pH;
                        currentGridStartX = thisGridStartX;
                        currentCol = 0;
                        fitCount = thisFitCount;
                        gapX = thisGapX;
                        gapY = thisGapY;
                    }

                    if (currentCol >= fitCount) {
                        currentX = currentGridStartX;
                        currentY += rowHeight + gapY;
                        currentCol = 0;
                    }

                    if (currentY + pH > canvas.height - (5 * MM_TO_PX)) {
                        break;
                    }

                    if (isId) {
                        if (p.loaded1) {
                            ctx.drawImage(p.img1, currentX, currentY, pW, pH);
                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(currentX, currentY, pW, pH);
                            }
                        }
                        if (p.loaded2) {
                            const backX = currentX + pW + idInnerGap;
                            ctx.drawImage(p.img2, backX, currentY, pW, pH);
                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(backX, currentY, pW, pH);
                            }
                        }
                    } else {
                        if (p.loaded1) {
                            ctx.drawImage(p.img1, currentX, currentY, pW, pH);
                            
                            if (dim.hasDetails && (p.name || p.date)) {
                                const barHeight = Math.min(48, pH * 0.25);
                                const barY = currentY + pH - barHeight;
                                
                                ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
                                ctx.fillRect(currentX, barY, pW, barHeight);
                                
                                ctx.beginPath();
                                ctx.moveTo(currentX, barY);
                                ctx.lineTo(currentX + pW, barY);
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = 1;
                                ctx.stroke();

                                ctx.textAlign = "center";
                                ctx.fillStyle = "#000000";
                                
                                if (p.name && !p.date) {
                                    ctx.font = "bold 24px Arial";
                                    ctx.fillText(p.name.toUpperCase(), currentX + (pW / 2), barY + (barHeight / 1.5));
                                } else if (!p.name && p.date) {
                                    ctx.font = "bold 20px Arial";
                                    ctx.fillText(p.date, currentX + (pW / 2), barY + (barHeight / 1.5));
                                } else {
                                    ctx.font = "bold 22px Arial";
                                    ctx.fillText(p.name.toUpperCase(), currentX + (pW / 2), barY + (barHeight / 2) + 2);
                                    ctx.font = "bold 18px Arial";
                                    ctx.fillText(p.date, currentX + (pW / 2), barY + barHeight - 4);
                                }
                            }

                            if (borderVal > 0) {
                                ctx.strokeStyle = "#000000";
                                ctx.lineWidth = borderVal;
                                ctx.strokeRect(currentX, currentY, pW, pH);
                            }
                        }
                    }

                    placedPhotos.push({
                        x: currentX,
                        y: currentY,
                        w: pW,
                        h: pH,
                        unitW: unitW,
                        isId: isId,
                        loaded1: p.loaded1,
                        loaded2: p.loaded2,
                        idInnerGap: idInnerGap,
                        gapX: gapX,
                        gapY: gapY,
                        col: currentCol
                    });

                    currentX += unitW + gapX;
                    currentCol++;
                    rowHeight = pH;
                    lastSize = p.size;
                }
            });

            drawCutGuides(placedPhotos, guideType);
        }

        // Draw Cutting Guidelines
        function drawCutGuides(placedPhotos, guideType) {
            if (!guideType || guideType === 'none' || placedPhotos.length === 0) return;

            ctx.save();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.2;

            if (guideType === 'dashed') {
                ctx.setLineDash([8, 8]);
            } else if (guideType === 'solid') {
                ctx.setLineDash([]);
            }

            if (guideType === 'crop') {
                const tick = 18;
                ctx.setLineDash([]);
                placedPhotos.forEach(p => {
                    drawBoxCorners(p.x, p.y, p.w, p.h, tick);
                    if (p.isId && p.loaded2) {
                        const bX = p.x + p.w + p.idInnerGap;
                        drawBoxCorners(bX, p.y, p.w, p.h, tick);
                    }
                });
                ctx.restore();
                return;
            }

            const rows = [];
            placedPhotos.forEach(p => {
                let row = rows.find(r => Math.abs(r.y - p.y) < 3);
                if (!row) {
                    row = { y: p.y, h: p.h, gapY: p.gapY, photos: [] };
                    rows.push(row);
                }
                row.photos.push(p);
            });

            // 1. Vertical cutting guides between photo columns
            rows.forEach(row => {
                row.photos.sort((a, b) => a.x - b.x);
                for (let i = 0; i < row.photos.length - 1; i++) {
                    const curr = row.photos[i];
                    const next = row.photos[i + 1];
                    const currRight = curr.isId ? (curr.x + curr.w * 2 + curr.idInnerGap) : (curr.x + curr.w);
                    const nextLeft = next.x;
                    const midX = (currRight + nextLeft) / 2;

                    ctx.beginPath();
                    ctx.moveTo(midX, row.y - (2 * MM_TO_PX));
                    ctx.lineTo(midX, row.y + row.h + (2 * MM_TO_PX));
                    ctx.stroke();
                }

                row.photos.forEach(p => {
                    if (p.isId && p.idInnerGap > 0) {
                        const midX = p.x + p.w + (p.idInnerGap / 2);
                        ctx.beginPath();
                        ctx.moveTo(midX, p.y - (2 * MM_TO_PX));
                        ctx.lineTo(midX, p.y + p.h + (2 * MM_TO_PX));
                        ctx.stroke();
                    }
                });
            });

            // 2. Horizontal cutting guides between rows
            for (let r = 0; r < rows.length - 1; r++) {
                const currRow = rows[r];
                const nextRow = rows[r + 1];
                const currBottom = currRow.y + currRow.h;
                const nextTop = nextRow.y;
                const midY = (currBottom + nextTop) / 2;

                const minX = Math.min(currRow.photos[0].x, nextRow.photos[0].x);
                const maxCurr = currRow.photos[currRow.photos.length - 1];
                const maxNext = nextRow.photos[nextRow.photos.length - 1];
                const maxXCurr = maxCurr.isId ? (maxCurr.x + maxCurr.w * 2 + maxCurr.idInnerGap) : (maxCurr.x + maxCurr.w);
                const maxXNext = maxNext.isId ? (maxNext.x + maxNext.w * 2 + maxNext.idInnerGap) : (maxNext.x + maxNext.w);
                const maxX = Math.max(maxXCurr, maxXNext);

                ctx.beginPath();
                ctx.moveTo(minX - (3 * MM_TO_PX), midY);
                ctx.lineTo(maxX + (3 * MM_TO_PX), midY);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawBoxCorners(x, y, w, h, tick) {
            ctx.beginPath();
            ctx.moveTo(x - tick, y); ctx.lineTo(x - 3, y);
            ctx.moveTo(x, y - tick); ctx.lineTo(x, y - 3);
            ctx.moveTo(x + w + 3, y); ctx.lineTo(x + w + tick, y);
            ctx.moveTo(x + w, y - tick); ctx.lineTo(x + w, y - 3);
            ctx.moveTo(x - tick, y + h); ctx.lineTo(x - 3, y + h);
            ctx.moveTo(x, y + h + 3); ctx.lineTo(x, y + h + tick);
            ctx.moveTo(x + w + 3, y + h); ctx.lineTo(x + w + tick, y + h);
            ctx.moveTo(x + w, y + h + 3); ctx.lineTo(x + w, y + h + tick);
            ctx.stroke();
        }

        function downloadPDF() {
            const paperData = paperDimensions[paperSelect.value];
            const imgData = canvas.toDataURL('image/jpeg', 0.98);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: paperData.jsPdfFormat
            });
            pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
            pdf.save("Photos_Print_Ready.pdf");
        }

        function printPage() {
            const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
            let pageCss = 'size: A4 portrait;';
            if (paperSelect.value === 'Letter') pageCss = 'size: letter portrait;';
            else if (paperSelect.value === '4x6') pageCss = 'size: 4in 6in portrait;';

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Photo Sheet</title>
                    <style>
                        @page { ${pageCss} margin: 0; }
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { margin: 0; display: flex; justify-content: center; align-items: flex-start; background: #fff; }
                        img { width: 100%; height: auto; max-width: 100%; display: block; }
                    </style>
                </head>
                <body>
                    <img src="${dataUrl}" onload="setTimeout(function(){ window.print(); window.close(); }, 250);">
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
