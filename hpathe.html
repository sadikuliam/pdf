<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ম্যাগাজিন - Flipbook</title>
    
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <!-- dFlip CSS -->
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        /* বডির কোড একই থাকবে, এটি গ্লাস কন্টেইনারকে স্ক্রিনের মাঝে রাখবে */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* গ্লাস কন্টেইনার (ফ্লেক্সবক্স সরানো হয়েছে) */
        .glass-container {
            width: 95vw;
            height: 95vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            display: block; /* <--- এটি ঠিক করা হয়েছে */
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* ফুলস্ক্রিন অবস্থায় গ্লাস কন্টেইনার স্ক্রিনের ১০০% জায়গা নেবে */
        :fullscreen .glass-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }
        :-webkit-full-screen .glass-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        /* dFlip কন্টেইনার (ফ্লেক্সবক্স সরানো হয়েছে) */
        .df-container {
            width: 100%;
            height: 100%;
            display: block; /* <--- এটি ঠিক করা হয়েছে */
        }

        /* ফুলস্ক্রিন বাটন */
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-50%) translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="glass-container" id="main-wrapper">
        <!-- PDF লোড হবে এখানে -->
        <div class="_df_book df-container" source="HajerPathe.pdf" id="df_manual_book"></div>
        
        <!-- ফুলস্ক্রিন বাটন -->
        <button id="fullscreen-btn">🔍 Fullscreen</button>
    </div>

    <!-- dFlip JS -->
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
    
    <script>
        var option_df_manual_book = {
            backgroundColor: "transparent",
            pageMode: 1, 
            paddingTop: 30,
            paddingBottom: 70 /* বাটনের জন্য নিচে জায়গা */
        };

        // ফুলস্ক্রিন লজিক এবং রি-সাইজ ফিক্স
        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            let elem = document.documentElement; 
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); } 
                this.innerHTML = "✖ Exit Fullscreen";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
                this.innerHTML = "🔍 Fullscreen";
            }

            // ব্রাউজারকে পেজ রিসাইজ করার সিগন্যাল (যাতে dFlip নিজে থেকে মাঝে আসে)
            setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 200);
            setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 600);
        });
    </script>
</body>
</html>
