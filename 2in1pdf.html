<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF & Image N-Up Converter</title>
    
    <!-- PDF-Lib for generating PDFs -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <!-- PDF.js for rendering PDF to Image (PNG/JPG) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- JSZip for downloading multiple images as a Zip file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --violet: #7c3aed;
            --violet-hover: #6d28d9;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 35px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 25px;
            gap: 15px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--violet);
            border-radius: 10px;
            background: #f5f3ff;
            color: var(--violet);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            border-color: var(--violet-hover);
            color: #ffffff;
            background: var(--violet);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
        }

        .header-text {
            width: 100%;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            color: #1E293B;
            margin-bottom: 6px;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 14px;
            color: #64748B;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed #CBD5E1;
            border-radius: 14px;
            padding: 25px 15px;
            background: #F8FAFC;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #EEF2FF;
        }

        .upload-icon {
            font-size: 38px;
            margin-bottom: 8px;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 8px;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            word-break: break-all;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #334155;
            transition: border-color 0.3s;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--violet));
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        #status {
            margin-top: 18px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="https://pdf.shmwb.in/" class="home-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Home
        </a>
        <div class="header-text">
            <h2>Multi-file N-Up Converter</h2>
            <p class="subtitle">PDF ও ছবি আপলোড করে A4 পেজে লেআউট তৈরি করুন এবং PDF/PNG/JPG তে সেভ করুন।</p>
        </div>
    </div>

    <!-- Custom File Selection (Multiple allowed) -->
    <div class="form-group">
        <label>১. ফাইল সিলেক্ট করুন (PDF, PNG, JPG):</label>
        <label for="pdfFile">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄🖼️</div>
                <div id="uploadText" style="font-size: 14px; color: #475569;">ফাইল আপলোড করতে ক্লিক করুন</div>
                <div class="file-name" id="fileName"></div>
            </div>
        </label>
        <input type="file" id="pdfFile" accept="application/pdf, image/png, image/jpeg" multiple>
    </div>

    <!-- Layout Dropdown -->
    <div class="form-group">
        <label for="layoutSelect">২. প্রতি A4 পৃষ্ঠায় কয়টি পেজ/ছবি চান?</label>
        <select id="layoutSelect">
            <option value="2">2 Pages in 1 A4 Page (Side-by-Side)</option>
            <option value="4">4 Pages in 1 A4 Page (2x2 Grid)</option>
        </select>
    </div>
    
    <!-- Output Format Dropdown -->
    <div class="form-group">
        <label for="formatSelect">৩. আউটপুট ফরম্যাট সিলেক্ট করুন:</label>
        <select id="formatSelect">
            <option value="pdf">PDF File (.pdf)</option>
            <option value="png">Images as PNG (.zip)</option>
            <option value="jpg">Images as JPG (.zip)</option>
        </select>
    </div>

    <button onclick="processFiles()">Convert & Download</button>

    <div id="status"></div>
</div>

<script>
    // Setup PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('pdfFile');
    const fileNameDisplay = document.getElementById('fileName');
    const uploadText = document.getElementById('uploadText');

    fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
            fileNameDisplay.textContent = `Selected: ${this.files.length} file(s)`;
            uploadText.style.display = 'none';
        } else {
            fileNameDisplay.textContent = "";
            uploadText.style.display = 'block';
        }
    });

    async function processFiles() {
        const layoutSelect = document.getElementById('layoutSelect').value;
        const formatSelect = document.getElementById('formatSelect').value;
        const status = document.getElementById('status');

        if (fileInput.files.length === 0) {
            alert('অনুগ্রহ করে অন্তত একটি ফাইল সিলেক্ট করুন।');
            return;
        }

        status.style.color = "#475569";
        status.innerText = "কাজ চলছে, অনুগ্রহ করে অপেক্ষা করুন... ⏳";

        try {
            const { PDFDocument, PageSizes } = PDFLib;
            const newDoc = await PDFDocument.create();
            let allElements = []; // Store all extracted pages and images

            // 1. Process all input files
            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                const arrayBuffer = await file.arrayBuffer();

                if (file.type === 'application/pdf') {
                    const srcDoc = await PDFDocument.load(arrayBuffer);
                    const pageIndices = Array.from({ length: srcDoc.getPageCount() }, (_, i) => i);
                    const embeddedPages = await newDoc.embedPdf(srcDoc, pageIndices);
                    embeddedPages.forEach(p => allElements.push({ type: 'pdf', obj: p, width: p.width, height: p.height }));
                } else if (file.type === 'image/png') {
                    const img = await newDoc.embedPng(arrayBuffer);
                    allElements.push({ type: 'image', obj: img, width: img.width, height: img.height });
                } else if (file.type === 'image/jpeg' || file.type === 'image/jpg') {
                    const img = await newDoc.embedJpg(arrayBuffer);
                    allElements.push({ type: 'image', obj: img, width: img.width, height: img.height });
                }
            }

            if (allElements.length === 0) {
                throw new Error("No valid pages or images found.");
            }

            // 2. Generate N-Up Layout
            const totalItems = allElements.length;
            const itemsPerSheet = parseInt(layoutSelect);
            const a4Width = PageSizes.A4[0];
            const a4Height = PageSizes.A4[1];

            for (let i = 0; i < totalItems; i += itemsPerSheet) {
                let newPage;
                if (itemsPerSheet === 2) {
                    newPage = newDoc.addPage([a4Height, a4Width]); // Landscape
                } else {
                    newPage = newDoc.addPage([a4Width, a4Height]); // Portrait
                }

                const { width: sheetWidth, height: sheetHeight } = newPage.getSize();

                for (let j = 0; j < itemsPerSheet; j++) {
                    if (i + j >= totalItems) break;

                    const element = allElements[i + j];
                    let targetWidth, targetHeight, x, y;

                    if (itemsPerSheet === 2) {
                        targetWidth = sheetWidth / 2;
                        targetHeight = sheetHeight;
                        const scale = Math.min(targetWidth / element.width, targetHeight / element.height);
                        const scaledWidth = element.width * scale;
                        const scaledHeight = element.height * scale;
                        x = (j % 2) * targetWidth + (targetWidth - scaledWidth) / 2;
                        y = (targetHeight - scaledHeight) / 2;
                        
                        drawElement(newPage, element, x, y, scaledWidth, scaledHeight);
                    } else if (itemsPerSheet === 4) {
                        targetWidth = sheetWidth / 2;
                        targetHeight = sheetHeight / 2;
                        const scale = Math.min(targetWidth / element.width, targetHeight / element.height);
                        const scaledWidth = element.width * scale;
                        const scaledHeight = element.height * scale;
                        const col = j % 2;
                        const row = Math.floor(j / 2);
                        x = col * targetWidth + (targetWidth - scaledWidth) / 2;
                        y = (1 - row) * targetHeight + (targetHeight - scaledHeight) / 2;

                        drawElement(newPage, element, x, y, scaledWidth, scaledHeight);
                    }
                }
            }

            const pdfBytes = await newDoc.save();

            // 3. Handle Output format (PDF or PNG/JPG via JSZip)
            if (formatSelect === 'pdf') {
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Converted_A4_Layout.pdf';
                link.click();
            } else {
                status.innerText = "ইমেজ তৈরি করা হচ্ছে, অপেক্ষা করুন... ⏳";
                await exportToImages(pdfBytes, formatSelect);
            }

            status.style.color = "#10B981";
            status.innerText = "✅ সফলভাবে তৈরি করা হয়েছে!";
        } catch (error) {
            console.error(error);
            status.style.color = "#EF4444";
            status.innerText = "❌ প্রসেসিং ব্যর্থ হয়েছে। ফাইলটি পরীক্ষা করে আবার চেষ্টা করুন।";
        }
    }

    function drawElement(page, element, x, y, width, height) {
        if (element.type === 'pdf') {
            page.drawPage(element.obj, { x, y, width, height });
        } else {
            page.drawImage(element.obj, { x, y, width, height });
        }
    }

    async function exportToImages(pdfBytes, format) {
        const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
        const pdf = await loadingTask.promise;
        const zip = new JSZip();

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const scale = 2.0; // High Quality
            const viewport = page.getViewport({ scale: scale });

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            // Render PDF page into canvas
            await page.render({ canvasContext: context, viewport: viewport }).promise;

            const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const imgData = canvas.toDataURL(mimeType, 0.9);
            const base64Data = imgData.split(',')[1];
            
            // Add image to ZIP
            zip.file(`Page_${pageNum}.${format}`, base64Data, { base64: true });
        }

        // Generate Zip and Download
        const zipContent = await zip.generateAsync({ type: "blob" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipContent);
        link.download = `Converted_Layout_Images.zip`;
        link.click();
    }
</script>

</body>
</html>
