<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Voice - Live Radio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap');

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Noto Sans Bengali', sans-serif;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .radio-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .station-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="radio-card">
        <div class="station-icon">🎙️</div>
        <h2>Local Voice Live</h2>
        <p>বাসিরহাট লাইভ রেডিও স্ট্রিমিং</p>

        <!-- HTML5 Audio Player -->
        <audio controls autoplay preload="none">
            <!-- আপনার Centova Cast Quick Links থেকে প্রাপ্ত লিংকটি এখানে দিন -->
            <source src="https://eu8.fastcast4u.com/proxy/shmlocalvoice?mp=/stream" type="audio/pls">
            আপনার ব্রাউজার অডিও ট্যাগ সমর্থন করে না।
        </audio>
    </div>

</body>
</html>
