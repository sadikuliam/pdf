<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SHM Scanner Pro</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Cropper.js & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --whatsapp: #25d366; 
            --bg: #0f172a; 
            --card-bg: #1e293b;
            --text: #f8fafc; 
            --text-muted: #94a3b8;
            --border: #334155;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--card-bg); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { height: 35px; width: auto; border-radius: 6px; object-fit: cover; }
        .logo-area span { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .header-actions { display: flex; gap: 8px; }

        .step { display: none; flex: 1; overflow-y: auto; padding: 1.25rem; flex-direction: column; }
        .step.active { display: flex; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 0.85rem 1.25rem; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-whatsapp { background: var(--whatsapp); box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }
        .btn-whatsapp:hover { background: #22bf5b; }
        .btn-outline { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); box-shadow: none; }
        .btn-outline:hover:not(:disabled) { background: #2a374d; }
        .btn-danger { background: #e11d48; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
        
        .editor-container { flex: 1; background: #000; border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 1rem; min-height: 300px; border: 1px solid var(--border); }
        
        .filter-toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1rem; }
        .page-card { background: var(--card-bg); padding: 0.75rem; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        
        .page-card img { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 1 / 1.414; 
            object-fit: contain; 
            background: #ffffff; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
        }
        
        .page-card-actions { 
            display: flex; 
            gap: 5px; 
            justify-content: space-between;
        }
        
        .page-card-actions .btn {
            padding: 6px 8px;
            font-size: 0.8rem;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 1.5rem; border-radius: 16px; display: flex; flex-direction: column; gap: 1rem; }

        #loader-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; gap: 1rem; color: var(--text); }
        .spinner { width: 45px; height: 45px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .action-banner { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; padding: 1rem 1.25rem; border-radius: 14px; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); margin: 0.75rem 1rem 0 1rem; }
    </style>
</head>
<body>

<header>
   <a href="https://pdf.shmwb.in/" target="_self" style="text-decoration: none; color: inherit;">
    <div class="logo-area">
        <img src="LOGO.png" alt="Logo" onerror="this.src='https://via.placeholder.com/35'">
        <span>SHM Scanner Pro</span>
    </div>
</a>
    <div class="header-actions">
        <button class="btn btn-outline" style="padding: 0.35rem 0.7rem; font-size: 0.75rem;" onclick="resetScanner()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>
</header>

<a href="#" onclick="openMergeModal(); return false;" class="action-banner">
    <span><i class="fa-solid fa-file-circle-plus"></i> Merge More PDFs</span>
    <i class="fa-solid fa-arrow-right"></i>
</a>

<div id="loader-overlay">
    <div class="spinner"></div>
    <div id="loader-text">Processing Document...</div>
</div>

<!-- Merge PDF Modal -->
<div id="merge-modal" class="modal">
    <div class="modal-content">
        <h3><i class="fa-solid fa-file-circle-plus"></i> Merge External PDFs</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Select multiple external PDF files to append their pages into your current scanner project.</p>
        <label class="btn btn-outline" style="border-style: dashed; padding: 1.5rem; cursor: pointer; text-align: center;">
            <i class="fa-solid cloud-arrow-up fa-xl fa-solid fa-cloud-arrow-up"></i><br><br>
            <span id="selected-file-label">Choose PDF Files</span>
            <input type="file" id="merge-pdf-input" accept="application/pdf" multiple style="display:none;" onchange="handleMergeFilesSelected(event)">
        </label>
        <div id="selected-files-list" style="max-height: 100px; overflow-y: auto; font-size: 0.8rem; color: var(--text-muted);"></div>
        <div class="btn-group" style="margin-top:0.5rem;">
            <button class="btn btn-outline" onclick="closeMergeModal()">Cancel</button>
            <button class="btn" id="confirm-merge-btn" onclick="executeMergePDFs()" disabled>Merge PDFs</button>
        </div>
    </div>
</div>

<!-- Step 1: Capture / Import -->
<div id="step-1" class="step active" style="justify-content: center;">
    <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px; width: 100%; margin: 0 auto;">
        <label class="btn" style="padding: 2rem; font-size: 1.1rem; flex-direction: column; gap: 0.75rem;">
            <i class="fa-solid fa-camera fa-2x"></i> Capture Document Page
            <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleFile(event)">
        </label>
        <label class="btn btn-outline" style="padding: 1.25rem; font-size: 1rem;">
            <i class="fa-solid fa-images"></i> Import Images / PDFs
            <input type="file" accept="image/*,application/pdf" multiple style="display:none;" onchange="handleMultipleFiles(event)">
        </label>
    </div>
</div>

<!-- Step 2: Edit & Enhance -->
<div id="step-2" class="step">
    <div class="filter-toolbar">
        <button class="filter-btn active" onclick="setFilter('original', this)">Original</button>
        <button class="filter-btn" onclick="setFilter('magic', this)">🪄 Magic Color</button>
        <button class="filter-btn" onclick="setFilter('grayscale', this)">Grayscale</button>
        <button class="filter-btn" onclick="setFilter('bw', this)">B&W High Contrast</button>
    </div>
    <div class="editor-container"><img id="editor-image" /></div>
    <div class="btn-group">
        <button class="btn btn-outline" onclick="goToStep(1)">Cancel</button>
        <button class="btn" onclick="savePage()">Save Page</button>
    </div>
</div>

<!-- Step 3: Preview & Manage -->
<div id="step-3" class="step">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 id="page-count-title" style="font-size: 1rem; font-weight: 600;">Scanned Pages (0)</h3>
        <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="openMergeModal()"><i class="fa-solid fa-file-circle-plus"></i> Merge PDFs</button>
    </div>
    <div class="grid" id="pages-grid"></div>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top: 1rem;">
        <button class="btn btn-outline" onclick="goToStep(1)"><i class="fa-solid fa-plus"></i> Add More Pages</button>
        <div class="btn-group" style="margin-top:0;">
            <button class="btn" style="background: #059669;" onclick="exportPDF()"><i class="fa-solid fa-download"></i> Download PDF</button>
            <button class="btn btn-whatsapp" onclick="sharePDF()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
        </div>
    </div>
</div>

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
    }

    // --- Core Scanner Logic ---
    let pages = []; 
    let cropper = null;
    let currentFilter = 'original';
    let selectedMergeFiles = [];
    const editorImg = document.getElementById('editor-image');
    
    function goToStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step-'+s).classList.add('active');
        if(s === 3) renderGrid();
    }

    function resetScanner() {
        if(confirm("Are you sure you want to discard all scanned pages?")) {
            pages = [];
            renderGrid();
            goToStep(1);
        }
    }

    async function handleFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        loadImageToEditor(file);
    }

    async function handleMultipleFiles(e) {
        const files = Array.from(e.target.files);
        if(files.length === 0) return;
        
        document.getElementById('loader-overlay').style.display = 'flex';
        document.getElementById('loader-text').innerText = 'Importing files...';

        for(let file of files) {
            if (file.type === 'application/pdf') {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdfDoc = await loadingTask.promise;

                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const page = await pdfDoc.getPage(i);
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        pages.push(canvas.toDataURL('image/jpeg', 0.92));
                    }
                } catch (error) {
                    console.error("Error importing PDF file:", error);
                }
            } else if (file.type.startsWith('image/')) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 1200;
                            canvas.height = (img.height / img.width) * 1200;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            pages.push(canvas.toDataURL('image/jpeg', 0.92));
                            resolve();
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }
        }
        
        document.getElementById('loader-overlay').style.display = 'none';
        goToStep(3);
    }

    function loadImageToEditor(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            editorImg.src = ev.target.result;
            goToStep(2);
            if(cropper) cropper.destroy();
            cropper = new Cropper(editorImg, { aspectRatio: 1/1.414, viewMode: 1 });
            currentFilter = 'original';
            document.querySelectorAll('.filter-btn').forEach((b, idx) => b.classList.toggle('active', idx === 0));
        };
        reader.readAsDataURL(file);
    }

    function setFilter(filterType, btnElement) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    async function savePage() {
        document.getElementById('loader-overlay').style.display = 'flex';
        document.getElementById('loader-text').innerText = 'Enhancing Scan Quality...';
        
        setTimeout(() => {
            const canvas = cropper.getCroppedCanvas({ width: 1400 });
            applyFilterToCanvas(canvas, currentFilter);
            pages.push(canvas.toDataURL('image/jpeg', 0.92));
            
            document.getElementById('loader-overlay').style.display = 'none';
            goToStep(3);
        }, 50);
    }

    function applyFilterToCanvas(canvas, filter) {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        if (filter === 'grayscale' || filter === 'bw' || filter === 'magic') {
            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.3) + (data[i + 1] * 0.59) + (data[i + 2] * 0.11);
                if (filter === 'bw') {
                    avg = avg > 130 ? 255 : 0; 
                } else if (filter === 'magic') {
                    avg = avg < 100 ? avg * 0.8 : (avg > 200 ? 255 : avg);
                }
                data[i] = avg;   
                data[i + 1] = avg; 
                data[i + 2] = avg; 
            }
            ctx.putImageData(imgData, 0, 0);
        }
    }

    function renderGrid() {
        const grid = document.getElementById('pages-grid');
        document.getElementById('page-count-title').innerText = `Scanned Pages (${pages.length})`;
        grid.innerHTML = '';
        pages.forEach((p, i) => {
            grid.innerHTML += `
                <div class="page-card">
                    <img src="${p}">
                    <div class="page-card-actions">
                        <button class="btn btn-outline" style="flex: 0.5;" onclick="movePage(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="Move Left/Up"><i class="fa-solid fa-arrow-left"></i></button>
                        
                        <button class="btn btn-danger" onclick="deletePage(${i})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        
                        <button class="btn btn-outline" style="flex: 0.5;" onclick="movePage(${i}, 1)" ${i === pages.length - 1 ? 'disabled' : ''} title="Move Right/Down"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>`;
        });
    }

    function deletePage(index) {
        pages.splice(index, 1);
        renderGrid();
        if(pages.length === 0) goToStep(1);
    }

    function movePage(index, direction) {
        if (direction === -1 && index > 0) {
            let temp = pages[index];
            pages[index] = pages[index - 1];
            pages[index - 1] = temp;
        } else if (direction === 1 && index < pages.length - 1) {
            let temp = pages[index];
            pages[index] = pages[index + 1];
            pages[index + 1] = temp;
        }
        renderGrid();
    }

    function generatePdfBlob(subsetPages = pages) {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        subsetPages.forEach((p, i) => {
            if(i > 0) pdf.addPage();
            pdf.addImage(p, 'JPEG', 10, 10, 190, 277);
        });
        return pdf.output('blob');
    }

    async function exportPDF() {
        if(pages.length === 0) return alert("No pages scanned!");
        const blob = generatePdfBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; 
        a.download = `Document_${Date.now()}.pdf`; 
        a.click();
    }

    async function sharePDF() {
        if(pages.length === 0) return alert("No pages scanned!");
        const blob = generatePdfBlob();
        const file = new File([blob], `Document_${Date.now()}.pdf`, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: 'SHM Scan', text: 'Here is your scanned document.' });
            } catch(err) { console.log("Share cancelled", err); }
        } else {
            alert("Direct sharing is not supported on this browser. Downloading file instead.");
            exportPDF();
        }
    }

    function openMergeModal() {
        selectedMergeFiles = [];
        document.getElementById('selected-file-label').innerText = "Choose PDF Files";
        document.getElementById('selected-files-list').innerHTML = "";
        document.getElementById('confirm-merge-btn').disabled = true;
        document.getElementById('merge-pdf-input').value = "";
        document.getElementById('merge-modal').style.display = 'flex';
    }

    function closeMergeModal() {
        document.getElementById('merge-modal').style.display = 'none';
    }

    function handleMergeFilesSelected(e) {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            selectedMergeFiles = files;
            document.getElementById('selected-file-label').innerText = `${files.length} PDF file(s) selected`;
            
            let fileListHTML = '<ul style="padding-left: 15px; margin-top: 5px;">';
            files.forEach(f => {
                fileListHTML += `<li>${f.name}</li>`;
            });
            fileListHTML += '</ul>';
            document.getElementById('selected-files-list').innerHTML = fileListHTML;
            document.getElementById('confirm-merge-btn').disabled = false;
        }
    }

    async function executeMergePDFs() {
        if (selectedMergeFiles.length === 0) return;

        closeMergeModal();
        document.getElementById('loader-overlay').style.display = 'flex';
        document.getElementById('loader-text').innerText = 'Merging multiple PDF files...';

        try {
            for (let file of selectedMergeFiles) {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    pages.push(canvas.toDataURL('image/jpeg', 0.92));
                }
            }

            document.getElementById('loader-overlay').style.display = 'none';
            renderGrid();
            if(pages.length > 0) goToStep(3);
        } catch (error) {
            console.error("Error merging PDFs:", error);
            document.getElementById('loader-overlay').style.display = 'none';
            alert("Failed to read and merge one or more PDF files. Please ensure they are valid PDFs.");
        }
    }
</script>
</body>
</html>
