<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#18191c">
    <meta name="description" content="SHM কিশোর দিগন্ত - Digital 3D Flipbook Magazine">

    <title>SHM কিশোর দিগন্ত - Digital Flipbook</title>

    <!-- Google Fonts for Bengali & UI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- DearFlip CSS & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #141517;
            font-family: 'Hind Siliguri', 'Inter', system-ui, -apple-system, sans-serif;
            color: #f1f3f5;
        }

        /* Top Header Navigation Bar */
        .magazine-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: linear-gradient(180deg, rgba(20, 21, 23, 0.96) 0%, rgba(20, 21, 23, 0.85) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 9999;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-badge {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 6px 14px;
            font-size: 0.825rem;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .header-btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .header-btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .header-btn-outline {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .header-btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Flipbook Container */
        #shm_flipbook {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100vh - 52px);
            background: radial-gradient(circle at center, #23252a 0%, #131417 100%);
        }

        /* Loading Preloader */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #141517;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #ff4b2b;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 0.95rem;
            color: #94a3b8;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .magazine-header {
                height: 46px;
                padding: 0 0.75rem;
            }

            .header-title {
                font-size: 0.9rem;
            }

            .header-badge {
                font-size: 0.65rem;
                padding: 2px 6px;
            }

            .header-btn {
                padding: 4px 8px;
                font-size: 0.75rem;
            }

            #shm_flipbook {
                top: 46px;
                height: calc(100vh - 46px);
            }
        }
    </style>
</head>

<body>

    <!-- Top Navigation Header -->
    <header class="magazine-header" id="mainHeader">
        <div class="header-title-box">
            <span class="header-badge">ম্যাগাজিন</span>
            <h1 class="header-title">SHM কিশোর দিগন্ত</h1>
        </div>
        <div class="header-actions">
            <button class="header-btn header-btn-outline" id="toggleSoundBtn" title="শব্দ অন/অফ">
                <i class="ti-volume"></i> <span id="soundStatus">সাউন্ড</span>
            </button>
            <a href="https://od.lk/s/MzZfMTI1NzMzMzM1X0w4U3h0/magazine.pdf" download="magazine.pdf" target="_blank" rel="noopener noreferrer" class="header-btn header-btn-primary" title="সরাসরি ডাউনলোড">
                <i class="ti-download"></i> ডাউনলোড
            </a>
        </div>
    </header>

    <!-- Flipbook Host Element -->
    <div id="shm_flipbook">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">ম্যাগাজিন লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন</div>
        </div>
    </div>

    <!-- jQuery & DearFlip Core Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

    <script>
        jQuery(function ($) {

            /* =========================================================================
               1. PDF SOURCE (CORS-ENABLED PROXY STREAM)
               -------------------------------------------------------------------------
               DearFlip downloads PDFs using JavaScript fetch/XHR.
               OpenDrive blocks direct cross-origin access by default.
               Wrapping the URL in corsproxy.io fixes the "CROSS ORIGIN!!" error.
               
               Note: If you download magazine.pdf and place it in the same folder as
               this index.html, you can simply change this to: var activePdfUrl = "magazine.pdf";
            ========================================================================= */

            var rawOpenDriveUrl = "https://od.lk/s/MzZfMTI1NzMzMzM1X0w4U3h0/magazine.pdf";
            var corsProxyPdf = "https://corsproxy.io/?" + encodeURIComponent(rawOpenDriveUrl);

            var activePdfUrl = corsProxyPdf;

            /* =========================================================================
               2. DEARFLIP ADVANCED CONFIGURATION
            ========================================================================= */
            var options = {
                /* 3D Realistic Curved Page Physics via WebGL (auto-falls back to 2D) */
                webgl: true,

                /* Realistic 3D Hardbound Cover */
                hard: "cover",

                /* Reading Direction: Left-to-Right */
                direction: DFLIP.DIRECTION.LTR,

                /* Viewer Background */
                backgroundColor: "#16171a",

                /* Flip Animation Speed (ms) */
                duration: 700,

                /* Responsive Spread: 2 pages on desktop, 1 page on mobile */
                pageMode: DFLIP.PAGE_MODE.AUTO,
                singlePageMode: DFLIP.SINGLE_PAGE_MODE.AUTO,

                /* Enhanced Bengali Font Sharpness & High-DPI Rendering */
                pdfRenderQuality: 1.6,
                maxTextureSize: 2048,

                /* Responsive fitting */
                forceFit: true,
                autoSize: true,

                /* Interactive Page Turn Audio */
                soundEnable: true,

                /* Reader Controls */
                showDownloadControl: true,
                showPrintControl: true,
                showSearchControl: true,
                enableDownload: true,

                /* Navigation & Outline Drawers */
                autoEnableOutline: false,
                autoEnableThumbnail: false,

                /* Bottom Toolbar Layout */
                controlsPosition: DFLIP.CONTROLSPOSITION.BOTTOM,
                allControls: "altPrev,pageNumber,altNext,play,outline,thumbnail,zoomIn,zoomOut,fullScreen,download,more",
                moreControls: "download,print,search",

                /* Ready Hook */
                onReady: function (flipbook) {
                    $("#loadingOverlay").addClass("hidden");
                }
            };

            /* =========================================================================
               3. INITIALIZE THE FLIPBOOK
            ========================================================================= */
            var flipBook = $("#shm_flipbook").flipBook(activePdfUrl, options);

            // Safety fallback to dismiss preloader
            setTimeout(function () {
                $("#loadingOverlay").addClass("hidden");
            }, 4000);

            /* Sound Toggle Control */
            var soundOn = true;
            $("#toggleSoundBtn").on("click", function () {
                soundOn = !soundOn;
                if (flipBook && flipBook.ui) {
                    flipBook.soundEnable = soundOn;
                }
                $(this).find("i").attr("class", soundOn ? "ti-volume" : "ti-volume-off");
                $("#soundStatus").text(soundOn ? "সাউন্ড" : "নিঃশব্দ");
            });

        });
    </script>

</body>

</html>
