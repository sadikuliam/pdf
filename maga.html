<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ম্যাগাজিন - Flipbook</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
        }
        .df-container {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="_df_book df-container" source="magazine.pdf" id="df_manual_book" data-webgl="false"></div>

    <!-- স্ক্রিপ্টগুলো ক্রমানুসারে লোড করতে হবে -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <!-- dFlip-এর রেন্ডার কোয়ালিটি বাড়ানোর সেটিংস -->
    <script>
        var dFlipLocation = "https://cdn.jsdelivr.net/npm/dflip/"; 
        var dFlip = dFlip || {};
        dFlip.defaults = {
            pdfRenderQuality: 2 // জুম করার পর লেখা স্পষ্ট দেখানোর জন্য (আপনি চাইলে 2.5 বা 3 দিয়েও দেখতে পারেন)
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>
    
</body>
</html>
