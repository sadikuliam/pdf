<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141517">
  <title>ম্যাগাজিন</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css">

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #141517;
      color: #f1f3f5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #flipbook {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #flipbook {
      background: radial-gradient(circle at center, #23252a 0%, #131417 100%);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      padding: 24px;
      background: #141517;
      text-align: center;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #loading[hidden] {
      display: none;
    }

    #loading.error {
      background: rgba(20, 21, 23, 0.96);
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ff4b2b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #loading.error .spinner {
      display: none;
    }

    #loading-message {
      max-width: 440px;
      margin: 0;
      color: #d1d5db;
      line-height: 1.6;
    }

    #retry {
      display: none;
      padding: 9px 16px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    #loading.error #retry {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }

      #loading {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main id="flipbook" aria-label="ডিজিটাল ম্যাগাজিন"></main>

  <section id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-message">ম্যাগাজিন লোড হচ্ছে…</p>
    <button id="retry" type="button">আবার চেষ্টা করুন</button>
  </section>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const loading = document.getElementById("loading");
      const message = document.getElementById("loading-message");
      const retry = document.getElementById("retry");
      const pdfUrl = new URL("maga.pdf", window.location.href).href;
      let timeoutId;
      let flipBookInstance;

      function showError() {
        loading.classList.add("error");
        message.textContent =
          "ম্যাগাজিন লোড করা যায়নি। maga.pdf ফাইলটি এই HTML ফাইলের পাশে GitHub-এ আছে কি না দেখে আবার চেষ্টা করুন।";
      }

      function startFlipbook() {
        window.clearTimeout(timeoutId);
        loading.hidden = false;
        loading.classList.remove("error");
        message.textContent = "ম্যাগাজিন লোড হচ্ছে…";
        retry.disabled = true;

        if (!window.jQuery || !window.DFLIP || !window.jQuery.fn.flipBook) {
          showError();
          retry.disabled = false;
          return;
        }

        const options = {
          webgl: true,
          hard: "cover",
          direction: DFLIP.DIRECTION.LTR,
          backgroundColor: "#16171a",
          duration: 600,
          pageMode: DFLIP.PAGE_MODE.AUTO,
          singlePageMode: DFLIP.SINGLE_PAGE_MODE.AUTO,
          pdfRenderQuality: 1.25,
          maxTextureSize: 1536,
          forceFit: true,
          autoSize: true,
          soundEnable: false,
          showDownloadControl: false,
          showPrintControl: false,
          showSearchControl: false,
          enableDownload: false,
          autoEnableOutline: false,
          autoEnableThumbnail: false,
          controlsPosition: DFLIP.CONTROLSPOSITION.BOTTOM,
          allControls: "altPrev,pageNumber,altNext,zoomIn,zoomOut,fullScreen",
          onReady: function () {
            window.clearTimeout(timeoutId);
            loading.hidden = true;
          }
        };

        try {
          flipBookInstance = window.jQuery("#flipbook").flipBook(pdfUrl, options);
          timeoutId = window.setTimeout(showError, 30000);
          retry.disabled = false;
        } catch (error) {
          console.error("Could not start the magazine:", error);
          showError();
          retry.disabled = false;
        }
      }

      retry.addEventListener("click", startFlipbook);
      startFlipbook();
    });
  </script>
</body>
</html>
