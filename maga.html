<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#141517">
    <title>Flipbook</title>

    <!-- DearFlip CSS & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/dflip.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dflip/css/themify-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #141517;
        }

        /* Fullscreen Viewport */
        #shm_flipbook {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #23252a 0%, #131417 100%);
        }

        /* Minimal Loading Spinner */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #141517;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            border-top-color: #ff4b2b;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Main Flipbook Container with DearFlip Bottom Controls -->
    <div id="shm_flipbook">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip/js/dflip.min.js"></script>

    <script>
        jQuery(function ($) {
            // Direct GitHub PDF reference
            var pdfPath = "maga.pdf";

            var dflipOptions = {
                webgl: true,
                hard: "cover",
                direction: DFLIP.DIRECTION.LTR,
                backgroundColor: "#141517",
                duration: 550,
                pageMode: DFLIP.PAGE_MODE.AUTO,
                singlePageMode: DFLIP.SINGLE_PAGE_MODE.AUTO,
                pdfRenderQuality: 1.3,
                maxTextureSize: 1536,
                forceFit: true,
                autoSize: true,
                soundEnable: true,
                showDownloadControl: true,
                showPrintControl: false,
                showSearchControl: false,
                enableDownload: true,
                autoEnableOutline: false,
                autoEnableThumbnail: false,
                // নিচের ডিরেকশন ও কন্ট্রোল বার আগের মতোই সক্রিয় থাকবে
                controlsPosition: DFLIP.CONTROLSPOSITION.BOTTOM,
                allControls: "altPrev,pageNumber,altNext,play,outline,thumbnail,zoomIn,zoomOut,fullScreen,download",
                onReady: function () {
                    $("#loadingOverlay").addClass("hidden");
                }
            };

            // Initialize Flipbook directly from maga.pdf
            $("#shm_flipbook").flipBook(pdfPath, dflipOptions);
        });
    </script>

</body>

</html>
